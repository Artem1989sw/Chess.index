<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаховий тренажер — дебюти та тактика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  :root{
    --bg:#211C17;
    --panel:#2C251E;
    --panel-2:#342C23;
    --line:#4A3F32;
    --ivory:#E8DCC4;
    --walnut:#7C5A3A;
    --walnut-dark:#5E4128;
    --gold:#C08A3E;
    --gold-soft:#E0B36A;
    --olive:#7C9A66;
    --clay:#B0553D;
    --text:#EDE6D8;
    --text-muted:#A79885;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--gold-soft);}

  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}

  header.top{margin-bottom:22px;}
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .theme-toggle{
    appearance:none;
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:1.05rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover{border-color:var(--gold);}
  .theme-toggle:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  body.light-theme{
    --bg:#F4EEE0;
    --panel:#FFFFFF;
    --panel-2:#F0E9D8;
    --line:#D9CBAE;
    --ivory:#F0E4C8;
    --walnut:#8B6B43;
    --walnut-dark:#6B4E2E;
    --gold:#B8863E;
    --gold-soft:#8A6428;
    --olive:#5C7A46;
    --clay:#A34A34;
    --text:#2A2118;
    --text-muted:#6B5C45;
  }
  body.light-theme .piece-w{color:#FFFFFF;text-shadow:0 0 1px #2A1C12,0 0 2px #2A1C12,0 1px 0 #2A1C12;}
  body.light-theme .piece-b{color:#241811;text-shadow:0 0 1px #FFFFFF,0 0 2px #FFFFFF;}
  .stats-line .streak{color:var(--clay);}
  header.top h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:2rem;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:0;
    color:var(--text-muted);
    font-size:0.98rem;
    max-width:56ch;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin:22px 0 18px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    appearance:none;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.95rem;
    padding:10px 4px;
    margin-right:22px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}
  .tab-btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}
  .item-list-label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim,#8a8a99);margin:0.9rem 0 0.3rem 0.2rem;opacity:0.75;}
  .item-list-label:first-child{margin-top:0.2rem;}

  .stats-line{
    color:var(--text-muted);
    font-size:0.85rem;
    margin-bottom:18px;
  }
  .stats-line strong{color:var(--gold-soft);font-weight:600;}

  .layout{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
    .item-list{
      display:flex;
      flex-direction:row;
      overflow-x:auto;
      gap:8px;
      padding-bottom:6px;
    }
    .item-list .item-btn{white-space:nowrap;flex:0 0 auto;}
    .item-list .item-row{flex:0 0 auto;}
  }

  .item-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item-btn{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    padding:10px 12px;
    font-family:var(--font-body);
    font-size:0.88rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .item-btn:hover{border-color:var(--gold);}
  .item-btn.active{border-color:var(--gold);background:var(--panel-2);}
  .item-btn .badge{
    flex:0 0 auto;
    width:16px;height:16px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;color:transparent;
  }
  .item-btn.done .badge{
    background:var(--olive);
    border-color:var(--olive);
  }
  .item-btn.due .badge{
    background:var(--gold);
    border-color:var(--gold);
    color:#241811;
  }
  .item-btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  .item-row{display:flex;align-items:stretch;gap:4px;}
  .item-row .item-btn{flex:1 1 auto;min-width:0;}
  .rep-star{
    appearance:none;
    flex:0 0 auto;
    width:30px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text-muted);
    font-size:0.95rem;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .rep-star:hover{border-color:var(--gold);color:var(--gold-soft);}
  .rep-star.active{color:var(--gold);border-color:var(--gold);}
  .rep-star:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  .main-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
  }
  .item-header{margin-bottom:14px;}
  .item-header .eco{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--gold-soft);
    letter-spacing:0.02em;
  }
  .item-header h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.4rem;
    margin:2px 0 8px;
  }
  .item-header p{margin:0;color:var(--text-muted);font-size:0.92rem;max-width:60ch;}

  .board-area{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    margin-top:16px;
  }

  .board-col{flex:0 0 auto;}

  .board-wrap{position:relative;width:min(420px,88vw);height:min(420px,88vw);}
  .hint-arrows{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:5;
  }
  .hint-arrow{
    stroke-linecap:round;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .hint-arrow.arrow-green{stroke:var(--olive);stroke-width:9;opacity:0.9;}
  .hint-arrow.arrow-red{stroke:var(--clay);stroke-width:7.5;opacity:0.75;}

  .board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    width:min(420px,88vw);
    height:min(420px,88vw);
    border:3px solid var(--walnut-dark);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .sq{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .sq.light{background:var(--ivory);}
  .sq.dark{background:var(--walnut);}
  .sq.selected::after{
    content:"";
    position:absolute;inset:0;
    background:rgba(192,138,62,.45);
  }
  .sq.legal::after{
    content:"";
    position:absolute;
    width:26%;height:26%;
    border-radius:50%;
    background:rgba(44,37,30,.35);
  }
  .sq.legal.has-piece::after{
    width:100%;height:100%;
    border-radius:0;
    background:transparent;
    border:4px solid rgba(44,37,30,.4);
    box-sizing:border-box;
  }
  .sq.last-from, .sq.last-to{box-shadow:inset 0 0 0 3px rgba(192,138,62,.55);}
  .sq.drag-hover::after{
    content:"";
    position:absolute;inset:0;
    background:rgba(184,134,62,.28);
  }
  .sq-coord{
    position:absolute;
    font-family:var(--font-mono);
    font-size:0.62rem;
    font-weight:600;
    line-height:1;
    pointer-events:none;
    opacity:0.8;
    z-index:1;
  }
  .sq-coord.rank{top:2px;left:3px;}
  .sq-coord.file{bottom:2px;right:3px;}
  .sq.light .sq-coord{color:var(--walnut);}
  .sq.dark .sq-coord{color:var(--ivory);}
  .piece{
    font-size:min(9vw,42px);
    line-height:1;
    z-index:2;
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .piece.dragging-source{opacity:.3;}
  .drag-ghost{
    position:fixed;
    top:0; left:0;
    pointer-events:none;
    z-index:1000;
    line-height:1;
    transform:translate(-50%,-50%);
    will-change:transform;
  }
  .piece-w{color:#F7F1E3;text-shadow:0 0 1px #2A1C12,0 0 2px #2A1C12,0 1px 0 #2A1C12;}
  .piece-b{color:#241811;text-shadow:0 0 1px #F7F1E3,0 0 2px #F7F1E3;}

  .info-col{flex:1 1 220px;min-width:220px;}

  .status-msg{
    font-size:0.92rem;
    padding:10px 12px;
    border-radius:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    margin-bottom:12px;
    min-height:20px;
  }
  .status-msg.ok{border-color:var(--olive);color:var(--olive);}
  .status-msg.err{border-color:var(--clay);color:#D98A75;}
  .status-msg.win{border-color:var(--gold);color:var(--gold-soft);}
  .status-msg.warn{border-color:var(--gold);color:var(--text);}

  .move-list{
    font-family:var(--font-mono);
    font-size:0.82rem;
    color:var(--text-muted);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    min-height:46px;
    margin-bottom:12px;
    word-break:break-word;
  }

  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.85rem;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#241811;}
  .btn.primary:hover{background:var(--gold-soft);color:#241811;}

  .hint-text{
    font-size:0.85rem;
    color:var(--text-muted);
    margin-top:8px;
    font-style:italic;
  }

  .explain{
    font-size:0.9rem;
    color:var(--text);
    background:var(--panel-2);
    border-left:3px solid var(--gold);
    padding:10px 12px;
    border-radius:0 6px 6px 0;
    margin-top:12px;
  }

  .move-comment{
    font-size:0.85rem;
    color:var(--text);
    background:var(--panel-2);
    border-left:3px solid var(--olive);
    padding:8px 12px;
    border-radius:0 6px 6px 0;
    margin-top:10px;
  }

  .theory{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .theory h3{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.02rem;
    margin:0 0 6px;
    color:var(--gold-soft);
  }
  .theory .idea{font-size:0.9rem;color:var(--text);margin:0 0 12px;max-width:70ch;}
  .eval-strip-line{
    font-family:var(--font-mono);
    font-size:1.15rem;
    letter-spacing:1px;
    color:var(--gold-soft);
    word-break:break-all;
  }
  .plans-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:14px;
  }
  @media (max-width:560px){.plans-grid{grid-template-columns:1fr;}}
  .plans-col h4{
    font-size:0.78rem;
    text-transform:none;
    color:var(--text-muted);
    margin:0 0 6px;
    font-weight:600;
  }
  .plans-col ul{margin:0;padding-left:18px;font-size:0.86rem;color:var(--text);}
  .plans-col li{margin-bottom:4px;}
  .trap-box{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
  }
  .trap-box .trap-name{
    font-weight:600;
    font-size:0.9rem;
    color:var(--clay);
    margin-bottom:4px;
  }
  .trap-box p{font-size:0.85rem;color:var(--text-muted);margin:0 0 10px;}

  .variations-box{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-top:12px;
  }
  .variations-box h4{margin:0 0 8px;font-size:0.9rem;color:var(--olive);}
  .variation-item{margin-bottom:12px;}
  .variation-item:last-child{margin-bottom:0;}
  .variation-item .variation-name{
    font-weight:600;
    font-size:0.87rem;
    color:var(--gold-soft);
    margin-bottom:2px;
  }
  .variation-item p{font-size:0.85rem;color:var(--text-muted);margin:0 0 8px;}
  .reference-article{margin-top:4px;}
  .reference-article .ref-eco{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--gold-soft);
    letter-spacing:0.02em;
  }
  .reference-article h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.5rem;
    margin:2px 0 6px;
  }
  .item-header .reference-article .ref-tagline,
  .reference-article .ref-tagline{
    font-size:0.95rem;
    color:var(--text-muted);
    font-style:italic;
    margin:0 0 18px;
    max-width:74ch;
  }
  .reference-article h3{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.08rem;
    color:var(--gold-soft);
    margin:24px 0 10px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .reference-article h3:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .item-header .reference-article p,
  .reference-article p{
    margin:0 0 11px;
    color:var(--text);
    font-size:0.94rem;
    max-width:74ch;
  }
  .reference-article ul{margin:0 0 12px;padding-left:20px;max-width:74ch;}
  .reference-article li{margin-bottom:6px;font-size:0.94rem;color:var(--text);}
  .reference-article strong{color:var(--gold-soft);}
  .ref-line{
    display:block;
    font-family:var(--font-mono);
    font-size:0.82rem;
    color:var(--gold-soft);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 12px;
    margin:0 0 12px;
    overflow-x:auto;
    white-space:pre-wrap;
    max-width:74ch;
  }
  .ref-game{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:13px 15px;
    margin-bottom:12px;
    max-width:74ch;
  }
  .ref-game:last-child{margin-bottom:0;}
  .ref-game .ref-game-title{font-weight:600;font-size:0.92rem;color:var(--olive);margin-bottom:5px;}
  .ref-game .ref-game-line{
    display:block;
    font-family:var(--font-mono);
    font-size:0.78rem;
    color:var(--gold-soft);
    margin:0 0 7px;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .ref-game p{margin:0 0 10px;color:var(--text-muted);font-size:0.87rem;}
  .ref-game-btn{font-size:0.82rem;padding:7px 12px;}
  .ref-note{font-size:0.82rem;color:var(--text-muted);font-style:italic;margin:0 0 12px;max-width:74ch;}
  #returnTrainBtn{margin-top:12px;}
  #freePlayBox{margin:4px 0 12px;}
  #freePlayBox .btn{width:100%;}
  .engine-thinking{opacity:.7;font-style:italic;}

  /* ---- Рівні складності задач ---- */
  .diff-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .diff-btn{
    appearance:none;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.76rem;
    padding:5px 11px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .diff-btn:hover{color:var(--text);border-color:var(--gold);}
  .diff-btn.active{border-color:var(--gold);color:var(--gold-soft);background:var(--panel-2);}
  .diff-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;flex:0 0 auto;}
  .diff-dot.easy{background:var(--olive);}
  .diff-dot.medium{background:var(--gold);}
  .diff-dot.hard{background:var(--clay);}
  .item-btn .item-label{display:flex;align-items:center;min-width:0;}
  .item-btn .item-label span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-label-text{display:flex;flex-direction:column;min-width:0;}
  .item-due-note{
    font-size:0.68rem;
    color:var(--text-muted);
    opacity:0.85;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .item-btn.due .item-due-note{color:var(--gold-soft);opacity:1;}

  /* ---- CCT-тренажер (шахи/взяття/загрози) ---- */
  .cct-box{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-top:14px;
  }
  .cct-box h4{margin:0 0 10px;font-size:0.9rem;color:var(--olive);}
  .cct-step{margin-bottom:8px;}
  .cct-step:last-child{margin-bottom:0;}
  .cct-step-btn{width:100%;text-align:left;}
  .cct-answer{
    font-size:0.85rem;
    color:var(--text);
    margin-top:6px;
    padding:8px 10px;
    background:var(--panel);
    border-left:3px solid var(--gold);
    border-radius:0 6px 6px 0;
    display:none;
  }
  .cct-answer.shown{display:block;}

  /* ---- Гра проти бота (Stockfish) ---- */
  .eval-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;}
  .eval-bar{position:relative;width:20px;height:min(420px,88vw);background:#241811;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .eval-bar-fill{position:absolute;left:0;bottom:0;width:100%;background:#F7F1E3;transition:height .35s ease;}
  .eval-bar-label{font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted);}
  .engine-status{font-size:0.8rem;color:var(--text-muted);margin-bottom:10px;}
  .engine-status.ok{color:var(--olive);}
  .engine-status.err{color:#D98A75;}
  .hint-toggle{display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--text-muted);margin-bottom:10px;cursor:pointer;}
  .engine-lines{display:none;margin-bottom:12px;}
  .engine-line{font-family:var(--font-mono);font-size:0.8rem;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:6px;}
  .engine-line-eval{color:var(--gold-soft);font-weight:600;margin-right:8px;}

  /* ---- Аналізатор партії ---- */
  .analyzer-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .analyzer-field label{font-size:0.78rem;color:var(--text-muted);}
  .pgn-input{

  // Від якої вартості фігури (у "пішакових" одиницях, пішак = 100) хід, що
  // залишає її під боєм без компенсації, вважається явним ляпом.
  hangThreshold: { strict: 300, soft: 500 },

  // дозволити вивід ферзя.
  minDevelopedForQueen: { strict: 2, soft: 1 },
  // Те саме — перш ніж дозволити хід крайнім пішаком (a/h) на два поля.
  // Діє лише в строгому режимі (у м'якому цю перевірку вимкнено повністю).
  minDevelopedForRookPawn: 3,
  // Класифікація ходу за втратою оцінки рушія (у тих самих "пішакових"

  {id:"sicilianDragon", name:"Сицилійський захист, Дракон", eco:"B70", side:"white", coreMoves:10,

   moveComments:["Захоплюємо центр і відкриваємо гру.","Сицилійський захист — чорні борються за центр із флангу, уникаючи симетрії.","Розвиваємо коня, готуючи d4.","Чорні готують ...Nf6, не боячись e5 із темпом.","Розкриваємо центр, пропонуючи розмін.","Чорні беруть, відкриваючи лінію «c» для майбутньої тури.","Відновлюємо матеріальну рівність, централізуючи коня.","Розвиваємо коня з нападом на пішака e4.","Захищаємо e4, розвиваючи фігуру.","Дракон: чорні готують фланкетто слона на g7, який тиснутиме на центр по довгій діагоналі.","Готуємо Qd2 і рокіровку в довгу сторону — Югославська атака.","Слон стає на найсильнішу діагональ a1–h8, тиснучи на центр і майбутній ферзевий фланг білих.","Зміцнюємо пішака e4 і забираємо в чорного коня поле g4, готуючи майбутній штурм g2-g4.","Чорні ховають короля, поки лінія «h» ще закрита — пізніше, після зустрічних штурмів, рокіровка стане куди небезпечнішою.","Ферзь готується піти на h6 для розміну чорнопільних слонів або просто підтримати довгу рокіровку — ключовий хід плану Югославської атаки.","Чорні розвивають останнього коня, посилюючи тиск на центральні поля d4 і e5.","Слон переходить на найактивнішу діагональ, націлюючись на пункт f7 — класична розстановка проти Дракона.","Чорні готують ферзевого слона, звільняючи поле c8 для тури і зберігаючи гнучкість.","Білі також ховають короля на ферзевому фланзі — починається класична гонка пішакових штурмів на протилежні фланги, що визначає весь стиль Дракона.","Тура одразу стає на напіввідкриту лінію «c», готуючи розмін чи жертву на c3 у слушний момент — головна контргра чорних у Югославській атаці."],
   description:"Чорні фланкетують слона на g7, створюючи гострий дисбаланс — білі зазвичай рокіруються в довгу сторону й ідуть в атаку пішаками, чорні контратакують по лінії «c» і довгій діагоналі.",

  {id:"french", name:"Французький захист", eco:"C00", side:"black", coreMoves:6,

  {id:"carokann", name:"Захист Каро-Канн", eco:"B10", side:"black", coreMoves:6,

     variations:[

       {name:"Розмінний варіант",moves:["e4","c6","d4","d5","exd5"],note:"Спрощує позицію: обидві сторони розвиваються симетрично, і партія часто зводиться до тонкої боротьби за невеликий плюс."},
       {name:"Атака Панова-Ботвинника (4.c4)",moves:["e4","c6","d4","d5","exd5","cxd5","c4"],note:"Після розміну білі одразу б'ють пішаком c4, прагнучи ізольованого пішака і активної фігурної гри — найгостріша спроба проти Каро-Канна."},

    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Спершу зрозумій ідею a6: чому це корисний, а не «втрачений» темп — він забирає в білих поля b5 і назавжди прибирає ідею Bb5+ чи Nb5.</li>
      <li>Вивчи Англійську атаку (6.Be3) окремо від класичної лінії з 6.Bg5 — сьогодні це два майже різні дебюти з різними планами.</li>
      <li>Розбери Отруєну пішакову (6...Qb6!?) — найгостріша, найдетальніше досліджена лінія в усій сицилійській теорії; вивчати її варто вже маючи впевнену базу.</li>
      <li>Постав собі за мету знати типові пішакові штурми на різні фланги (g4-g5 для білих, b5-b4 для чорних) як автоматизм — у гострих лініях рахунок йде на темпи, а не на «загальну оцінку».</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Англійська атака (6.Be3):</strong> сучасний головний хід. Білі готують f3, Qd2, O-O-O і прямий пішаковий штурм g4-g5, ігноруючи розвиток слона на класичні поля.</p>
    <p><strong>Класична лінія (6.Bg5 e6 7.f4):</strong> веде або до Отруєної пішакової (7...Qb6), або до Варіанту Полугаєвського (7...b5!?) з жертвою фігури заради шаленої контратаки, або до спокійнішого 7...Be7.</p>
    <p><strong>Атака Фішера-Созіна (6.Bc4):</strong> слон одразу цілиться в f7, як у гострих лініях Італійської; улюблена зброя Фішера у 1960-х.</p>
    <p><strong>Варіант Найдорфа-Адамса (6.h3):</strong> тихий, гнучкий хід, що уникає форсованих ліній і залишає білим вибір між кількома системами розвитку залежно від відповіді чорних.</p>
    <p><strong>Поглиблена лінія Англійської атаки:</strong> 6.Be3 e5 7.Nb3 Be6 8.f3 Be7 9.Qd2 O-O 10.O-O-O Nbd7 11.g4 b5 — класична сучасна табія: обидві сторони вже визначились із планом (пішакові штурми на протилежні фланги), і партія перетворюється на прямий перегін темпів, де кожен зайвий хід на власному фланзі важливіший за захист свого короля.</p>
    <h3>Партії чемпіонів світу</h3>
    <div class="ref-game">
      <div class="ref-game-title">Карпов — Каспаров, матчі за звання чемпіона світу, 1985–1990 (кілька партій)</div>
      <span class="ref-game-line">1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 a6 6.Bg5 e6 (класична лінія)</span>
      <p>Найдорф був одним із головних дебютів Каспарова за чорних упродовж усієї кар'єри, включно з поєдинками проти Карпова — саме глибина його підготовки в найгостріших лініях цього дебюту неодноразово приносила перемоги вирішального значення.</p>
    </div>
    <div class="ref-game">
      <div class="ref-game-title">Фішер — Спаський, матч за звання чемпіона світу, Рейк'явік 1972 (стиль Фішера проти Найдорфа)</div>
      <span class="ref-game-line">1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 a6 6.Bc4 (Атака Фішера-Созіна)</span>
      <p>Фішер usав Найдорф і як білими (атакою Созіна), і зі знанням найтонших нюансів як чорними — цей дебют був фундаментом усієї його дебютної підготовки проти 1.e4 упродовж кар'єри, включно з історичним матчем 1972 року.</p>
    </div>

  {id:"sicilianDragon", name:"Сицилійський захист, Дракон", eco:"B70", article:`
    <p class="ref-tagline">Найгостріший варіант сицилійського захисту: слон на g7 дивиться уздовж усієї дошки, а партія перетворюється на гонку пішакових штурмів на протилежні фланги.</p>
    <h3>Ідея та стиль</h3>
    <p>Назву дебют отримав через форму пішакового ланцюга чорних (d6, e7 з ослабленим g6-g7), що нагадувала обриси сузір'я Дракона одному з коментаторів початку XX століття. Це дебют для гравців, які люблять конкретний, форсований рахунок значно більше за спокійне маневрування: у Югославській атаці обидві сторони зазвичай рокіруються в різні боки і мчать одна на одну пішаками, і хто вагається — програє.</p>
    <p>Через високу ціну помилки (одна неточність у гострій лінії штурму часто означає програш за кілька ходів) Дракон рідше зустрічається в матчах за корону, ніж Найдорф чи Шевенінген, — але залишається улюбленцем турнірних бійців і однією з найкрасивіших систем у всій теорії дебютів.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Дракон не пробачає поверхневого знання теорії — перш ніж грати його в турнірі, вивчи типові жертви (Nd5, Nd4/Rxc3) у Югославській атаці напам'ять.</li>
      <li>Зрозумій різницю між рокіровкою білих у коротку сторону (спокійніші лінії) і в довгу (Югославська атака, гостра гонка) — це фактично різні дебюти зі спільним дебютом.</li>
      <li>Постав за мету рахувати штурм у темпах: скільки ходів потрібно білим для мату по лінії «h», і встигають чорні розкрити лінію «c» раніше.</li>
      <li>Розглянь і Прискорений дракон (2...Nc6 3.d4 cxd4 4.Nxd4 g6) як спосіб уникнути найгостріших ліній Югославської атаки за рахунок трохи іншого порядку ходів.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Югославська атака (6.Be3 Bg7 7.f3 O-O 8.Qd2 Nc6 9.O-O-O):</strong> головна лінія сучасної теорії. Білі готують Bh6 (розмін «дракончика» — головного захисника короля), h4-h5 і штурм по лінії «h»; чорні контратакують ходами Nxd4, Rc8 і часто жертвують якість на c3.</p>
    <p><strong>Атака Левенфіша (6.f4):</strong> білі одразу захоплюють простір, відкладаючи розвиток слона — гостріший і менш форсований порядок ходів.</p>
    <p><strong>Класична система (6.Be2):</strong> білі рокіруються в коротку сторону, обираючи спокійнішу, позиційну боротьбу без гонки штурмів.</p>
    <p><strong>Прискорений дракон (2...Nc6, 4...g6):</strong> чорні відкладають ...d6, залишаючи собі можливість зіграти d5 в один хід і уникнути найгостріших ліній.</p>
    <p><strong>Поглиблена лінія Югославської атаки:</strong> 9.Bc4 Bd7 10.O-O-O Rc8 11.Bb3 Ne5 12.h4 h5 13.Bg5 — білі готують Bxf6, знищуючи головного захисника чорного короля, а чорні тим часом розганяють власний штурм ходами b5-b4 і жертвою якості Rxc3; саме ці позиції багато десятиліть вважалися еталоном гострої, форсованої боротьби в дебюті.</p>
    <h3>Партії чемпіонів світу</h3>
    <p class="ref-note">Дракон — радше зброя елітних турнірів і претендентських циклів, ніж головна лінія матчів за корону: надто високий ризик для гри на найвищу ставку. Але його вплив на теорію й репутацію «найкрасивішого» сицилійського варіанта — незаперечний.</p>
    <div class="ref-game">
      <div class="ref-game-title">Фішер — NN-стиль, характерна ідея Атаки Созіна-Фішера проти Дракона, 1960-ті</div>
      <span class="ref-game-line">1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 g6 6.Bc4 (Атака Созіна проти Дракона)</span>
      <p>Фішер здобув репутацію одного з найнебезпечніших виконавців білими проти Дракона саме завдяки гострій, точній грі у Югославській атаці — це вплинуло на цілі покоління гравців, які уникали Дракона проти нього, знаючи глибину його підготовки.</p>
    </div>

  {id:"sicilianScheveningen", name:"Сицилійський захист, Шевенінген", eco:"B80", article:`
    <p class="ref-tagline">«Маленький центр» — чорні свідомо обмежують простір заради гнучкої, важкої для точної атаки структури d6-e6.</p>
    <h3>Ідея та стиль</h3>
    <p>Назва походить від нідерландського міста Схевенінген, де дебют уперше зустрівся на турнірі 1923 року. На відміну від Дракона чи Найдорфа, Шевенінген не визначає одразу, куди піде решта фігур чорних — пішаковий трикутник d6-e6 дає компактну, еластичну структуру, здатну трансформуватися в Найдорф (через a6-b5) чи залишитися «чистим» Шевенінгеном залежно від того, як зіграють білі.</p>
    <p>Це дебют для гравців, які цінують стратегічну гнучкість вище за негайну контратаку: чорні готові трохи потерпіти в просторі на початку заради того, щоб зберегти вибір плану якомога довше.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Головне, що потрібно засвоїти першим, — загроза атаки Кереса (g4-g5 ще до рокіровки); навчись розпізнавати момент, коли потрібен профілактичний хід h6.</li>
      <li>Вивчи Англійську атаку (Be3, f3, Qd2, O-O-O) окремо — сьогодні це найпопулярніший план білих і по суті окрема система.</li>
      <li>Зрозумій, чим Шевенінген відрізняється від «чистого» Найдорфа — і коли вигідно перейти з одного в інший через порядок ходів (5...a6 замість 5...e6).</li>
      <li>Постав за мету навчитися грати як в гострих лініях (проти Кереса), так і в тихіших (проти Be2) — гнучкість дебюту вимагає гнучкості й від гравця.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Атака Кереса (6.g4):</strong> білі одразу йдуть пішаком уперед, не чекаючи завершення розвитку — агресивний план, названий на честь естонського гросмейстера Пауля Кереса.</p>
    <p><strong>Англійська атака (6.Be3):</strong> сучасний головний план — f3, Qd2, довга рокіровка й штурм пішаками g-h, часто у зв'язці з тими самими ідеями, що й в Англійській атаці проти Найдорфа.</p>
    <p><strong>Класичний варіант (6.Be2, 6.f4):</strong> спокійніший розвиток без негайної гонки — білі покладаються на просторову перевагу, а не на форсовану атаку.</p>
    <p><strong>Атака Велімировича (6.Bc4):</strong> слон цілиться в e6, а білі готують швидкий наступ ферзем і конем на короля ще до завершення розвитку — одна з найгостріших спроб проти цієї структури.</p>
    <p><strong>Поглиблена лінія Англійської атаки:</strong> 6.Be3 Nc6 7.f3 Be7 8.Qd2 O-O 9.O-O-O a6 10.g4 Nxd4 11.Bxd4 b5 — знову класична гонка пішакових штурмів; ключова тонкість Шевенінгена саме тут — розмін коня на d4 (11...b5), що вимикає з гри одну з атакувальних фігур білих і виграє чорним дорогоцінний темп на власному фланзі.</p>
    <h3>Партії чемпіонів світу</h3>
    <div class="ref-game">
      <div class="ref-game-title">Карпов — Каспаров, матчі за звання чемпіона світу, 1984–1985</div>
      <span class="ref-game-line">1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 e6 6.Be2 Be7 (класична схема)</span>
      <p>У найдовшому матчі в історії шахів (1984, зупинений без результату) і матчі 1985 року Каспаров неодноразово звертався до структур типу Шевенінген, борючись за контргру на ферзевому фланзі проти позиційного стиску Карпова.</p>
    </div>

  {id:"french", name:"Французький захист", eco:"C00", article:`
    <p class="ref-tagline">Чорні одразу б'ють по центру ходом d5, будуючи міцну, хоч і дещо затиснуту структуру — дебют для терплячих стратегів.</p>
    <h3>Ідея та стиль</h3>
    <p>Отримав назву після партії поштою між лондонським і паризьким шаховими клубами 1834–1836 років, де французька сторона захищалася саме так. Головна стратегічна проблема чорних — слон c8, замкнений власним пішаком e6, — компенсується міцною пішаковою структурою і чіткими планами контргри (удар c5 по основі пішакового ланцюга білих).</p>
    <p>Класичний дебют «других номерів» — Ботвинник, Петросян, Уітлі (Korchnoi), Найт, а в наші дні — Найт Вітюгов та багато інших використовували його як надійну основу репертуару. Підходить гравцям, які готові грати складні, часто закриті позиції, де перевага вимірюється не темпами, а довгостроковими структурними факторами.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Перше, що варто зрозуміти, — доля слона c8: чи виводити його до e6 (втрачаючи час), чи розміняти через Fort Knox (Bd7-c6), чи змиритися з його пасивністю заради міцної структури.</li>
      <li>Вивчи Розмінний і Просунутий варіанти окремо від Класичної системи (3.Nc3/3.Nd2) — стратегія там суттєво різна.</li>
      <li>Розбери пастку у Варіанті просування (6.Bd3?? cxd4 7.cxd4 Nxd4!) — вона показує типову тактичну ідею тиску на пункт d4 у французьких структурах.</li>
      <li>У Вінавері (3.Nc3 Bb4) зрозумій ідею розміну слона на коня заради зіпсованих пішаків білих — це один із найважливіших стратегічних мотивів усього дебюту.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Варіант Тарраша (3.Nd2):</strong> білі уникають зв'язки Bb4, зберігаючи гнучку структуру — головна зброя проти французького захисту з 1970-х (популяризована Каспаровим).</p>
    <p><strong>Класична система (3.Nc3 Nf6):</strong> веде або до Вінавера (3...Bb4), або до спокійнішої Класичної (3...Nf6 4.Bg5/e5).</p>
    <p><strong>Варіант просування (3.e5):</strong> білі захоплюють простір і одразу дають чорним мішень для гри проти слона c8; чорні відповідають c5, атакуючи основу пішакового ланцюга.</p>
    <p><strong>Розмінний варіант (3.exd5):</strong> спрощення структури заради мінімальної, стабільної переваги в симетричній позиції — вибір для тих, хто уникає ризику.</p>
    <p><strong>Вінавер (3.Nc3 Bb4):</strong> найгостріша класична лінія — чорні негайно зв'язують коня і готові розміняти слона на нього, псуючи пішакову структуру білих ціною відставання в розвитку.</p>
    <p><strong>Поглиблена лінія («Отруєна пішакова» Вінавера):</strong> 4.e5 c5 5.a3 Bxc3+ 6.bxc3 Ne7 7.Qg4 Qc7 8.Qxg7 Rg8 9.Qxh7 cxd4 — одна з найглибше досліджених ліній усієї теорії дебютів: білі хапають два пішаки ферзем, поки чорні розкривають лінію «g» і готують контратаку на застряглого в центрі короля білих; тут вирішує не загальна оцінка, а конкретний точний розрахунок на 15–20 ходів наперед.</p>
    <h3>Партії чемпіонів світу</h3>
    <div class="ref-game">
      <div class="ref-game-title">Ботвинник — Таль, матчі за звання чемпіона світу, 1960–1961</div>
      <span class="ref-game-line">1.e4 e6 2.d4 d5 3.Nc3 Bb4 (Вінавер)</span>
      <p>Ботвинник неодноразово звертався до Французького захисту в поєдинках із Талем — коли треба було загасити шалену тактичну ініціативу молодого чемпіона, міцна, важка для розкриття структура французького давала саме ту стабільність, якої бракувало в гостріших дебютах.</p>
    </div>
  `},

  {id:"carokann", name:"Захист Каро-Канн", eco:"B10", article:`
    <p class="ref-tagline">Надійний захист: чорні готують d5, як у Французькому, але заздалегідь звільняють шлях слону c8 — і уникають його головної проблеми.</p>
    <h3>Ідея та стиль</h3>

  {id:"english", name:"Англійський дебют", eco:"A20", article:`
    <p class="ref-tagline">Гнучкий фланговий хід, що відкладає рішення про центр — і саме тому дуже важко готуватися проти нього наперед.</p>

  {id:"kid", name:"Староіндійський захист", eco:"E60", article:`
    <p class="ref-tagline">Чорні свідомо віддають центр білим — щоб згодом атакувати його фігурами й пішаками, часто прямо на короля.</p>
    <h3>Ідея та стиль</h3>
    <p>Один із «гіпермодерних» дебютів, що виник у 1920-х (Рети, Нимцович) і остаточно утвердився в елітній практиці завдяки Болеславському, Бронштейну й особливо Гарі Каспарову, для якого King's Indian став справжньою фірмовою зброєю на все життя. Ідея проста і водночас глибока: спершу контролювати центр здалеку фігурами (Nf6, Bg7), а вже потім вдарити по ньому пішаками (e5 або c5).</p>
    <p>Це дебют для бійців, готових ризикувати заради ініціативи: якщо підрив центру не вдається, чорні можуть залишитися просто в гіршій, стиснутій позиції. Але коли він спрацьовує — атака на короля білих часто буває нищівною, особливо в лініях із замкненим центром і штурмом f5-f4-f3.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Спершу зрозумій два головні плани за чорних залежно від дій білих у центрі: підрив e5 (при відкритому центрі) чи фланговий штурм f5-f4 (при замкненому центрі d5).</li>
      <li>Вивчи Класичну систему (Nf3, Be2, O-O) і Систему Земіша (f3, Be3, Qd2) окремо — плани там суттєво відрізняються.</li>
      <li>Розбери Чотирипішакову атаку (f4) — найагресивнішу спробу білих захопити максимум простору, що вимагає від чорних точної контргри.</li>
      <li>Постав за мету навчитися грати обидва фланги одночасно: часто перегони «хто швидше» на королівському й ферзевому фланзі вирішують партію.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Класична система (Nf3, Be2, O-O, потім d5 і маневр Ne1-d3):</strong> білі замикають центр і перегруповуються, чорні готують f5 через Ne7/Nd7.</p>
    <p><strong>Система Земіша (f3, Be3, Qd2):</strong> білі зміцнюють центр пішаком f3, готуючись до довгої рокіровки й атаки пішаками g4-h4 — одна з найнеприємніших систем для чорних.</p>
    <p><strong>Чотирипішакова атака (f4):</strong> білі захоплюють максимум простору чотирма пішаками (c4-d4-e4-f4) — найагресивніша, хоч і трохи ризикована спроба.</p>
    <p><strong>Система Авербаха (Bg5):</strong> слон одразу тисне на лінію d8-h4, стримуючи звичний план чорних із e5 — гнучка, позиційна альтернатива.</p>
    <p><strong>Поглиблена лінія Класичної системи:</strong> 9...Nd7 10.Be3 f5 11.f3 f4 12.Bf2 g5 — хрестоматійний пішаковий штурм короля білих: чорні жертвують просторовою активністю на ферзевому фланзі заради прямолінійного g5-g4 з подальшим розкриттям ліній проти короля, тоді як білі тим часом проривають ферзевий фланг ходами c5 і a4-a5. Хто раніше дістанеться до короля суперника — той і виграє.</p>
    <h3>Партії чемпіонів світу</h3>
    <div class="ref-game">
      <div class="ref-game-title">Карпов — Каспаров, матч за звання чемпіона світу, Москва 1985</div>
      <span class="ref-game-line">1.d4 Nf6 2.c4 g6 3.Nc3 Bg7 4.e4 d6 5.Nf3 O-O 6.Be2 e5</span>
      <p>У матчі 1985 року, який зробив 22-річного Каспарова наймолодшим чемпіоном світу в історії, Староіндійський захист і споріднений Захист Грюнфельда становили основу його чорного репертуару проти 1.d4 — фірмова гостра, ризикована гра, що якнайкраще пасувала його стилю.</p>
    </div>
  `},

  {id:"nimzo", name:"Захист Німцовича", eco:"E20", article:`
    <p class="ref-tagline">Чорні одразу зв'язують коня c3, борючись за пункт e4 без ходу d5 — один із найглибших стратегічних дебютів усієї теорії.</p>
    <h3>Ідея та стиль</h3>
    <p>Названий на честь Арона Нимцовича, одного з батьків «гіпермодернізму» — школи, що заперечувала обов'язковість негайного захоплення центру пішаками на користь контролю над ним фігурами й, за потреби, готовністю віддати слона за коня заради структурних вад суперника (здвоєні пішаки c3/c4 після розміну на c3). Це дебют для гравців, які мислять довгостроково: результат ходу Bxc3+ часто позначається на всій партії, аж до ендшпілю.</p>
    <p>Через глибину й універсальність Нимцовича захист цінували практично всі найсильніші гравці XX століття — від Капабланки й Ботвинника до Карпова й Крамника — незалежно від того, чи любили вони гостру, чи спокійну гру: дебют дозволяє грати обома способами.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Спершу зрозумій обмін «слон за структуру»: коли вигідно розмінюватися на c3, а коли краще відступити слоном, зберігши пару слонів для суперника, але не даючи йому здвоєних пішаків.</li>
      <li>Вивчи Варіант Земіша (4.a3) окремо — білі одразу змушують чорних визначитися, і гра стає значно гострішою й конкретнішою.</li>
      <li>Розглянь Класичну систему (4.Qc2) — найпопулярніший вибір на найвищому рівні протягом десятиліть, що уникає здвоєних пішаків.</li>
      <li>Пам'ятай про типову тактику з Ne4 після необережного Qxc3 — це один із найважливіших тактичних мотивів усього дебюту.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Варіант Земіша (4.a3 Bxc3+ 5.bxc3):</strong> білі одразу отримують двох слонів і міцний центр ціною здвоєних пішаків — гострий стратегічний двобій, де компенсація не завжди очевидна одразу.</p>
    <p><strong>Класична система (4.Qc2):</strong> ферзь готується взяти на c3 пішаком, а не конем, уникаючи здвоєння — найпопулярніший вибір на найвищому рівні протягом десятиліть.</p>
    <p><strong>Варіант Рубінштейна (4.e3):</strong> найгнучкіший і найпопулярніший практичний вибір — білі спокійно розвиваються, відкладаючи рішення про пішакову структуру.</p>
    <p><strong>Уникаючи Німцовича (4.Nf3) і Каталонська схема (4.g3):</strong> білі свідомо йдуть на новоіндійські чи каталонські структури, оминаючи головні лінії Нимцовича захисту.</p>
    <p><strong>Поглиблена лінія Варіанту Рубінштейна:</strong> 5.Bd3 c5 6.Nf3 Nc6 7.O-O Bxc3 8.bxc3 d6 9.e4 e5 — чорні свідомо будують структуру, майже ідентичну до Староіндійського захисту, тільки вже виграли темп на розмін чорнопільних слонів; білі натомість покладаються на пару слонів і простір, типову компенсацію за здвоєні пішаки c3.</p>
    <h3>Партії чемпіонів світу</h3>
    <div class="ref-game">
      <div class="ref-game-title">Ботвинник — різні суперники, матчі за звання чемпіона світу, 1948–1963</div>
      <span class="ref-game-line">1.d4 Nf6 2.c4 e6 3.Nc3 Bb4 4.e3 O-O 5.Bd3 d5 (Варіант Рубінштейна)</span>
      <p>Ботвинник, «батько» радянської шахової школи, вважав Нимцовича захист одним із найважливіших дебютів усієї теорії й регулярно застосовував його як чорними в матчах проти Смислова, Таля й Петросяна впродовж усього свого чемпіонського правління.</p>
    </div>
    <div class="ref-game">
      <div class="ref-game-title">Каспаров — Карпов, матчі за звання чемпіона світу, 1984–1990</div>
      <span class="ref-game-line">1.d4 Nf6 2.c4 e6 3.Nc3 Bb4 4.Qc2 O-O (Класична система)</span>
      <p>Карпов часто вдавався до Нимцовича захисту як чорними проти Каспарова, шукаючи в його стратегічній глибині противагу гострій, ініціативній грі суперника — один із головних теоретичних фронтів усіх п'яти їхніх матчів.</p>
    </div>
  `},

  {id:"scandinavian", name:"Скандинавський захист", eco:"B01", article:`
    <p class="ref-tagline">Чорні одразу відкривають лінію в центрі й забирають пішака ферзем — найпряміша, найпростіша для розуміння відповідь на 1.e4.</p>
    <h3>Ідея та стиль</h3>
    <p>Один із найстаріших зафіксованих дебютів (аналізувався ще у трактаті Люцени 1497 року), проте довгий час вважався надто прямолінійним для елітної практики — вихід ферзя на d5/a5 раннім темпом дозволяє білим розвиватися з нападами. Сучасна теорія, утім, показала, що втрачені темпи не такі страшні, як здавалося: чорні швидко надолужують розвиток, а простота позиції — це саме по собі перевага для практичної гри.</p>
    <p>Підходить гравцям, які цінують ясність над глибиною: тут менше форсованих ліній для запам'ятовування, ніж у Сицилійському захисті, а зрозумілі плани (розвиток, надійне поле для ферзя, рокіровка) працюють у переважній більшості партій.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Обери одне поле для відступу ферзя (a5, d6 або d8) і вивчи його досконально — розпорошуватися між усіма трьома на початку не варто.</li>
      <li>Розбери пастку Леонгардта — вона показує, наскільки небезпечно ганятися за зайвим матеріалом ферзем на ранній стадії партії.</li>
      <li>Познайомся із Сучасним варіантом (2...Nf6) як альтернативою негайному 2...Qxd5 — трохи інша, гнучкіша структура з тим самим духом дебюту.</li>
      <li>Вивчи типовий план c6-Bf5-e6, що дає чорним стійку, хоч і скромну структуру, схожу на Каро-Канн, але на хід швидше в розвитку деяких фігур.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Головна лінія (2...Qxd5 3.Nc3 Qa5):</strong> ферзь відступає на найактивніше поле, зберігаючи зв'язку по діагоналі й тиск на e5/c3.</p>
    <p><strong>Відступ на d6:</strong> ховає ферзя від подальших темпів і залишає йому шлях на e7 чи допомогу в захисті короля — обережніший вибір.</p>
    <p><strong>Сучасний варіант (2...Nf6):</strong> чорні спершу розвивають коня, плануючи забрати пішак d5 конем із темпом пізніше, а не одразу ферзем.</p>
    <p><strong>Ісландський гамбіт (2...Nf6 3.c4 e6!?):</strong> чорні жертвують ще одного пішака заради стрімкого розвитку та відкритих ліній — азартний вибір для практичної гри.</p>
    <p><strong>Поглиблена лінія головної системи:</strong> 7.Bd2 e6 8.Qe2 Bb4 9.O-O-O Nbd7 10.Kb1 O-O-O 11.Ne4 — після взаємних довгих рокіровок партія перетворюється на гостру позиційну боротьбу без прямого пішакового штурму: білі централізують коня на e4, пропонуючи розміни, а чорні тримають напругу, покладаючись на швидкий розвиток, яким компенсували втрачені на дебютних кроках темпи.</p>
    <h3>Партії чемпіонів світу</h3>
    <p class="ref-note">Чесно кажучи, Скандинавський захист майже не з'являвся в класичних матчах за звання чемпіона світу — його вважали занадто прямолінійним для боротьби на найвищу ставку. Натомість це популярна практична зброя в швидких шахах і бліці, де простота позиції та економія часу на годиннику важать більше за глибину теорії; кілька чемпіонів світу, зокрема Магнус Карлсен, епізодично застосовували його саме в такому контексті.</p>
  `},

  {id:"budapest", name:"Будапештський гамбіт", eco:"A51", article:`
    <p class="ref-tagline">Чорні одразу жертвують пішака, щоб миттєво відіграти його назад конем і випередити суперника в розвитку — компактний, підступний гамбіт.</p>
    <h3>Ідея та стиль</h3>
    <p>Дебют отримав назву від турніру в Будапешті 1918 року, де його вперше застосували на практиці; одним із перших серйозних теоретиків і популяризаторів дебюту був Єфим Боголюбов — гравець, що двічі, у 1929 і 1934 роках, змагався за звання чемпіона світу проти Альохіна. Ідея контрастує із Староіндійським захистом: замість повільного тиску фігурами здалеку, чорні одразу форсують події, роблячи ставку на конкретний тактичний розрахунок уже на 3–4-му ході.</p>
    <p>Це типовий дебют-«сюрприз»: він рідко трапляється на найвищому рівні як основна зброя, зате чудово працює проти суперників, які покладаються на загальні принципи розвитку, а не на конкретне знання пасток.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Вивчи пастку Кінінгера (7...Ngxe5! і задушений мат після 8.axb4?? Nd3#) — це, мабуть, найвідоміша тактична ідея всього дебюту.</li>
      <li>Розбери Варіант Фаяровича (4...Ne4) як альтернативу головній лінії з Ng4 — трохи інший спосіб боротьби за темп.</li>
      <li>Зрозумій, що робити проти Відхиленого гамбіту (3.d5!?) — багато суперників уникають ускладнень узагалі, і потрібен окремий план проти цього.</li>
      <li>Постав за мету рахувати конкретні варіанти на кілька ходів наперед — цей дебют винагороджує точність значно більше, ніж загальне розуміння позиції.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Головна лінія (4.Bf4 Nc6 5.Nf3 Bb4+):</strong> чорні тиснуть на e5 і f2 фігурами, готуючи Ngxe5 у слушний момент.</p>
    <p><strong>Варіант Адлера (4.Nf3):</strong> білі просто розвивають коня, не поспішаючи захищати пішака e5 слоном, — тихіший підхід, що часто веде до швидкого повернення матеріалу.</p>
    <p><strong>Варіант Алехіна (4.e4):</strong> білі тримають зайвого пішака, зміцнюючи центр і погоджуючись повернути його трохи пізніше, але на вигідніших умовах.</p>
    <p><strong>Відхилений гамбіт (3.d5):</strong> білі відмовляються від матеріалу взагалі, займаючи простір, — гострих ускладнень при цьому не виникає.</p>
    <p><strong>Поглиблено — чому пішак повертається сам:</strong> у головній лінії, якщо білі обережні (7.a3! замість автоматичного розвитку), чорні все одно відіграють матеріал: 7...Ngxe5 8.Nxe5 Qxe5, і позиція приблизно рівна — чорні отримали повністю розвинені фігури та пару слонів за тимчасово віддану пішака, а не програний матеріал назавжди.</p>
    <h3>Партії чемпіонів світу</h3>
    <p class="ref-note">Будапештський гамбіт практично ніколи не зустрічався в матчах за звання чемпіона світу — надто ризиковано для боротьби на найвищу ставку. Проте варто пам'ятати: одним із перших і найглибших дослідників дебюту був Єфим Боголюбов, який сам двічі грав матчі за корону проти Альохіна (1929, 1934) — щоправда, не цим дебютом, а класичнішими системами. Це нагадування, що навіть «несерйозні» дебюти іноді розробляють дуже серйозні гравці.</p>

  {id:"pirc", name:"Захист Пірца-Уфімцева", eco:"B07", article:`

  {id:"alekhine", name:"Захист Алехіна", eco:"B02", article:`
    <p class="ref-tagline">Чорні провокують білих захопити весь центр пішаками — щоб потім зруйнувати цей перерозтягнутий центр фігурами й пішаковими підривами.</p>
    <h3>Ідея та стиль</h3>
    <p>Дебют носить ім'я четвертого чемпіона світу Олександра Альохіна, який уперше застосував хід 1...Nf6 на турнірі в Будапешті 1921 року — за шість років до того, як він здобув титул чемпіона світу, перемігши Капабланку. Це чи не найяскравіший приклад «гіпермодерної» філософії: чорні свідомо провокують білих на подальші пішакові ходи (c4, d4, f4), перетворюючи простір суперника на майбутню мішень.</p>
    <p>Дебют для гравців з тонким відчуттям динамічного балансу: якщо недооцінити момент підриву, білі просто задавлять простором; якщо розрахувати правильно — перерозтягнутий центр обвалюється, а фігури чорних раптово опиняються значно активнішими.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Вивчи Чотирипішакову атаку (c4, d4, f4) окремо — найпринциповіша й найнебезпечніша відповідь білих, що вимагає від чорних точного знання підривів c5/f6.</li>
      <li>Розберись у Системі з Nc3 і Сучасній системі з Nf3 — обидві уникають максимального захоплення простору, пропонуючи спокійнішу гру.</li>
      <li>Зверни увагу на Розмінний варіант (exd6) — він знімає частину напруги, спрощуючи позицію на користь стабільнішої, хоч і менш амбітної гри для чорних.</li>
      <li>Постав за мету навчитися точно відчувати момент, коли центр білих стає слабкістю, а не силою — це серцевина всієї стратегії дебюту.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Чотирипішакова атака (2.e5 Nd5 3.d4 d6 4.c4 Nb6 5.f4):</strong> білі йдуть на максимум, займаючи чотирма пішаками весь центр, — найгостріша і теоретично найпринциповіша спроба спростувати ідею дебюту.</p>
    <p><strong>Система з Nc3 (3.Nc3):</strong> замість негайного d4 білі пропонують розмін, уникаючи найгостріших ліній Чотирипішакової атаки.</p>
    <p><strong>Сучасна система (3.Nf3):</strong> білі відкладають d4, зберігаючи гнучкість щодо подальшої пішакової структури.</p>
    <p><strong>Розмінний варіант (4.exd6):</strong> білі вирішують напругу в центрі одразу, спрощуючи позицію ціною частини теоретичної переваги.</p>
    <p><strong>Поглиблена лінія Чотирипішакової атаки:</strong> 5...Nb6 6.exd6 exd6 7.Nc3 g6 8.Be3 Bg7 9.Nf3 O-O 10.Be2 — чорні обирають фланкетто замість класичного розвитку слона, будуючи гнучку структуру, дуже схожу на Староіндійський захист; ключове стратегічне питання дебюту — чи встигнуть чорні підірвати перерозтягнутий центр білих раніше, ніж той перетвориться на нищівну просторову перевагу.</p>
    <h3>Партії чемпіонів світу</h3>
    <p class="ref-note">Сам Альохін уславив цей дебют не в матчах за корону, а саме в турнірній практиці 1920-х років, зокрема в тому історичному Будапешті 1921 року, — і саме ця перемога над консервативнішим розумінням дебютної теорії стала однією зі сходинок до його чемпіонського титулу 1927 року. У власних матчах за корону (проти Капабланки 1927, Боголюбова 1929 і 1934, Ойве 1935 і 1937) Альохін як чорними здебільшого покладався на класичніші системи.</p>

  {id:"london", name:"Лондонська система", eco:"D02", article:`
    <p class="ref-tagline">Гнучка схема розвитку за білих: слон виходить на f4 ще до e3, після чого білі будують міцну структуру майже незалежно від дій чорних.</p>
    <h3>Ідея та стиль</h3>
    <p>Назва пов'язана з міжнародним турніром у Лондоні 1922 року, де систему застосовували кілька учасників. Десятиліттями вона вважалася суто клубним, «нетеоретичним» вибором для гравців, які не хочуть вчити багато теорії, — але у 2016–2019 роках пережила справжній елітний ренесанс: Магнус Карлсен, Ян Непомнящий, Дінг Ліжень та інші почали регулярно застосовувати її в турнірній практиці найвищого рівня, показавши, що «схемний» дебют може приховувати неабияку отруйність.</p>
    <p>Ідеально підходить гравцям, які цінують передбачуваність і мінімальний ризик потрапити під чужу домашню підготовку: майже завжди можна розвиватися за однією й тією ж схемою (Bf4, e3, Nf3, Bd3 чи Be2, c3, Nbd2), незалежно від того, що роблять чорні.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Вивчи базову схему розвитку напам'ять (Bf4-e3-Nf3-Bd3/Be2-c3-Nbd2) — і зрозумій, у якому порядку її можна порушувати залежно від відповіді чорних.</li>
      <li>Розбери типовий маневр Bg3 (замість розміну на d6/e5) і подальше Ne5 — це головна атакувальна ідея сучасної Лондонської системи.</li>
      <li>Познайомся з планом чорних через фланкетто (g6, Bg7) і зрозумій, чому слон f4 залишається корисним навіть тоді.</li>
      <li>Пам'ятай про слабкість, яку може створити хід Qb6 чорних, — типова перевірка того, чи білі вміють захищати пункт b2.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Основна схема (2.Bf4 Nf6 3.Nf3 c5 4.e3 Nc6 5.Nbd2 e6 6.c3 Bd6):</strong> білі відповідають Bg3 замість розміну, зберігаючи слона на активній діагоналі й переходячи до Bd3-Ne5.</p>
    <p><strong>Проти фланкетто чорних (2...g6):</strong> слон f4 усе одно вже поза грою власних пішаків — білі просто продовжують за планом (e3, Nf3, c3).</p>
    <p><strong>Дзеркальний розвиток (Bf5 у відповідь):</strong> чорні також виводять слона до ходу e6, за тим самим принципом, що й білі, уникаючи типової проблеми «поганого» слона в багатьох закритих дебютах.</p>
    <p><strong>Інший порядок ходів (1.d4 Nf6 2.Bf4):</strong> слон виходить на f4 навіть до ходу d5 з боку чорних, оскільки план білих майже не залежить від відповіді суперника.</p>
    <p><strong>Поглиблено — після розміну на e5:</strong> 10.Bxe5 Nd7!? 11.Bg3 f5!? — сучасний, гостріший спосіб оскаржити центральну фігуру білих: чорні одразу женуть слона назад пішаком f5, готові навіть трохи послабити власного короля заради активності. Це один із головних аргументів, чому Лондонська система в елітній практиці вимагає значно точнішої гри, ніж здається на перший погляд.</p>
    <h3>Партії чемпіонів світу</h3>
    <p class="ref-note">У класичних матчах за звання чемпіона світу Лондонська система поки що не з'являлася — чемпіони традиційно обирають гостріші, конкретніші дебюти, коли на кону титул. Проте в звичайній турнірній та швидкій практиці найвищого рівня її з успіхом застосовували і чинні, і колишні чемпіони світу — Магнус Карлсен і Дінг Ліжень зокрема, — що остаточно зняло з дебюту тавро «несерйозного».</p>

  {id:"scotch", name:"Шотландська партія", eco:"C45", article:`
    <p class="ref-tagline">Білі одразу розкривають центр, обмінюючи пішака d4, щоб отримати простір і активні фігури, — і несподівано ефективна зброя проти найглибше підготовлених суперників.</p>
    <h3>Ідея та стиль</h3>
    <p>Назва пов'язана з матчем по листуванню між Единбургом і Лондоном 1824–1828 років, де шотландська сторона застосовувала цей план. Довгий час дебют вважався надто прямолінійним для елітної практики — доки Гарі Каспаров не воскресив його як несподівану зброю проти Анатолія Карпова в їхньому фінальному матчі за корону 1990 року, коли глибина домашньої підготовки Карпова в Іспанській партії стала для Каспарова проблемою, яку простіше було обійти, ніж вирішити.</p>
    <p>Підходить гравцям, які прагнуть гострої, конкретної гри з мінімумом «книжкового» маневрування: на відміну від повільної Іспанської партії, тут напруга в центрі вирішується вже на 4-му ході, і партія відразу набуває виразного, часто тактичного характеру.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Вивчи Головну відповідь чорних (4...Nf6, атака на e4) — найпринциповіший і найпоширеніший вибір на практиці.</li>
      <li>Розглянь Класичну систему (4...Bc5) як альтернативу з дещо іншим типом позицій і взаємними шансами.</li>
      <li>Розбери гострий випад 4...Qh4 — рідкісний, але небезпечний практичний сюрприз, що вимагає від білих точності буквально з перших ходів.</li>
      <li>Познайомся з Шотландським гамбітом (4.Bc4 замість негайного повернення матеріалу) — жертва пішака заради розвитку й тиску на f7.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Головна відповідь чорних (4...Nf6):</strong> атакувати пішак e4 конем одразу, не гаючи часу на повільний розвиток, — найпоширеніший сучасний вибір.</p>
    <p><strong>Класична система (4...Bc5):</strong> чорні розвивають слона одразу — головна альтернатива ходу Nf6, що веде до інших типів позицій.</p>
    <p><strong>Шотландський гамбіт (4.Bc4):</strong> білі жертвують пішака заради швидкого розвитку й тиску на f7, відкладаючи його повернення.</p>
    <p><strong>Гострий випад 4...Qh4:</strong> чорні одразу виводять ферзя з нападом на e4 і непрямим тиском на f2 — вимагає від білих точної відповіді (5.Nc3 чи 5.Nb5).</p>
    <p><strong>Поглиблена лінія (Класична система Міеса):</strong> 5.Nxc6 bxc6 6.e5 Qe7 7.Qe2 Nd5 8.c4 Ba6! — знаменитий ресурс чорних: слон одразу зв'язує пішак c4 з ферзем e2, не даючи білим спокійно захистити зайвий простір і фактично змушуючи їх до негайних розмінів; саме цей хід зробив Шотландську партію значно небезпечнішою для білих, ніж вважалося раніше.</p>

  {id:"kingsgambit", name:"Гамбіт короля", eco:"C30", article:`
    <p class="ref-tagline">Один із найстаріших і найромантичніших дебютів у всій історії шахів: білі віддають пішак заради темпу, відкритої лінії «f» і атаки, що починається буквально з другого ходу.</p>
    <h3>Ідея та стиль</h3>
    <p>Гамбіт короля домінував у шаховій практиці XVI–XIX століть — його аналізували ще Руй Лопес і Греко, а в епоху Андерсена й Морфі він був чи не головним дебютом усіх гострих партій (саме в цьому дебюті зіграно легендарну «Безсмертну партію» Андерсена 1851 року). Важливо пам'ятати: офіційний титул чемпіона світу з'явився лише в 1886 році, тож усі ці партії — легендарні, але не «чемпіонські» в формальному сенсі.</p>
    <p>У XX столітті дебют поступово зник з елітної практики через розвиток захисту чорних (передусім Контргамбіт Фалькбеєра), і сьогодні це переважно зброя аматорів, ентузіастів романтичних шахів і — зрідка — гравців найвищого рівня в бліці чи показових партіях, де цінність несподіванки й гострота переважають об'єктивну оцінку дебюту.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Обов'язково вивчи Контргамбіт Фалькбеєра (2...d5) окремо — найпринциповіша й найнебезпечніша відповідь чорних, з якою стикається кожен, хто грає гамбіт короля білими.</li>
      <li>Розбери Гамбіт Муціо (5.O-O!?) — один із найризикованіших і найкрасивіших гамбітів в історії, де білі жертвують коня заради прямої атаки на короля.</li>
      <li>Розглянь Гамбіт слона (3...exf4 4.Bc4) як тихішу альтернативу Гамбіту Кізерицького з тим самим духом швидкого розвитку.</li>
      <li>Пам'ятай про пастку «Ферзь на d5» — вона показує, чому не можна жадібно хапати пішаки, не рахуючи найпростіших тактичних ударів слоном.</li>
    </ul>
    <h3>Основні варіанти</h3>
    <p><strong>Гамбіт Кізерицького (3.Nf3 g4 4.Ne5 чи інші відступи коня):</strong> головна класична лінія прийнятого гамбіту, детально досліджена ще у XIX столітті.</p>
    <p><strong>Контргамбіт Фалькбеєра (2...d5):</strong> замість узяття пішака чорні одразу контратакують у центрі — найпринциповіша й найнебезпечніша відповідь, названа на честь австрійського майстра Ернста Фалькбеєра.</p>
    <p><strong>Гамбіт слона (3...exf4 4.Bc4):</strong> білі одразу розвивають слона на активну діагональ до f7, готуючи Qh5+ чи швидку атаку без зайвих пішакових ходів.</p>
    <p><strong>Гамбіт Муціо (5.O-O!?):</strong> замість відступу конем білі жертвують його ходом рокіровки, розкриваючи лінію «f» проти незахищеного короля, — один із найризикованіших гамбітів усієї теорії.</p>
    <p><strong>Гамбіт короля відхилений (2...Bc5):</strong> чорні не беруть пішака, розвиваючи слона з атакою на f2 і уникаючи гострих ускладнень прийнятого гамбіту.</p>
    <p><strong>Поглиблена лінія Контргамбіту Фалькбеєра:</strong> 3.exd5 e4 4.d3 Nf6 5.dxe4 Nxe4 6.Nf3 Bc5 — чорні жертвують пішака вдруге заради стрімкого розвитку й прямого тиску на пункт f2; білий король застряг у центрі, а фігури чорних розвиваються з темпами — саме через ці ідеї Фалькбеєр і вважається найпринциповішим спростуванням самої ідеї гамбіту короля.</p>
    <h3>Партії чемпіонів світу</h3>
    <p class="ref-note">У жодному офіційному матчі за звання чемпіона світу Гамбіт короля не застосовувався — до появи титулу в 1886 році він був головною зброєю романтичної епохи (Андерсен, Морфі, молодий Стейніц), а після — практично зник з елітної класичної практики. Цікавий сучасний штрих: Гарі Каспаров, уже маючи за плечима чемпіонський титул, зіграв Гамбіт короля в показовій швидкій партії проти Веселіна Топалова (Сараєво, 2000) — і переміг, нагадавши, що навіть «музейний» дебют може засліпити непідготовленого суперника.</p>

/* ===================== ІНТЕРВАЛЬНЕ ПОВТОРЕННЯ (SRS) ===================== */
// Записи прогресу зберігаються як {done, reps, lastAt, dueAt}. Стара версія
// зберігала просто true/false — така позначка трактується як «час повторити».
const DAY_MS = 24 * 60 * 60 * 1000;
const SRS_MAX_INTERVAL_DAYS = 30;

function isDone(entry){
  return !!entry;
}
function isDue(entry){
  if(!entry) return false;
  if(entry === true) return true; // старий формат — одразу пропонуємо повторити
  return !!(entry.dueAt && entry.dueAt <= Date.now());
}
// Людський формат дати наступного повторення — щоб SRS було видно в
// інтерфейсі, а не лише "прошито" в localStorage.
function formatDueIn(dueAt){
  const days = Math.round((dueAt - Date.now()) / DAY_MS);
  if(days <= 0) return 'сьогодні';
  if(days === 1) return 'завтра';
  if(days < 7) return `за ${days} дн.`;
  try{
    return new Date(dueAt).toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit'});
  }catch(e){
    return `за ${days} дн.`;
  }
}
function markCompleted(key, id){
  const prog = loadProgress(key);
  const prev = prog[id];
  const prevReps = (prev && typeof prev === 'object' && prev.reps) ? prev.reps : 0;
  const reps = prevReps + 1;
  const intervalDays = Math.min(SRS_MAX_INTERVAL_DAYS, Math.pow(2, reps - 1));
  prog[id] = { done:true, reps, lastAt: Date.now(), dueAt: Date.now() + intervalDays * DAY_MS };
  saveProgress(key, prog);
}
function countDue(key, items){
  const prog = loadProgress(key);
  return items.filter(it => isDue(prog[it.id])).length;
}

}

      botBoxEl.style.display = 'none';
      hintArrow1El.style.display = 'none';
      hintArrow2El.style.display = 'none';

      if(helperEngine && helperEngine.worker) helperEngine.worker.postMessage('stop');

      analyzerBoxEl.style.display = 'none';
      mainBtnRowEl.style.display = 'flex';
      boardBadgeEl.style.display = 'none';

      boardAreaEl.style.display = 'flex';
      itemHeaderEl.style.display = '';
      referenceArticleEl.style.display = 'none';

    else if(currentTab === 'cct'){ selectCCT(CCT_PUZZLES[0].id); }
    else if(currentTab === 'bot'){ selectBot(botColor); }

document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(isReplaying) return;
  if(dragActive){ cleanupDrag(); }
  const undone = chess.undo();
  if(!undone) return;
  if(currentTab === 'openings'){
    if(!principleMode && !freePlay){
      moveIndex = Math.max(0, moveIndex - 1);
      if(chess.turn() !== userColor){
        const undone2 = chess.undo();
        if(undone2){ moveIndex = Math.max(0, moveIndex - 1); }
      }
    } else if(chess.turn() !== userColor){
      chess.undo();
      if(principleMode){
        principleGen++; // будь-яка ще не завершена async-оцінка скасованого ходу відкидається
        if(principleMoveLog.length){
          // Інакше скасований хід лишився б у логу й спотворював підсумковий аналіз.
          principleMoveLog.pop();
          analysisBtnBox.style.display = principleMoveLog.length ? 'block' : 'none';
          renderPrincipleMoveStrip();
        }
      }
    }
    setStatus('Хід скасовано. Твій хід.', '');
    moveCommentBox.style.display = 'none';
  } else if(currentTab === 'endgames' && currentEndgameItem.kind === 'technique'){
    if(chess.turn() !== userColor){
      const undone2 = chess.undo();
    }
    setStatus('Хід скасовано. Твій хід.', '');
  } else if(currentTab === 'endgames'){
    endgamePuzzleSolved = false;
    explainBox.style.display = 'none';
    setStatus('Хід скасовано. Спробуй ще раз.', '');
  } else if(currentTab === 'cct'){
    cctSolved = false;
    explainBox.style.display = 'none';
    setStatus('Хід скасовано. Спробуй ще раз.', '');
  } else if(currentTab === 'bot'){
    engineThinking = false;
    botPositionToken++; // застаріла відповідь рушія, що йшла в дорозі, більше не застосовується
    if(chess.turn() !== userColor){
      chess.undo();
    }
    setStatus('Хід скасовано. Твій хід.', '');
  } else {
    puzzleSolved = false;
    explainBox.style.display = 'none';
    setStatus('Хід скасовано. Спробуй ще раз.', '');
  }
  selected = null; legalTargets = []; lastMove = null;
  renderBoard();
  renderMoveList();
  if(currentTab === 'bot') syncBotPosition();
});

function renderItemList(){
  itemListEl.innerHTML = '';
  const progKey = currentTab === 'openings' ? PROG_KEY_OPENINGS : currentTab === 'endgames' ? PROG_KEY_ENDGAMES : currentTab === 'cct' ? PROG_KEY_CCT : PROG_KEY_TACTICS;
  const progress = currentTab === 'reference' ? {} : loadProgress(progKey);
  const items = currentTab === 'openings' ? OPENINGS : currentTab === 'endgames' ? ENDGAMES : currentTab === 'cct' ? CCT_PUZZLES : currentTab === 'reference' ? REFERENCE : PUZZLES;

  const addItemBtn = (it)=>{
    const entry = progress[it.id];
    const due = isDue(entry);
    const done = isDone(entry);
    const b = document.createElement('button');
    b.className = 'item-btn' + (done ? ' done' : '') + (due ? ' due' : '');
    const dueNoteText = (entry && typeof entry === 'object' && entry.dueAt && !due) ? `Повторення: ${formatDueIn(entry.dueAt)}` : '';
    b.title = due ? 'Час повторити ще раз' : dueNoteText ? dueNoteText : (done ? 'Вже пройдено' : '');
    const dot = it.difficulty ? `<span class="diff-dot ${it.difficulty}" title="${DIFFICULTY_LABELS[it.difficulty]}"></span>` : '';
    const dueNoteHtml = dueNoteText ? `<span class="item-due-note">${dueNoteText}</span>` : '';
    b.innerHTML = `<span class="item-label">${dot}<span class="item-label-text"><span class="txt">${it.name || it.theme}</span>${dueNoteHtml}</span></span><span class="badge">${due ? '↻' : ''}</span>`;
    b.addEventListener('click', ()=>{
      if(currentTab === 'openings') selectOpening(it.id);
      else if(currentTab === 'endgames') selectEndgame(it.id);
      else if(currentTab === 'cct') selectCCT(it.id);
      else if(currentTab === 'reference') selectReference(it.id);
      else selectPuzzle(it.id);
    });
    b.dataset.id = it.id;
    if(currentTab === 'openings'){
      // Зірочка — окрема кнопка поряд, а не всередині item-btn (вкладати
      // <button> в <button> не можна — браузер поламає розмітку).
      const row = document.createElement('div');
      row.className = 'item-row';
      const star = document.createElement('button');
      star.type = 'button';
      const mine = isInRepertoire(it.id);
      star.className = 'rep-star' + (mine ? ' active' : '');
      star.title = mine ? 'Прибрати з мого репертуару' : 'Додати до мого репертуару';
      star.textContent = mine ? '★' : '☆';
      star.addEventListener('click', (e)=>{
        e.stopPropagation();
        toggleRepertoire(it.id);
        renderItemList();
      });
      row.appendChild(b);
      row.appendChild(star);
      itemListEl.appendChild(row);
    } else {
      itemListEl.appendChild(b);
    }
  };

  if(currentTab === 'endgames'){
    const label1 = document.createElement('div');
    label1.className = 'item-list-label';
    label1.textContent = 'Техніка мату';
    itemListEl.appendChild(label1);
    ENDGAME_TECHNIQUES.forEach(addItemBtn);
    const label2 = document.createElement('div');
    label2.className = 'item-list-label';
    label2.textContent = 'Пішакові ендшпілі й опозиція';
    itemListEl.appendChild(label2);
    ENDGAME_PUZZLES.forEach(addItemBtn);
  } else if(currentTab === 'tactics'){
    renderDifficultyFilter();
    const filtered = tacticsFilter === 'all' ? PUZZLES : PUZZLES.filter(p=>p.difficulty===tacticsFilter);
    if(filtered.length){
      filtered.forEach(addItemBtn);
    } else {
      const empty = document.createElement('div');
      empty.className = 'item-list-label';
      empty.textContent = 'Немає задач цього рівня.';
      itemListEl.appendChild(empty);
    }
  } else if(currentTab === 'openings'){
    renderStrictnessToggle();
    renderOpeningsFilter();
    const rep = loadRepertoire();
    let filtered = OPENINGS;
    if(openingsFilter === 'white') filtered = OPENINGS.filter(o=>o.side==='white');
    else if(openingsFilter === 'black') filtered = OPENINGS.filter(o=>o.side==='black');
    else if(openingsFilter === 'mine') filtered = OPENINGS.filter(o=>rep[o.id]);
    if(filtered.length){
      filtered.forEach(addItemBtn);
    } else {
      const empty = document.createElement('div');
      empty.className = 'item-list-label';
      empty.textContent = 'У репертуарі поки порожньо — познач ★ біля потрібних дебютів.';
      itemListEl.appendChild(empty);
    }

    renderBotColorPicker();

    {key:'easy', label:'Легкі'},
    {key:'medium', label:'Середні'},
    {key:'hard', label:'Складні'}
  ];
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'diff-btn' + (tacticsFilter === opt.key ? ' active' : '');
    const count = opt.key === 'all' ? PUZZLES.length : PUZZLES.filter(p=>p.difficulty===opt.key).length;
