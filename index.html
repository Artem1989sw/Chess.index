function buildRefQuiz(container, id){
  const questions = REF_QUIZZES[id];
  if(!questions || !questions.length) return;
  const section = document.createElement('div');
  section.className = 'ref-quiz';
  section.innerHTML = '<h3>Перевір себе</h3>';
  questions.forEach((q, qi)=>{
    const qBox = document.createElement('div');
    qBox.className = 'ref-quiz-q';
    const qText = document.createElement('p');
    qText.className = 'ref-quiz-question';
    qText.textContent = (qi + 1) + '. ' + q.q;
    qBox.appendChild(qText);
    const optsBox = document.createElement('div');
    optsBox.className = 'ref-quiz-options';
    // Порядок варіантів перемішується при кожному показі: у даних правильна відповідь майже
    // завжди друга й найдовша, тож без цього квіз «вгадується» за формою, а не за знаннями.
    const order = q.options.map((_, i) => i);
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.forEach((oi)=>{
      const optText = q.options[oi];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ref-quiz-opt';
      btn.dataset.idx = oi;
      btn.textContent = optText;
      btn.addEventListener('click', ()=>{
        const allBtns = optsBox.querySelectorAll('.ref-quiz-opt');
        allBtns.forEach(b => b.disabled = true);
        if(oi === q.correct){
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
          const right = optsBox.querySelector('.ref-quiz-opt[data-idx="' + q.correct + '"]');
          if(right) right.classList.add('correct');
        }
      });
      optsBox.appendChild(btn);
    });
    qBox.appendChild(optsBox);
    section.appendChild(qBox);
  });
  container.appendChild(section);
}

/* ===================== ДОВІДНИК =====================
   Суто текстова вкладка: жодної дошки й жодного стану гри, лише стаття з
   REFERENCE. clearReplayTimers на всяк випадок, якщо сюди перейшли просто
   посеред автопрогравання лінії дебюту. */
function selectReference(id){
  clearReplayTimers();
  const ref = REFERENCE.find(r=>r.id===id);
  if(!ref) return;
  currentReference = ref;
  boardAreaEl.style.display = 'none'; // дошку показує лише клік на "Переглянути партію", кожна нова стаття починається без неї
  referenceArticleEl.innerHTML = `
    <div class="ref-eco">${ref.eco}</div>
    <h2>${ref.name}</h2>
    ${OPENINGS.some(o=>o.id===ref.id) ? `<button class="btn" id="openTrainerBtn">🎯 Тренувати цей дебют</button>` : ''}
    ${ref.article}
  `;
  buildRefQuiz(referenceArticleEl, ref.id);
  buildRefQuickNav(referenceArticleEl);
  insertRefDiagram(referenceArticleEl, ref.id);
  applyCrossLinks(referenceArticleEl, ref.id);
  applyGlossaryTooltips(referenceArticleEl);
  const openTrainerBtn = document.getElementById('openTrainerBtn');
  if(openTrainerBtn){
    openTrainerBtn.addEventListener('click', ()=>{
      document.querySelector('[data-tab="openings"]').click();
      selectOpening(ref.id);
    });
  }
  const gameData = REFERENCE_GAMES[id] || [];
  referenceArticleEl.querySelectorAll('.ref-game').forEach((box, i)=>{
    const data = gameData[i];
    if(!data) return;
    const lineEl = box.querySelector('.ref-game-line');
    if(lineEl) lineEl.textContent = sanListToPgnText(data.moves);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn ref-game-btn';
    btn.textContent = '▶ Переглянути партію на дошці';
    btn.addEventListener('click', ()=>{
      const title = box.querySelector('.ref-game-title')?.textContent || ref.name;
      const note = box.querySelector('p')?.textContent || '';
      replayReferenceGame(data.moves, title, note);
    });
    box.appendChild(btn);
  });
  updateActiveItem();
}

// Формує "1. e4 e5 2. Nf3 …" з масиву SAN-ходів — той самий формат, що показує renderMoveList.
function sanListToPgnText(moves){
  let out = '';
  for(let i=0;i<moves.length;i+=2){
    const num = i/2 + 1;
    out += num + '. ' + moves[i] + (moves[i+1] ? ' ' + moves[i+1] + '  ' : '');
  }
  return out.trim();
}

// Програє партію з довідника на спільній дошці, не чіпаючи стан жодної іншої
// вкладки — дошка з'являється просто під статтею, поки currentTab лишається 'reference'.
function replayReferenceGame(moves, title, note){
  boardAreaEl.style.display = 'flex';
  flipped = false;
  startLineReplay(null, {name: title, moves, note: note || ''}, 'game', false);
  boardAreaEl.scrollIntoView({block:'nearest'});
}

/* ===================== ПРОСТИЙ РУШІЙ (МІНІМАКС) ===================== */

const ENGINE_DEPTH = 2; // скільки півходів рушій прораховує наперед — свідомо небагато, щоб залишатись «слабким» і швидким
const PIECE_VALUES = {p:100, n:320, b:330, r:500, q:900, k:0};

// Прості таблиці позиційних бонусів (заохочують централізацію), рядок 0 = 8-ма горизонталь
const PAWN_PST = [
  [0,0,0,0,0,0,0,0],
  [50,50,50,50,50,50,50,50],
  [10,10,20,30,30,20,10,10],
  [5,5,10,25,25,10,5,5],
  [0,0,0,20,20,0,0,0],
  [5,-5,-10,0,0,-10,-5,5],
  [5,10,10,-20,-20,10,10,5],
  [0,0,0,0,0,0,0,0],
];
const KNIGHT_PST = [
  [-50,-40,-30,-30,-30,-30,-40,-50],
  [-40,-20,0,0,0,0,-20,-40],
  [-30,0,10,15,15,10,0,-30],
  [-30,5,15,20,20,15,5,-30],
  [-30,0,15,20,20,15,0,-30],
  [-30,5,10,15,15,10,5,-30],
  [-40,-20,0,5,5,0,-20,-40],
  [-50,-40,-30,-30,-30,-30,-40,-50],
];

function evaluateBoard(){
  const board = chess.board(); // board[0] = 8-ма горизонталь ... board[7] = 1-ша
  let score = 0;
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const sq = board[r][c];
      if(!sq) continue;
      let val = PIECE_VALUES[sq.type] || 0;
      const pstRow = sq.color === 'w' ? r : 7-r;
      if(sq.type === 'p') val += PAWN_PST[pstRow][c];
      if(sq.type === 'n') val += KNIGHT_PST[pstRow][c];
      score += sq.color === 'w' ? val : -val;
    }
  }
  return score;
}

function orderedVerboseMoves(){
  const moves = chess.moves({verbose:true});
  moves.sort((a,b)=>{
    const av = a.captured ? (PIECE_VALUES[a.captured]||0) : 0;
    const bv = b.captured ? (PIECE_VALUES[b.captured]||0) : 0;
    return bv - av;
  });
  return moves;
}

const MATE_SCORE = 100000;
function minimax(depth, alpha, beta, maximizing){
  // Мат і нічия оцінюються окремо. Раніше позиція мату мала звичайну матеріальну оцінку,
  // тому рушій «не бачив» мату в один хід і не боявся його. Чим ближче мат — тим краще.
  if(chess.in_checkmate()){
    return chess.turn() === 'w' ? -(MATE_SCORE + depth) : (MATE_SCORE + depth);
  }
  if(chess.in_draw()) return 0;
  if(depth === 0) return evaluateBoard();
  const moves = orderedVerboseMoves();
  if(moves.length === 0) return evaluateBoard();
  if(maximizing){
    let best = -Infinity;
    for(const m of moves){
      chess.move(m.san);
      best = Math.max(best, minimax(depth-1, alpha, beta, false));
      chess.undo();
      alpha = Math.max(alpha, best);
      if(beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for(const m of moves){
      chess.move(m.san);
      best = Math.min(best, minimax(depth-1, alpha, beta, true));
      chess.undo();
      beta = Math.min(beta, best);
      if(beta <= alpha) break;
    }
    return best;
  }
}

// Оцінює ВСІ легальні ходи в поточній позиції на глибину рушія. Повертає й
// саму оцінку кожного ходу — потрібно і для вибору ходу рушія, і для аналізу
// того, наскільки хід гравця в принциповій частині відхилявся від найкращого.
function scoreAllMoves(){
  const moves = orderedVerboseMoves();
  const maximizing = chess.turn() === 'w';
  const scored = moves.map(m=>{
    chess.move(m.san);
    const score = minimax(ENGINE_DEPTH - 1, -Infinity, Infinity, !maximizing);
    chess.undo();
    return {move: m, score};
  });
  return {scored, maximizing};
}

function bestMoveAndScore(){
  const {scored, maximizing} = scoreAllMoves();
  if(scored.length === 0) return null;
  let bestScore = maximizing ? -Infinity : Infinity;
  scored.forEach(s=>{
    if(maximizing ? s.score > bestScore : s.score < bestScore) bestScore = s.score;
  });
  const bestMoves = scored.filter(s=>s.score === bestScore).map(s=>s.move);
  return {
    move: bestMoves[Math.floor(Math.random() * bestMoves.length)],
    score: bestScore,
    maximizing,
    scored
  };
}

function getEngineMove(){
  const result = bestMoveAndScore();
  return result ? result.move : null;
}

function enterFreePlay(){
  freePlay = true;
  freePlayBox.style.display = 'none';
  moveCommentBox.style.display = 'none';
  if(chess.turn() === userColor){
    setStatus('Гра проти комп\'ютера. Твій хід.', '');
  } else {
    setStatus('Гра проти комп\'ютера. Хід суперника...', 'engine-thinking');
    scheduleEngineMove(engineFreePlayMove, 350);
  }
}

function engineFreePlayMove(){
  if(!freePlay && !principleMode) return;
  const mv = getEngineMove();
  if(!mv){ announceGameOver(); return; }
  const played = chess.move(mv.san);
  lastMove = played;
  renderBoard();
  renderMoveList();
  if(chess.game_over()){
    announceGameOver();
  } else {
    setStatus('Твій хід.', '');
  }
}

function announceGameOver(){
  if(chess.in_checkmate()){
    const mated = chess.turn();
    if(mated === userColor){
      setStatus('Мат. Цього разу переміг комп\'ютер — спробуй ще раз!', 'err');
    } else {
      setStatus('Мат! Ти переміг комп\'ютера 🎉', 'win');
      if(currentTab === 'endgames' && currentEndgameItem && currentEndgameItem.kind === 'technique'){
        markCompleted(PROG_KEY_ENDGAMES, currentEndgameItem.id);
        renderItemList();
      }
    }
  } else if(chess.in_stalemate()){
    setStatus('Пат — нічия.', '');
  } else if(chess.in_threefold_repetition()){
    setStatus('Нічия через повторення позиції.', '');
  } else if(chess.insufficient_material()){
    setStatus('Нічия — недостатньо матеріалу для мату.', '');
  } else if(chess.in_draw()){
    setStatus('Нічия.', '');
  } else {
    setStatus('Гру завершено.', '');
  }

  if(currentTab === 'openings' && principleMode && principleMoveLog.length){
    explainBox.style.display = 'block';
    explainBox.innerHTML = renderPrincipleAnalysisHtml();
  }
}

playVsEngineBtn.addEventListener('click', enterFreePlay);
analysisBtn.addEventListener('click', ()=>{
  explainBox.style.display = 'block';
  explainBox.innerHTML = renderPrincipleAnalysisHtml();
});

/* ===================== ПРИНЦИПИ ДЕБЮТУ (вільна частина після обов'язкової лінії) =====================
   Обов'язкова частина дебюту (currentOpening.coreMoves повних ходів) вимагає точний хід із заданої
   лінії. Далі — принципова частина: приймається будь-який легальний хід, який не порушує явно
   базові принципи розвитку, боротьби за центр і безпеки короля; сам "правильний" хід більше не
   один-єдиний. Перевірка навмисно лагідна: заборонені лише явні помилки, а не будь-яке
   відхилення від "ідеальної" теорії. */

function openingCoreHalfMoves(op){
  const core = (op.coreMoves || Math.ceil(op.moves.length / 2)) * 2;
  return Math.min(core, op.moves.length);
}

function findKingSquare(color, src){
  const board = (src || chess).board();
  for(let r=0;r<8;r++){
    for(let c=0;c<8;c++){
      const sq = board[r][c];
      if(sq && sq.type === 'k' && sq.color === color){
        return 'abcdefgh'[c] + (8 - r);
      }
    }
  }
  return null;
}

function homeMinorSquares(color){
  return color === 'w' ? ['b1','c1','f1','g1'] : ['b8','c8','f8','g8'];
}

function countDevelopedMinors(color, src){
  const c = src || chess;
  let developed = 0;
  homeMinorSquares(color).forEach(sq=>{
    const piece = c.get(sq);
    const expectedType = (sq[0] === 'b' || sq[0] === 'g') ? 'n' : 'b';
    if(!piece || piece.type !== expectedType || piece.color !== color){
      developed++;
    }
  });
  return developed;
}

function kingShelterSquares(color, kingSquare){
  if(color === 'w'){
    if(kingSquare === 'g1') return ['f2','g2','h2'];
    if(kingSquare === 'c1') return ['a2','b2','c2'];
  } else {
    if(kingSquare === 'g8') return ['f7','g7','h7'];
    if(kingSquare === 'c8') return ['a7','b7','c7'];
  }
  return [];
}

// Клонує поточну позицію, грає на клоні один пробний хід і віддає результат
// колбека (temp, played). Якщо хід чомусь не зігрався — повертає fallback.
// Усі "а що якщо зіграти цей хід" перевірки нижче клонують позицію через цю
// одну функцію, щоб логіку клонування (наприклад, урахування chess.header())
// довелося міняти в одному місці, а не в трьох.
function withTempMove(candidate, fn, fallback){
  const temp = new Chess(chess.fen());
  const played = temp.move(candidate.san);
  if(!played) return fallback;
  return fn(temp, played);
}

// Дуже спрощена перевірка "чи зависає фігура без компенсації": якщо після ходу
// суперник одразу може забрати щойно переміщену фігуру (вартістю не нижче
// заданого порогу), а відповісти взяттям на тому ж полі нема чим — це явний ляп.
function wouldHangPiece(candidate, threshold){
  const lostValue = PIECE_VALUES[candidate.piece] || 0;
  if(lostValue < (threshold || 300)) return false;
  return withTempMove(candidate, (temp)=>{
    const opponentCaptures = temp.moves({verbose:true}).filter(m => m.to === candidate.to && m.captured);
    if(opponentCaptures.length === 0) return false;
    temp.move(opponentCaptures[0].san);
    const ourRecaptures = temp.moves({verbose:true}).filter(m => m.to === candidate.to && m.captured);
    return ourRecaptures.length === 0;
  }, false);
}

// Ненав'язливі підказки на позицію ПІСЛЯ ходу — не блокують хід, лише
// додаються до статусного повідомлення.
function getPositionAdvisories(color, src){
  const c = src || chess;
  const advisories = [];
  const plyCount = c.history().length;

  const kingSq = findKingSquare(color, c);
  const homeKingSq = color === 'w' ? 'e1' : 'e8';
  if(kingSq === homeKingSq && plyCount >= PRINCIPLE_TUNING.advisoryPlies.castle){
    advisories.push('Король досі в центрі — подумай про рокіровку.');
  }

  const homeRank = color === 'w' ? '2' : '7';
  const centerPawnMoved = ['d','e'].some(file=>{
    const piece = c.get(file + homeRank);
    return !piece || piece.type !== 'p' || piece.color !== color;
  });
  if(!centerPawnMoved && plyCount >= PRINCIPLE_TUNING.advisoryPlies.centerPawn){
    advisories.push('Жоден центральний пішак (d/e) ще не зрушив — варто поборотися за центр.');
  }

  return advisories;
}

function evaluatePrincipleMove(candidate){
  const mover = candidate.color;
  const soft = strictness === 'soft';

  if(wouldHangPiece(candidate, soft ? PRINCIPLE_TUNING.hangThreshold.soft : PRINCIPLE_TUNING.hangThreshold.strict)){
    return {ok:false, reason:'Цей хід залишає фігуру під боєм без жодної компенсації — перевір безпеку фігур.'};
  }

  const givesCheck = candidate.san.indexOf('+') !== -1 || candidate.san.indexOf('#') !== -1;
  const minDevForQueen = soft ? PRINCIPLE_TUNING.minDevelopedForQueen.soft : PRINCIPLE_TUNING.minDevelopedForQueen.strict;
  if(candidate.piece === 'q' && !candidate.captured && !givesCheck && countDevelopedMinors(mover) < minDevForQueen){
    return {ok:false, reason:'Зарано виводити ферзя — спершу розвинь коней і слонів.'};
  }

  if(!soft){
    const isRookPawnDoubleStep = candidate.piece === 'p' && !candidate.captured &&
      (candidate.from[0] === 'a' || candidate.from[0] === 'h') &&
      Math.abs(parseInt(candidate.to[1],10) - parseInt(candidate.from[1],10)) === 2;
    if(isRookPawnDoubleStep && countDevelopedMinors(mover) < PRINCIPLE_TUNING.minDevelopedForRookPawn){
      return {ok:false, reason:'Крайній пішак рідко вартий ходу так рано — краще розвинь фігуру або поборись за центр (e/d).'};
    }

    const kingSquare = findKingSquare(mover);
    const shelter = kingShelterSquares(mover, kingSquare);
    if(candidate.piece === 'p' && !candidate.captured && shelter.includes(candidate.from)){
      return {ok:false, reason:'Не варто без потреби рухати пішаки прикриття власного короля.'};
    }
  }

  const advisories = withTempMove(candidate, (temp)=>getPositionAdvisories(mover, temp), []);
  return {ok:true, warning: advisories.length ? advisories.join(' ') : null};
}

function classifyMoveLoss(lossCp){
  if(lossCp <= 0) return 'best';
  if(lossCp <= PRINCIPLE_TUNING.moveQuality.good) return 'good';
  if(lossCp <= PRINCIPLE_TUNING.moveQuality.inaccuracy) return 'inaccuracy';
  if(lossCp <= PRINCIPLE_TUNING.moveQuality.blunder) return 'mistake';
  return 'blunder';
}

const MOVE_QUALITY_META = {
  best:       {icon:'★', color:'var(--olive)',    label:'Найкращий'},
  good:       {icon:'✓', color:'var(--olive)',    label:'Хороший'},
  inaccuracy: {icon:'?!', color:'var(--gold-soft)', label:'Неточність'},
  mistake:    {icon:'?', color:'var(--clay)',     label:'Помилка'},
  blunder:    {icon:'??', color:'#D64545',        label:'Грубий промах'}
};

// Дуже проста текстова "стрічка оцінки" без жодних графічних бібліотек —
// кожен символ показує, наскільки вигідною була позиція (з точки зору
// гравця) у момент його чергового ходу. Дає змогу візуально побачити, де
// партія почала "сповзати", навіть без списку найгірших ходів.
function renderEvalSparkline(){
  if(principleMoveLog.length < 2) return ''; // одна точка — ще не графік
  const BLOCKS = '▁▂▃▄▅▆▇█';
  const CAP = 400; // за межами ±4 пішаків далі висота стовпчика вже не росте
  const perspective = userColor === 'w' ? 1 : -1;
  const chars = principleMoveLog.map(m=>{
    const val = Math.max(-CAP, Math.min(CAP, (m.evalCp || 0) * perspective));
    const idx = Math.round((val + CAP) / (2 * CAP) * (BLOCKS.length - 1));
    return BLOCKS[idx];
  }).join('');
  return `<p class="idea eval-strip"><strong>Стрічка оцінки:</strong> <span class="eval-strip-line" title="Кожен символ — оцінка позиції на момент твого чергового ходу: нижче — гірше для тебе, вище — краще">${chars}</span></p>`;
}

// Стрічка бейджів якості ходів під час самої гри — щоб було видно ОДРАЗУ
// (найкращий/хороший/неточність/помилка/грубий промах), а не тільки в
// підсумку наприкінці партії чи разовим попередженням про явну помилку.
function renderPrincipleMoveStrip(){
  if(!principleMoveLog.length){ principleMoveStripEl.style.display = 'none'; return; }
  principleMoveStripEl.style.display = 'flex';
  principleMoveStripEl.innerHTML = principleMoveLog.map(m=>{
    if(!m.cls){
      return `<span class="move-chip" title="Рушій ще оцінює…">${m.san}<span class="chip-icon" style="background:var(--text-muted)">⏳</span></span>`;
    }
    const meta = MOVE_QUALITY_META[m.cls];
    return `<span class="move-chip" title="${meta.label}${m.bestSan ? ' — краще було ' + m.bestSan : ''}">${m.moveNo}. ${m.san}<span class="chip-icon" style="background:${meta.color}">${meta.icon}</span></span>`;
  }).join('');
  const last = principleMoveStripEl.lastElementChild;
  if(last) last.scrollIntoView({block:'nearest', inline:'end'});
}

// Коротке резюме вільної частини — скільки ходів рушій вважав найкращими чи
// прийнятними і де були найпомітніші відхилення за оцінкою. Викликається,
// коли партія справді завершується (мат/пат/нічия).
function renderPrincipleAnalysisHtml(){
  if(!principleMoveLog.length) return '';
  const counts = {best:0, good:0, inaccuracy:0, mistake:0, blunder:0};
  principleMoveLog.forEach(m => { counts[classifyMoveLoss(m.lossCp)]++; });
  const worst = principleMoveLog
    .filter(m => m.lossCp > 0)
    .slice()
    .sort((a,b) => b.lossCp - a.lossCp)
    .slice(0, 3);
  let html = `<div class="theory" style="margin-top:14px;">
    <h3>Аналіз вільної частини (${principleMoveLog.length} ${principleMoveLog.length === 1 ? 'хід' : 'ходів'})</h3>
    <p class="idea">Найкращих ходів рушія: ${counts.best} · хороших: ${counts.good} · неточностей: ${counts.inaccuracy} · помилок: ${counts.mistake} · грубих промахів: ${counts.blunder}.</p>
    ${renderEvalSparkline()}`;
  if(worst.length){
    html += `<div class="plans-col"><h4>Найпомітніші відхилення від рушія</h4><ul>${worst.map(m =>
      `<li>${m.moveNo}. ${m.san} — втрата ≈ ${(m.lossCp/100).toFixed(2)} пішака${m.bestSan ? ` (краще було ${m.bestSan})` : ''}</li>`
    ).join('')}</ul></div>`;
  } else {
    html += `<p class="idea">Жодного помітного відхилення від найкращого ходу рушія — чудова робота!</p>`;
  }
  html += `</div>`;
  return html;
}

/* ===================== ДЕБЮТИ ===================== */

// Спільне налаштування для тренування будь-якої лінії дебюту — і основної
// (selectOpening), і окремого "варіанту відповіді суперника" (trainVariation).
// Обидва зводяться до "дай opening-подібний об'єкт із moves/coreMoves,
// решту стану скинь однаково" — attemptMove/engineAutoPlay далі просто
// звіряються з currentOpening.moves, не знаючи, що це варіант, а не основна лінія.
function beginOpeningTraining(op, statusMsg){
  currentOpening = op;
  chess = new Chess();
  moveIndex = 0;
  freePlay = false;
  principleMode = false;
  principleMoveLog = [];
  principleGen++;
  renderPrincipleMoveStrip();
  userColor = op.side === 'white' ? 'w' : 'b';
  flipped = userColor === 'b';
  selected = null; legalTargets = []; lastMove = null;
  resetInfoPanels();
  updateActiveItem();

  renderOpeningHeader();
  renderBoard();
  renderMoveList();
  setStatus(statusMsg, '');

  if(userColor === 'b'){
    scheduleEngineMove(engineAutoPlay, 400);
  }
}

function selectOpening(id){
  clearReplayTimers();
  if(dragActive){ cleanupDrag(); }
  activeVariationParent = null;
  activeVariation = null;
  const op = OPENINGS.find(o=>o.id===id);
  beginOpeningTraining(op, `Твій хід. Спробуй знайти правильний перший хід ${op.side === 'white' ? 'білими' : 'чорними'}.`);
}

// Тренує один "варіант відповіді суперника" так само інтерактивно, як
// основну лінію — а не лише показує його автопрогравачем (startLineReplay).
function trainVariation(op, variation){
  clearReplayTimers();
  if(dragActive){ cleanupDrag(); }
  activeVariationParent = op;
  activeVariation = variation;
  const synthetic = {
    id: op.id, eco: op.eco, side: op.side,
    name: op.name + ' — ' + variation.name,
    description: variation.note,
    coreMoves: variation.moves.length,
    moves: variation.moves,
    moveComments: null,
    theory: null
  };
  beginOpeningTraining(synthetic, `Твій хід. Тренуємо варіант «${variation.name}».`);
  revealBoard();
}

function renderOpeningHeader(){
  const op = currentOpening;
  const t = op.theory;
  let html = '';
  if(activeVariationParent){
    html += `<div class="branch-notice">🎯 Тренуєш варіант — основна лінія «${activeVariationParent.name}» чекає <button type="button" class="btn" id="returnToMainOpeningBtn">← Повернутись до основного дебюту</button></div>`;
  }
  html += `
    <div class="eco">${op.eco} · ${op.side === 'white' ? 'граєш за білих' : 'граєш за чорних'} · обов'язкова частина: ${op.coreMoves} ${op.coreMoves === 1 ? 'хід' : 'ходів'}</div>
    <h2>${op.name}</h2>
    <p>${op.description}</p>
    <p class="hint-text" style="margin-top:0;">Перші ${op.coreMoves} ходів — точна лінія теорії. Далі приймається будь-який хід, що не порушує принципи розвитку, боротьби за центр і безпеки короля.</p>
    <button class="btn line-btn" data-line-kind="preview" data-line-index="-1">▶ Переглянути дебют на дошці</button>
    ${REFERENCE.some(r=>r.id===op.id) ? `<button class="btn" id="openReferenceBtn">📖 Читати повну теорію</button>` : ''}`;

  if(t){
    html += `<div class="theory">
      <h3>Ідея дебюту</h3>
      <p class="idea">${t.idea}</p>
      <div class="plans-grid">
        <div class="plans-col">
          <h4>Плани білих</h4>
          <ul>${t.plansWhite.map(p=>`<li>${p}</li>`).join('')}</ul>
        </div>
        <div class="plans-col">
          <h4>Плани чорних</h4>
          <ul>${t.plansBlack.map(p=>`<li>${p}</li>`).join('')}</ul>
        </div>
      </div>`;
    if(t.trap){
      html += `<div class="trap-box">
        <div class="trap-name">Пастка: ${t.trap.name}</div>
        <p>${t.trap.note}</p>
        <button class="btn line-btn" data-line-kind="trap" data-line-index="0">Показати на дошці</button>
      </div>`;
    }
    if(t.variations && t.variations.length){
      html += `<div class="variations-box">
        <h4>Варіанти відповіді суперника</h4>
        ${t.variations.map((v,i)=>`
          <div class="variation-item">
            <div class="variation-name">${v.name}</div>
            <p>${v.note}</p>
            <div class="btn-row">
              <button class="btn line-btn" data-line-kind="variation" data-line-index="${i}">▶ Демонстрація</button>
              <button class="btn primary train-variation-btn" data-var-index="${i}">🎯 Тренувати цей варіант</button>
            </div>
          </div>`).join('')}
      </div>`;
    }
    html += `<button class="btn" id="returnTrainBtn" style="display:none;">Повернутись до тренування</button>`;
    html += `</div>`;
  }
  itemHeaderEl.innerHTML = html;

  itemHeaderEl.querySelectorAll('.line-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(isReplaying) return;
      const kind = btn.dataset.lineKind;
      if(kind === 'preview'){
        startLineReplay(op, {name: op.name, moves: op.moves, note: op.description}, 'preview', op.moveComments);
        return;
      }
      const line = kind === 'trap' ? t.trap : t.variations[+btn.dataset.lineIndex];
      startLineReplay(op, line, kind);
    });
  });
  const returnBtn = document.getElementById('returnTrainBtn');
  if(returnBtn){
    returnBtn.addEventListener('click', ()=>selectOpening(op.id));
  }
  const openReferenceBtn = document.getElementById('openReferenceBtn');
  if(openReferenceBtn){
    openReferenceBtn.addEventListener('click', ()=>{
      document.querySelector('[data-tab="reference"]').click();
      selectReference(op.id);
    });
  }
  const returnToMainBtn = document.getElementById('returnToMainOpeningBtn');
  if(returnToMainBtn){
    returnToMainBtn.addEventListener('click', ()=>selectOpening(activeVariationParent.id));
  }
  itemHeaderEl.querySelectorAll('.train-variation-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(isReplaying) return;
      trainVariation(op, t.variations[+btn.dataset.varIndex]);
    });
  });
}

function startLineReplay(op, line, kind, comments){
  clearReplayTimers();
  isReplaying = true;
  chess = new Chess();
  selected = null; legalTargets = []; lastMove = null;
  explainBox.style.display = 'none';
  moveCommentBox.style.display = 'none';
  renderBoard();
  renderMoveList();
  revealBoard();
  const introLabel = kind === 'trap' ? 'Перегляд пастки: ' : kind === 'variation' ? 'Перегляд варіанту: ' : kind === 'game' ? 'Партія: ' : 'Перегляд основної лінії: ';
  setStatus(introLabel + line.name, '');

  const moves = line.moves;
  moves.forEach((san, i)=>{
    const timer = setTimeout(()=>{
      const mv = chess.move(san);
      if(mv){ lastMove = mv; }
      renderBoard();
      renderMoveList();
      if(comments){ showMoveComment(op, i); }
      if(i === moves.length - 1){
        isReplaying = false;
        const finishMsg = kind === 'trap' ? 'Ось так спрацьовує пастка.' : kind === 'variation' ? 'Ось так може розвиватися ця лінія.' : kind === 'game' ? 'Дебютна стадія партії відтворена — далі гра тривала за сценарієм, описаним у статті.' : 'Ось так виглядає основна лінія. Тепер спробуй пройти її сам!';
        setStatus(finishMsg, 'win');
        if(!comments){
          explainBox.style.display = 'block';
          explainBox.textContent = line.note;
        }
        const returnBtn = document.getElementById('returnTrainBtn');
        if(returnBtn) returnBtn.style.display = 'inline-block';
      }
    }, (i+1) * 650);
    replayTimers.push(timer);
  });
}

function engineAutoPlay(){
  if(!currentOpening) return;
  const coreLen = openingCoreHalfMoves(currentOpening);
  if(moveIndex >= coreLen){
    engineFreePlayMove();
    return;
  }
  const playedIndex = moveIndex;
  const san = currentOpening.moves[moveIndex];
  const mv = chess.move(san);
  if(!mv) return;
  lastMove = mv;
  moveIndex++;
  renderBoard();
  renderMoveList();
  showMoveComment(currentOpening, playedIndex);
  if(moveIndex >= coreLen){
    finishOpening();
  } else {
    setStatus('Твій хід.', '');
  }
}

function showMoveComment(op, idx){
  const comment = op.moveComments && op.moveComments[idx];
  if(comment){
    moveCommentBox.style.display = 'block';
    moveCommentBox.textContent = comment;
  } else {
    moveCommentBox.style.display = 'none';
  }
}

function finishOpening(){
  principleMode = true;
  principleMoveLog = [];
  principleGen++;
  renderPrincipleMoveStrip();
  markCompleted(PROG_KEY_OPENINGS, currentOpening.id);
  renderItemList();
  freePlayBox.style.display = 'block';
  if(chess.turn() === userColor){
    setStatus('Обов\'язкову частину дебюту пройдено! Тепер продовжуй сам за принципами: розвиток фігур, боротьба за центр, безпека короля.', 'win');
  } else {
    setStatus('Обов\'язкову частину дебюту пройдено! Хід суперника...', 'win');
    scheduleEngineMove(engineFreePlayMove, 500);
  }
}

function normalizeSan(s){
  return s.replace(/[+#]/g,'');
}

// Відповідь зараховується, якщо вона є в списку рішень. Для задач «мат в 1 хід»
// зараховується й будь-який ІНШИЙ мат — інакше правильна відповідь (напр. Qa8# замість
// Qe8# у задачі p16) отримувала б «Не зовсім» і скидала серію.
function isSolutionMove(item, candidate){
  const sol = item.solution || [];
  if(sol.some(s => normalizeSan(s) === normalizeSan(candidate.san))) return true;
  return sol.length > 0 && sol.every(s => /#$/.test(s)) && /#$/.test(candidate.san);
}

/* ===================== ДОШКА ===================== */

function renderBoard(){
  // Клавіатурний фокус живе на самих <div>-клітинках (roving tabindex) і щорендеру
  // перебудовується заново разом з ними — тож перш ніж стерти board, запам'ятовуємо,
  // чи фокус зараз узагалі на дошці, щоб коректно повернути його в кінці функції.
  const hadFocus = boardEl.contains(document.activeElement);
  boardEl.innerHTML = '';
  const board = chess.board(); // board[0] = rank8 ... board[7] = rank1
  const files = ['a','b','c','d','e','f','g','h'];

  // Фокус сам "їде" за останнім ходом (своїм чи суперника), доки гравець не почне
  // рухати його стрілками — тоді керування бере keyboardFocusFollowsMove=false в
  // moveKeyboardFocus(), і знову вмикається щойно стається наступний реальний хід
  // (activateSquare виставляє його назад у true).
  if(keyboardFocusFollowsMove && lastMove) keyboardFocusSquare = lastMove.to;
  if(!keyboardFocusSquare) keyboardFocusSquare = flipped ? 'd5' : 'd4';

  for(let displayRow=0; displayRow<8; displayRow++){
    for(let displayCol=0; displayCol<8; displayCol++){
      const rowIdx = flipped ? 7-displayRow : displayRow;
      const colIdx = flipped ? 7-displayCol : displayCol;
      const file = files[colIdx];
      const rank = 8 - rowIdx;
      const squareName = file + rank;
      const piece = board[rowIdx][colIdx];

      const sqEl = document.createElement('div');
      const isLight = (rowIdx + colIdx) % 2 === 0;
      sqEl.className = 'sq ' + (isLight ? 'light' : 'dark');
      sqEl.dataset.square = squareName;
      sqEl.setAttribute('role', 'button');
      sqEl.tabIndex = squareName === keyboardFocusSquare ? 0 : -1;

      const isSelected = selected === squareName;
      const isLegal = legalTargets.includes(squareName);
      if(isSelected) sqEl.classList.add('selected');
      if(isLegal){
        sqEl.classList.add('legal');
        if(piece) sqEl.classList.add('has-piece');
      }
      if(lastMove && (lastMove.from === squareName)) sqEl.classList.add('last-from');
      if(lastMove && (lastMove.to === squareName)) sqEl.classList.add('last-to');

      let a11yLabel = squareName + ': ' + (piece ? pieceLabelUk(piece) : 'порожньо');
      if(isSelected) a11yLabel += ', вибрано';
      else if(isLegal) a11yLabel += ', можна піти';
      sqEl.setAttribute('aria-label', a11yLabel);

      if(piece){
        const span = document.createElement('span');
        span.className = 'piece ' + (piece.color === 'w' ? 'piece-w' : 'piece-b');
        if(dragActive && dragFromSquare === squareName) span.classList.add('dragging-source');
        span.textContent = pieceGlyph(piece);
        sqEl.appendChild(span);
      }

      if(displayCol === 0){
        const rankLabel = document.createElement('span');
        rankLabel.className = 'sq-coord rank';
        rankLabel.textContent = rank;
        sqEl.appendChild(rankLabel);
      }
      if(displayRow === 7){
        const fileLabel = document.createElement('span');
        fileLabel.className = 'sq-coord file';
        fileLabel.textContent = file;
        sqEl.appendChild(fileLabel);
      }

      sqEl.addEventListener('pointerdown', (e)=>onSquarePointerDown(e, squareName));
      boardEl.appendChild(sqEl);
    }
  }

  if(hadFocus){
    const target = boardEl.querySelector('[data-square="' + keyboardFocusSquare + '"]');
    if(target) target.focus({preventScroll:true});
  }
}

function pieceGlyph(piece){
  const whiteGlyphs = {p:'♙',n:'♘',b:'♗',r:'♖',q:'♕',k:'♔'};
  // \uFE0E — селектор текстового вигляду: без нього на iOS/Android чорний пішак ♟ малюється як кольоровий емодзі
  const blackGlyphs = {p:'♟\uFE0E',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
  return piece.color === 'w' ? whiteGlyphs[piece.type] : blackGlyphs[piece.type];
}

// Український опис фігури для aria-label клітинки — окремо від pieceGlyph (той керує
// лише візуальним гліфом і не повинен знати про доступність).
function pieceLabelUk(piece){
  const names = {p:'пішак', n:'кінь', b:'слон', r:'тура', q:'ферзь', k:'король'};
  const color = piece.color === 'w' ? 'білий' : 'чорний';
  return color + ' ' + names[piece.type];
}

function renderMoveList(){
  const history = chess.history();
  if(history.length === 0){ moveListEl.textContent = 'Ходів ще не було.'; return; }
  let out = '';
  for(let i=0;i<history.length;i+=2){
    const num = i/2 + 1;
    out += num + '. ' + history[i] + (history[i+1] ? ' ' + history[i+1] + '  ' : '');
  }
  moveListEl.textContent = out.trim();
}

function setStatus(msg, kind){
  statusEl.textContent = msg;
  statusEl.className = 'status-msg' + (kind ? ' ' + kind : '');
}

/* ===================== ВЗАЄМОДІЯ З ДОШКОЮ ===================== */

// Уся логіка "що робить клік/дотик/Enter по цій клітинці" живе тут в одному місці,
// щоб миша (onSquarePointerDown нижче) і клавіатура (boardEl 'keydown' далі) завжди
// поводились однаково — жодна з них не дублює перевірки вкладки/черги ходу окремо.
// Повертає, що саме сталося: миша дивиться на це, щоб вирішити, чи починати drag
// (лише коли щойно ВИБРАЛИ фігуру, а не коли зробили хід чи зняли вибір); клавіатура
// значення просто ігнорує.
function activateSquare(squareName){
  if(isReplaying) return 'blocked';
  if(currentTab === 'reference') return 'blocked'; // дошка в довіднику — лише для перегляду партії, без ручних ходів
  if(currentTab === 'analyzer' && chess.game_over()) return 'blocked'; // партія на дошці аналізатора скінчилась — нема чим ходити
  if(currentTab === 'tactics' && puzzleSolved) return 'blocked';
  if(currentTab === 'cct' && cctSolved) return 'blocked';
  if(currentTab === 'endgames' && currentEndgameItem && currentEndgameItem.kind === 'puzzle' && endgamePuzzleSolved) return 'blocked';
  if(currentTab === 'openings' && !freePlay && !principleMode && (!currentOpening || moveIndex >= currentOpening.moves.length)) return 'blocked';
  if(currentTab === 'openings' && chess.turn() !== userColor) return 'blocked';
  if(currentTab === 'bot' && (chess.turn() !== userColor || engineThinking || chess.game_over())) return 'blocked';

  const piece = chess.get(squareName);

  if(selected){
    if(legalTargets.includes(squareName)){
      keyboardFocusFollowsMove = true; // хід зроблено — фокус знову йде "за грою"
      attemptMove(selected, squareName);
      return 'moved';
    }
    if(piece && piece.color === chess.turn()){
      selectSquare(squareName);
      return 'selected';
    }
    selected = null; legalTargets = [];
    renderBoard();
    return 'deselected';
  }

  if(piece && piece.color === chess.turn()){
    selectSquare(squareName);
    return 'selected';
  }
  return 'deselected';
}

function onSquarePointerDown(e, squareName){
  if(activateSquare(squareName) === 'selected'){
    beginDrag(e, squareName, chess.get(squareName));
  }
}

function beginDrag(e, squareName, piece){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  dragActive = true;
  dragMoved = false;
  dragFromSquare = squareName;
  dragPointerId = e.pointerId;
  dragStartX = e.clientX;
  dragStartY = e.clientY;

  dragGhostEl = document.createElement('div');
  dragGhostEl.className = 'drag-ghost piece ' + (piece.color === 'w' ? 'piece-w' : 'piece-b');
  dragGhostEl.textContent = pieceGlyph(piece);
  dragGhostEl.style.left = e.clientX + 'px';
  dragGhostEl.style.top = e.clientY + 'px';
  dragGhostEl.style.visibility = 'hidden';
  document.body.appendChild(dragGhostEl);

  renderBoard();

  const originEl = boardEl.querySelector('.sq[data-square="' + squareName + '"] .piece');
  if(originEl){ dragGhostEl.style.fontSize = getComputedStyle(originEl).fontSize; }
}

function updateDragHover(clientX, clientY){
  boardEl.querySelectorAll('.sq.drag-hover').forEach(el=>el.classList.remove('drag-hover'));
  const el = document.elementFromPoint(clientX, clientY);
  const sqEl = el && el.closest ? el.closest('.sq') : null;
  if(sqEl) sqEl.classList.add('drag-hover');
}

function cleanupDrag(){
  dragActive = false;
  dragMoved = false;
  dragFromSquare = null;
  dragPointerId = null;
  if(dragGhostEl){ dragGhostEl.remove(); dragGhostEl = null; }
  boardEl.querySelectorAll('.sq.drag-hover').forEach(el=>el.classList.remove('drag-hover'));
}

document.addEventListener('pointermove', (e)=>{
  if(!dragActive || e.pointerId !== dragPointerId) return;
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  if(!dragMoved && Math.hypot(dx, dy) > DRAG_THRESHOLD){
    dragMoved = true;
    dragGhostEl.style.visibility = 'visible';
  }
  if(dragMoved){
    dragGhostEl.style.left = e.clientX + 'px';
    dragGhostEl.style.top = e.clientY + 'px';
    updateDragHover(e.clientX, e.clientY);
  }
});

document.addEventListener('pointerup', (e)=>{
  if(!dragActive || e.pointerId !== dragPointerId) return;
  const wasMoved = dragMoved;
  const fromSquare = dragFromSquare;
  cleanupDrag();
  if(!wasMoved) return; // просте виділення клітинки — далі чекаємо звичайного кліку на ціль

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const sqEl = el && el.closest ? el.closest('.sq') : null;
  const toSquare = sqEl ? sqEl.dataset.square : null;

  if(toSquare && legalTargets.includes(toSquare)){
    attemptMove(fromSquare, toSquare);
  } else if(toSquare && toSquare !== fromSquare){
    const piece = chess.get(toSquare);
    if(piece && piece.color === chess.turn()){
      selectSquare(toSquare);
    } else {
      selected = null; legalTargets = [];
      renderBoard();
    }
  } else {
    renderBoard();
  }
});

document.addEventListener('pointercancel', ()=>{
  if(!dragActive) return;
  cleanupDrag();
  renderBoard();
});

// Стрілки рухають клавіатурний фокус по дошці на одну клітинку в напрямку, який
// ВИГЛЯДАЄ як цей напрямок на екрані — тобто враховують розворот дошки (flipped),
// а не абсолютні файл/горизонталь. row тут — той самий rowIdx, що й у renderBoard
// (0 = 8-ма горизонталь); sign інвертує обидві осі одним прапорцем так само, як
// renderBoard інвертує їх виразом flipped?7-x:x.
const BOARD_FILES = 'abcdefgh';
function moveKeyboardFocus(dCol, dRow){
  const cur = keyboardFocusSquare || (flipped ? 'd5' : 'd4');
  let col = BOARD_FILES.indexOf(cur[0]);
  let row = 8 - (+cur[1]);
  const sign = flipped ? -1 : 1;
  col = Math.max(0, Math.min(7, col + dCol * sign));
  row = Math.max(0, Math.min(7, row - dRow * sign));
  keyboardFocusSquare = BOARD_FILES[col] + (8 - row);
  keyboardFocusFollowsMove = false; // гравець узяв керування фокусом у свої руки
  const el = boardEl.querySelector('[data-square="' + keyboardFocusSquare + '"]');
  if(el) el.focus({preventScroll:true});
}
boardEl.addEventListener('keydown', (e)=>{
  const sqEl = e.target.closest('.sq');
  if(!sqEl) return;
  if(e.key === 'ArrowUp'){ e.preventDefault(); moveKeyboardFocus(0, 1); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); moveKeyboardFocus(0, -1); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); moveKeyboardFocus(-1, 0); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); moveKeyboardFocus(1, 0); }
  else if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
    e.preventDefault();
    activateSquare(sqEl.dataset.square);
  } else if(e.key === 'Escape' && selected){
    e.preventDefault();
    selected = null; legalTargets = [];
    renderBoard();
  }
});

function selectSquare(squareName){
  selected = squareName;
  const moves = chess.moves({square: squareName, verbose:true});
  legalTargets = moves.map(m=>m.to);
  renderBoard();
}

function attemptMove(from, to){
  const moves = chess.moves({square: from, verbose:true});
  const candidate = moves.find(m=>m.to === to);
  selected = null; legalTargets = [];
  if(!candidate){ renderBoard(); return; }

  if(currentTab === 'openings'){
    if(freePlay){
      const mv = chess.move(candidate);
      lastMove = mv;
      renderBoard();
      renderMoveList();
      if(chess.game_over()){
        announceGameOver();
      } else {
        setStatus('Хід суперника (комп\'ютер думає...)', 'engine-thinking');
        scheduleEngineMove(engineFreePlayMove, 300);
      }
      return;
    }
    if(principleMode){
      const verdict = evaluatePrincipleMove(candidate);
      if(verdict.ok){
        const fenBefore = chess.fen();
        const mv = chess.move(candidate);
        lastMove = mv;
        const fenAfter = chess.fen();
        const moveNo = Math.ceil(chess.history().length / 2);
        const myGen = ++principleGen;
        const pendingEntry = {moveNo, color: userColor, san: candidate.san, lossCp: null, cls: null, bestSan: null, evalCp: null};
        principleMoveLog.push(pendingEntry);
        analysisBtnBox.style.display = 'block';
        renderPrincipleMoveStrip();
        judgeUserMoveAsync(myGen, fenBefore, fenAfter, candidate.san, moveNo, pendingEntry);
        renderBoard();
        renderMoveList();
        if(chess.game_over()){
          announceGameOver();
        } else {
          const warnSuffix = verdict.warning ? ' ⚠ ' + verdict.warning : '';
          setStatus('Хороший хід!' + warnSuffix + ' Хід суперника (комп\'ютер думає...)', warnSuffix ? 'warn' : 'ok');
          scheduleEngineMove(engineFreePlayMove, 300);
        }
      } else {
        renderBoard();
        setStatus(verdict.reason, 'err');
      }
      return;
    }
    const coreLen = openingCoreHalfMoves(currentOpening);
    const expected = currentOpening.moves[moveIndex];
    if(candidate.san === expected){
      const playedIndex = moveIndex;
      const mv = chess.move(candidate);
      lastMove = mv;
      moveIndex++;
      hintStep = 0;
      hintBox.style.display = 'none';
      hintArrow1El.style.display = 'none';
      hintArrow2El.style.display = 'none';
      renderBoard();
      renderMoveList();
      showMoveComment(currentOpening, playedIndex);
      if(moveIndex >= coreLen){
        finishOpening();
      } else {
        setStatus('Правильно! Хід суперника...', 'ok');
        scheduleEngineMove(engineAutoPlay, 500);
      }
    } else {
      renderBoard();
      setStatus('Це не той хід у цій лінії. Спробуй ще раз.', 'err');
    }
  } else if(currentTab === 'endgames'){
    if(currentEndgameItem.kind === 'technique'){
      const mv = chess.move(candidate);
      lastMove = mv;
      renderBoard();
      renderMoveList();
      if(chess.game_over()){
        announceGameOver();
      } else {
        setStatus('Хід суперника (комп\'ютер думає...)', 'engine-thinking');
        scheduleEngineMove(engineFreePlayMove, 300);
      }
    } else {
      if(isSolutionMove(currentEndgameItem, candidate)){
        const mv = chess.move(candidate);
        lastMove = mv;
        renderBoard();
        renderMoveList();
        finishEndgamePuzzle();
      } else {
        renderBoard();
        if(streak > 0){ streak = 0; updateStatsLine(); }
        setStatus('Не зовсім. Спробуй ще раз.', 'err');
      }
    }
  } else if(currentTab === 'cct'){
    if(isSolutionMove(currentCCT, candidate)){
      const mv = chess.move(candidate);
      lastMove = mv;
      renderBoard();
      renderMoveList();
      finishCCT();
    } else {
      renderBoard();
      if(streak > 0){ streak = 0; updateStatsLine(); }
      setStatus('Не зовсім. Ще раз пройди CCT-чекліст і спробуй ще.', 'err');
    }
  } else if(currentTab === 'bot'){
    const mv = chess.move(candidate);
    lastMove = mv;
    renderBoard();
    renderMoveList();
    if(chess.game_over()){
      announceGameOver();
    } else {
      syncBotPosition();
    }
  } else if(currentTab === 'analyzer'){
    const fenBefore = chess.fen();
    const mv = chess.move(candidate);
    analyzerPlayUserMove(fenBefore, mv);
  } else {
    if(isSolutionMove(currentPuzzle, candidate)){
      const mv = chess.move(candidate);
      lastMove = mv;
      renderBoard();
      renderMoveList();
      finishPuzzle();
    } else {
      renderBoard();
      if(streak > 0){ streak = 0; updateStatsLine(); }
      setStatus('Не зовсім. Спробуй ще раз.', 'err');
    }
  }
}

/* ===================== ПРОТИ БОТА (STOCKFISH) =====================
   Два незалежні Web Worker-и з тим самим stockfish.js:
   - botEngine   — грає ходи за суперника, сила обмежена через UCI_LimitStrength + UCI_Elo,
                   щоб можна було грати проти реально слабшого рушія, а не завжди програвати.
   - helperEngine — завжди повної сили, MultiPV 2 — рахує чесну оцінку позиції (шкала зліва
                   від дошки) і, якщо увімкнено перемикач, дві кращі лінії — незалежно від
                   того, наскільки слабкого суперника обрав користувач. */

let stockfishBlobUrlPromise = null;
// Воркер не можна створити напряму з URL іншого походження (браузер кидає
// SecurityError) — тому спершу завантажуємо скрипт через fetch і створюємо
// Worker з blob-URL. Промис кешується, щоб обидва рушії не тягли файл двічі.
// stockfish-17.1-lite-single шукає свій .wasm через self.location.hash (сам він
// на blob:-походженні, тому відносний шлях не спрацював би) — передаємо його
// абсолютною URL-адресою у хеші blob-URL воркера.
function getStockfishBlobUrl(){
  if(!stockfishBlobUrlPromise){
    stockfishBlobUrlPromise = fetch(STOCKFISH_URL)
      .then(r=>{ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(text=>URL.createObjectURL(new Blob([text], {type:'application/javascript'})))
      .then(blobUrl=>blobUrl + '#' + encodeURIComponent(STOCKFISH_WASM_URL));
  }
  return stockfishBlobUrlPromise;
}

function createEngineController(opts){
  const ctrl = {
    worker:null, ready:false, failed:false, lines:[],
    onReady:null, onEval:null, onError:null,
    busy:false, pending:null, activeOnBest:null
  };
  // Черга запитів: якщо рушій зараз щось рахує, нову позицію не надсилаємо
  // одразу (старі "info"-рядки про попередню позицію можуть ще летіти і
  // переплутатися з новими) — чекаємо його власного bestmove і лише тоді
  // стартуємо наступний запит із request().
  ctrl.request = function(fen, goCmd, onBest){
    ctrl.pending = {fen, goCmd, onBest};
    if(ctrl.busy){
      ctrl.worker.postMessage('stop');
    } else {
      launchPending(ctrl);
    }
  };
  getStockfishBlobUrl().then(blobUrl=>{
    if(ctrl.failed) return; // користувач уже пішов з вкладки/сталася інша помилка, поки файл вантажився
    try{
      ctrl.worker = new Worker(blobUrl);
    }catch(e){
      ctrl.failed = true;
      if(ctrl.onError) ctrl.onError();
      return;
    }
    attachEngineHandlers(ctrl, opts);
    ctrl.worker.postMessage('uci');
  }).catch(()=>{
    ctrl.failed = true;
    if(ctrl.onError) ctrl.onError();
  });
  return ctrl;
}

function attachEngineHandlers(ctrl, opts){
  ctrl.worker.onerror = ()=>{
    ctrl.failed = true;
    ctrl.ready = false;
    if(ctrl.onError) ctrl.onError();
  };
  ctrl.worker.onmessage = (e)=>{
    const line = typeof e.data === 'string' ? e.data : (e.data && e.data.data) || '';
    if(line === 'uciok'){
      if(opts.limitStrength){
        ctrl.worker.postMessage('setoption name UCI_LimitStrength value true');
        ctrl.worker.postMessage('setoption name UCI_Elo value ' + opts.elo);
      } else {
        ctrl.worker.postMessage('setoption name UCI_LimitStrength value false');
      }
      ctrl.worker.postMessage('setoption name MultiPV value ' + (opts.multipv || 1));
      ctrl.worker.postMessage('isready');
      return;
    }
    if(line === 'readyok'){
      ctrl.ready = true;
      if(ctrl.onReady) ctrl.onReady();
      return;
    }
    if(line.indexOf('info') === 0){
      if(ctrl.pending) return; // новіший запит вже в черзі — цей "info" ще від старої позиції, ігноруємо
      const depthMatch = line.match(/^info depth (\d+)/);
      const mpvMatch = line.match(/multipv (\d+)/);
      const cpMatch = line.match(/score cp (-?\d+)/);
      const mateMatch = line.match(/score mate (-?\d+)/);
      const pvMatch = line.match(/ pv (\S.*)$/);
      if(mpvMatch && (cpMatch || mateMatch) && pvMatch){
        const idx = +mpvMatch[1] - 1;
        ctrl.lines[idx] = {
          depth: depthMatch ? +depthMatch[1] : 0,
          cp: cpMatch ? +cpMatch[1] : null,
          mate: mateMatch ? +mateMatch[1] : null,
          pvUci: pvMatch[1].trim().split(/\s+/)
        };
        if(ctrl.onEval) ctrl.onEval();
      }
      return;
    }
    if(line.indexOf('bestmove') === 0){
      ctrl.busy = false;
      const uci = line.split(' ')[1];
      const cb = ctrl.activeOnBest;
      ctrl.activeOnBest = null;
      if(ctrl.pending){
        // Позиція вже змінилась, поки рушій рахував, — цей bestmove застарів,
        // одразу стартуємо запит, що чекав своєї черги.
        launchPending(ctrl);
      } else if(cb){
        cb(uci === '(none)' ? null : uci);
      }
      return;
    }
  };
}

function launchPending(ctrl){
  if(!ctrl.pending) return;
  const {fen, goCmd, onBest} = ctrl.pending;
  ctrl.pending = null;
  ctrl.lines = [];
  ctrl.activeOnBest = onBest || null;
  ctrl.busy = true;
  ctrl.worker.postMessage('position fen ' + fen);
  ctrl.worker.postMessage(goCmd);
}

function setEngineStatus(msg, kind){
  engineStatusLineEl.textContent = msg;
  engineStatusLineEl.className = 'engine-status' + (kind ? ' ' + kind : '');
}

/* ===================== АНАЛІЗ ПОЗИЦІЙ STOCKFISH (одноразові запити) =====================
   На відміну від helperEngine (що безперервно оновлює лінії для живої партії проти бота),
   ці утиліти виконують один запит "рахуй до кінця, віддай bestmove" і повертають готовий
   результат через колбек — використовується і для суддівства вільної частини дебютів,
   і (пізніше) для аналізатора завантаженої партії. */

// Зводить score cp/mate в одне порівнюване число з точки зору сторони, що ходить у
// проаналізованій позиції (саме так Stockfish віддає score в info-рядках).
function lineScoreCp(line){
  if(!line) return 0;
  if(line.mate != null) return line.mate > 0 ? (100000 - line.mate) : (-100000 - line.mate);
  return line.cp || 0;
}

// Те саме, але вже переведене в перспективу білих — щоб позиції до/після ходу
// (де хід має різна сторона) можна було порівнювати напряму.
function cpFromFen(fen, line){
  const sideToMove = fen.split(' ')[1];
  const raw = lineScoreCp(line);
  return sideToMove === 'w' ? raw : -raw;
}

function uciToSan(fen, uci){
  if(!uci) return null;
  try{
    const t = new Chess(fen);
    const mv = t.move({from: uci.slice(0,2), to: uci.slice(2,4), promotion: uci.slice(4,5) || undefined});
    return mv ? mv.san : null;
  }catch(e){ return null; }
}

// Один "чесний" прогін рушія на заданій позиції до вказаної глибини. onResult отримує
// {bestUci, lines} — lines[0] є найкращою лінією (top-1), lines[1..] заповнені лише
// якщо контролер створений із multipv > 1.
function analyzePosition(ctrl, fen, depth, onResult){
  ctrl.request(fen, 'go depth ' + depth, (bestUci)=>{
    onResult({bestUci, lines: ctrl.lines.slice()});
  });
}

function initJudgeEngineIfNeeded(onReady){
  if(judgeEngine){
    if(judgeEngine.ready){ if(onReady) onReady(); }
    else if(onReady){ const prev = judgeEngine.onReady; judgeEngine.onReady = ()=>{ if(prev) prev(); onReady(); }; }
    return;
  }
  judgeEngine = createEngineController({limitStrength:false, multipv:1});
  if(onReady){
    judgeEngine.onReady = onReady;
  }
}

// Черга завдань для judgeEngine: один Worker обробляє одну позицію за раз, тож якщо
// гравець встигає зробити наступний хід раніше, ніж прийшла оцінка попереднього,
// нове завдання чекає своєї черги замість того, щоб перебити (і загубити) попереднє.
let judgeQueue = [];
let judgeBusy = false;

function queueJudgeJob(job){
  judgeQueue.push(job);
  runNextJudgeJob();
}

function runNextJudgeJob(){
  if(judgeBusy || !judgeQueue.length) return;
  judgeBusy = true;
  const job = judgeQueue.shift();
  job(()=>{ judgeBusy = false; runNextJudgeJob(); });
}

// Асинхронно суддить хід гравця у вільній частині дебюту: аналізує позицію ДО ходу
// (щоб дізнатись найкращий хід рушія й "стелю" оцінки) і ПІСЛЯ ходу (щоб побачити, чого
// гравець реально досяг), і записує різницю в principleMoveLog. myGen — токен, знятий
// у attemptMove одразу після ходу; якщо до завершення аналізу гравець скасував хід чи
// почав заново, principleGen встигне змінитись і результат просто відкидається.
function judgeUserMoveAsync(myGen, fenBefore, fenAfter, candidateSan, moveNo, pendingEntry){
  queueJudgeJob((done)=>{
    if(myGen !== principleGen){ done(); return; }
    initJudgeEngineIfNeeded(()=>{
      if(myGen !== principleGen){ done(); return; }
      analyzePosition(judgeEngine, fenBefore, HELPER_ANALYSIS_DEPTH, (before)=>{
        if(myGen !== principleGen){ done(); return; }
        const beforeWhiteCp = cpFromFen(fenBefore, before.lines[0]);
        const bestSanRaw = uciToSan(fenBefore, before.bestUci);
        const sign = userColor === 'w' ? 1 : -1;
        const finalize = (afterWhiteCp)=>{
          if(myGen === principleGen && principleMoveLog.includes(pendingEntry)){
            const lossCp = Math.max(0, Math.round(sign * (beforeWhiteCp - afterWhiteCp)));
            const cls = classifyMoveLoss(lossCp);
            pendingEntry.lossCp = lossCp;
            pendingEntry.cls = cls;
            pendingEntry.bestSan = (lossCp > 0 && bestSanRaw && bestSanRaw !== candidateSan) ? bestSanRaw : null;
            pendingEntry.evalCp = afterWhiteCp;
            renderPrincipleMoveStrip();
            if(currentTab === 'openings' && principleMode){
              const label = MOVE_QUALITY_META[cls].label;
              const suffix = (cls === 'mistake' || cls === 'blunder') && bestSanRaw ? ' (краще було ' + bestSanRaw + ')' : '';
              setStatus('Рушій: хід ' + candidateSan + ' — ' + label + suffix + '.', (cls === 'mistake' || cls === 'blunder') ? 'warn' : 'ok');
            }
          }
          done();
        };
        // Мат — рушію нема що аналізувати в позиції без ходів (той самий
        // випадок, що й у аналізаторі партії).
        if(new Chess(fenAfter).in_checkmate()){
          finalize(userColor === 'w' ? 100000 : -100000);
          return;
        }
        analyzePosition(judgeEngine, fenAfter, HELPER_ANALYSIS_DEPTH, (after)=>{
          if(myGen !== principleGen){ done(); return; }
          finalize(cpFromFen(fenAfter, after.lines[0]));
        });
      });
    });
  });
}

function initBotEnginesIfNeeded(){
  if(botEngine || helperEngine) return;
  setEngineStatus('Завантаження рушія Stockfish…', '');
  botEngine = createEngineController({limitStrength: BOT_LEVELS[botEloIdx].elo != null, elo: BOT_LEVELS[botEloIdx].elo, multipv:1});
  helperEngine = createEngineController({limitStrength:false, multipv:2});
  const onError = ()=>{
    setEngineStatus('Не вдалося завантажити Stockfish. Перевір з\'єднання з інтернетом і онови сторінку.', 'err');
    if(currentTab === 'bot'){
      setStatus('Не вдалося завантажити Stockfish. Перевір з\'єднання з інтернетом і онови сторінку.', 'err');
    }
  };
  botEngine.onError = onError;
  helperEngine.onError = onError;
  if(botEngine.failed || helperEngine.failed){ onError(); return; }
  let readyCount = 0;
  const onEitherReady = ()=>{
    readyCount++;
    if(readyCount >= 2){
      setEngineStatus('Рушій готовий.', 'ok');
      if(currentTab === 'bot') syncBotPosition();
    }
  };
  botEngine.onReady = onEitherReady;
  helperEngine.onReady = onEitherReady;
  helperEngine.onEval = ()=>{
    updateEvalBar();
    if(botHintsOn) renderEngineLines();
    renderHintArrows();
  };
}

// Координати клітинки в умовній системі 420×420 (в'язана з viewBox SVG, а не з
// реальним розміром дошки на екрані — тому не залежить від адаптивного скейлу).
function squareCenter(square){
  const colIdx = 'abcdefgh'.indexOf(square[0]);
  const rowIdx = 8 - (+square[1]);
  const displayCol = flipped ? 7 - colIdx : colIdx;
  const displayRow = flipped ? 7 - rowIdx : rowIdx;
  const cell = 420 / 8;
  return {x: displayCol * cell + cell / 2, y: displayRow * cell + cell / 2};
}

const HINT_ARROW_HEAD_LEN = {primary: 18, secondary: 15};

function setArrow(lineEl, uciMove, headLen){
  if(!uciMove){ lineEl.style.display = 'none'; return; }
  const from = uciMove.slice(0,2), to = uciMove.slice(2,4);
  const p1 = squareCenter(from), p2 = squareCenter(to);
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist;
  const trim = Math.min(headLen, dist * 0.6);
  lineEl.setAttribute('x1', p1.x);
  lineEl.setAttribute('y1', p1.y);
  lineEl.setAttribute('x2', p2.x - ux * trim);
  lineEl.setAttribute('y2', p2.y - uy * trim);
  lineEl.style.display = 'block';
}

function renderHintArrows(){
  if(currentTab !== 'bot' || !botHintsOn){
    hintArrow1El.style.display = 'none';
    hintArrow2El.style.display = 'none';
    return;
  }
  const lines = (helperEngine && helperEngine.lines) || [];
  const l1 = lines[0] && lines[0].depth >= MIN_HINT_DEPTH ? lines[0] : null;
  const l2 = lines[1] && lines[1].depth >= MIN_HINT_DEPTH ? lines[1] : null;
  setArrow(hintArrow1El, l1 && l1.pvUci && l1.pvUci[0], HINT_ARROW_HEAD_LEN.primary);
  setArrow(hintArrow2El, l2 && l2.pvUci && l2.pvUci[0], HINT_ARROW_HEAD_LEN.secondary);
}

function syncBotPosition(){
  if(currentTab !== 'bot' || !chess) return;
  const fen = chess.fen();
  if(helperEngine && helperEngine.ready && !helperEngine.failed){
    // Показуємо "Аналізую…" одразу, але самі lines[] чіпаємо лише тоді, коли
    // рушій справді почав рахувати нову позицію (у launchPending) — інакше
    // "info" від ще не зупиненого старого пошуку встигне проскочити як новий.
    if(botHintsOn) engineLinesBoxEl.innerHTML = '<div class="engine-line">Аналізую позицію…</div>';
    hintArrow1El.style.display = 'none';
    hintArrow2El.style.display = 'none';
    helperEngine.request(fen, 'go depth ' + HELPER_ANALYSIS_DEPTH);
  }
  if(chess.game_over()) return;
  const isBotTurn = chess.turn() !== userColor;
  if(isBotTurn && botEngine && botEngine.ready && !botEngine.failed){
    engineThinking = true;
    setStatus('Хід суперника (Stockfish думає...)', 'engine-thinking');
    const requestedFen = fen;
    botEngine.request(fen, 'go movetime 700', (uci)=>{
      engineThinking = false;
      if(!uci) return;
      // Якщо на момент відповіді ми вже не в тій позиції (undo/reset), запит
      // усе одно був знятий чергою request() — цей колбек виконується лише
      // для дійсно останнього запиту, тож додаткова перевірка не потрібна.
      playEngineUciMove(uci);
    });
  }
}

function playEngineUciMove(uci){
  const mv = chess.move({from: uci.slice(0,2), to: uci.slice(2,4), promotion: uci.length > 4 ? uci.slice(4,5) : undefined});
  if(!mv) return;
  lastMove = mv;
  renderBoard();
  renderMoveList();
  if(chess.game_over()){
    announceGameOver();
  } else {
    setStatus('Твій хід.', '');
    syncBotPosition();
  }
}

function pvToSanText(pvUci, fen, maxPlies){
  const temp = new Chess(fen);
  const sans = [];
  for(let i=0;i<Math.min(maxPlies, pvUci.length);i++){
    const u = pvUci[i];
    const mv = temp.move({from:u.slice(0,2), to:u.slice(2,4), promotion:u.length>4?u.slice(4,5):undefined});
    if(!mv) break;
    sans.push(mv.san);
  }
  return sans.join(' ');
}

function updateEvalBar(){
  if(currentTab !== 'bot') return;
  const line = helperEngine && helperEngine.lines[0];
  if(!line || line.depth < MIN_HINT_DEPTH) return; // ще замало прораховано — не показуємо ранню (часто криву) оцінку
  const turn = chess.turn();
  let cpWhite, label;
  if(line.mate !== null){
    const mateWhite = turn === 'w' ? line.mate : -line.mate;
    cpWhite = mateWhite > 0 ? 1000 : -1000;
    label = 'Мат у ' + Math.abs(line.mate);
  } else {
    cpWhite = turn === 'w' ? line.cp : -line.cp;
    label = (cpWhite/100 >= 0 ? '+' : '') + (cpWhite/100).toFixed(1);
  }
  const clamped = Math.max(-1000, Math.min(1000, cpWhite));
  const whitePct = 50 + (clamped/1000)*50;
  evalBarFillEl.style.height = whitePct + '%';
  evalBarLabelEl.textContent = label;
}

function renderEngineLines(){
  const lines = (helperEngine && helperEngine.lines) || [];
  const present = lines.filter(l=>l && l.depth >= MIN_HINT_DEPTH);
  if(!present.length){
    engineLinesBoxEl.innerHTML = '<div class="engine-line">Аналізую позицію…</div>';
    return;
  }
  const fen = chess.fen();
  const turn = chess.turn();
  engineLinesBoxEl.innerHTML = present.map(l=>{
    let evalText;
    if(l.mate !== null){
      evalText = 'Мат у ' + Math.abs(l.mate);
    } else {
      const cpWhite = turn === 'w' ? l.cp : -l.cp;
      evalText = (cpWhite/100 >= 0 ? '+' : '') + (cpWhite/100).toFixed(1);
    }
    const sanText = pvToSanText(l.pvUci, fen, 5);
    return `<div class="engine-line"><span class="engine-line-eval">${evalText}</span><span class="engine-line-pv">${sanText}</span></div>`;
  }).join('');
}

/* ===================== АНАЛІЗАТОР ПАРТІЇ =====================
   Приймає PGN (вставлений або завантажений файлом), послідовно проганяє
   кожну позицію через окремий Stockfish-контролер (analyzerEngine, MultiPV —
   за вибором користувача) і будує для кожного ходу: втрату в сантипішаках
   відносно ходу ДО нього (той самий метод, що й judgeUserMoveAsync вище),
   класифікацію якості та альтернативні лінії. Дошка — лише для перегляду:
   навігація стрічкою ходів, графіком оцінки або кнопками «Назад/Вперед». */

let analyzerGame = null;        // {startFen, plies: [...]} після завершеного аналізу
let analyzerPly = 0;            // 0 = стартова позиція, i = позиція після plies[i-1]
let analyzerEngine = null;
let analyzerEngineMultiPV = null;
let analyzerRunning = false;
let analyzerGen = 0;            // той самий патерн інвалідації, що й principleGen
// Власна гілка гравця: коли на дошці аналізатора граєш хід, що відхиляється
// від завантаженої партії, він не змінює analyzerGame.plies (це запис
// оригінальної партії), а йде сюди. fromPly — ход main line, від якого
// відгалузились; moves — ходи гілки, кожен судиться live тим самим
// judgeEngine, що й вільна частина дебютів.
let analyzerBranch = null;      // null, або {fromPly, moves:[{san,from,to,fenBefore,fenAfter,pending,...}]}
let analyzerBranchIdx = 0;      // 0..branch.moves.length — скільки ходів гілки зараз показано

function formatWhiteCp(cpWhite){
  return (cpWhite/100 >= 0 ? '+' : '') + (cpWhite/100).toFixed(1);
}
function formatLineEval(line, fen){
  if(!line) return '';
  if(line.mate != null) return 'Мат у ' + Math.abs(line.mate);
  return formatWhiteCp(cpFromFen(fen, line));
}

function squareCenterPercent(square){
  const colIdx = 'abcdefgh'.indexOf(square[0]);
  const rowIdx = 8 - (+square[1]);
  const displayCol = flipped ? 7 - colIdx : colIdx;
  const displayRow = flipped ? 7 - rowIdx : rowIdx;
  return {xPct: (displayCol + 0.5) / 8 * 100, yPct: (displayRow + 0.5) / 8 * 100};
}

// Уніфікує "де ми зараз" — на записі завантаженої партії (analyzerPly) чи
// всередині власної гілки гравця (analyzerBranch) — щоб рендер-функції не
// дублювали цю розгалужену логіку кожна окремо.
function analyzerCurrentFen(){
  if(analyzerBranch && analyzerBranchIdx > 0) return analyzerBranch.moves[analyzerBranchIdx-1].fenAfter;
  if(!analyzerGame) return null;
  return analyzerPly === 0 ? analyzerGame.startFen : analyzerGame.plies[analyzerPly-1].fenAfter;
}
function analyzerCurrentEntry(){
  if(analyzerBranch && analyzerBranchIdx > 0) return analyzerBranch.moves[analyzerBranchIdx-1];
  if(!analyzerGame || analyzerPly === 0) return null;
  return analyzerGame.plies[analyzerPly-1];
}

// Гравець зробив хід на дошці аналізатора, що відхиляється від запису
// партії (або продовжує вже почату власну гілку). Хід одразу з'являється
// на дошці; жива оцінка Stockfish (той самий рушій, що й вільна частина
// дебютів) підтягується асинхронно й оновлює лише цей запис.
function analyzerPlayUserMove(fenBefore, mv){
  if(!analyzerBranch){
    analyzerBranch = {fromPly: analyzerPly, moves: []};
    analyzerBranchIdx = 0;
  }
  // Якщо гравець зараз не на кінчику гілки (повернувся назад і зіграв
  // інакше) — "майбутнє" гілки обрізається, як у звичайному GUI.
  analyzerBranch.moves = analyzerBranch.moves.slice(0, analyzerBranchIdx);
  const entry = {
    san: mv.san, from: mv.from, to: mv.to, color: mv.color,
    fenBefore, fenAfter: chess.fen(),
    pending: true, lossCp: null, cls: null, bestSanPv: null, bestUci: null,
    altLines: [], mateAfter: null, whiteCpAfter: null
  };
  analyzerBranch.moves.push(entry);
  analyzerBranchIdx = analyzerBranch.moves.length;
  hintArrow1El.style.display = 'none';
  hintArrow2El.style.display = 'none';
  renderAnalyzerView();
  analyzerJudgeBranchMove(entry);
}

function analyzerJudgeBranchMove(entry){
  queueJudgeJob((done)=>{
    initJudgeEngineIfNeeded(()=>{
      analyzePosition(judgeEngine, entry.fenBefore, HELPER_ANALYSIS_DEPTH, (before)=>{
        const moverColor = entry.fenBefore.split(' ')[1];
        const beforeWhiteCp = cpFromFen(entry.fenBefore, before.lines[0]);
        const bestSanPv = before.lines[0] ? pvToSanText(before.lines[0].pvUci, entry.fenBefore, 6) : '';
        const altLines = before.lines.slice();
        const finalize = (whiteCpAfter, mateAfter, nextBestUci, nextBestSanPv)=>{
          const sign = moverColor === 'w' ? 1 : -1;
          entry.lossCp = Math.max(0, Math.round(sign * (beforeWhiteCp - whiteCpAfter)));
          entry.cls = classifyMoveLoss(entry.lossCp);
          entry.whiteCpAfter = whiteCpAfter;
          entry.mateAfter = mateAfter;
          entry.bestUci = before.bestUci;
          entry.bestSanPv = bestSanPv;
          entry.altLines = altLines;
          entry.nextBestUci = nextBestUci || null;
          entry.nextBestSanPv = nextBestSanPv || '';
          entry.pending = false;
          if(analyzerBranch && analyzerBranch.moves.includes(entry)){
            renderAnalyzerMoveStrip();
            if(analyzerCurrentEntry() === entry){
              renderAnalyzerDetail();
              setStatus('Твій варіант, хід ' + analyzerBranchIdx + ': ' + entry.san + ' — ' + MOVE_QUALITY_META[entry.cls].label + '.', '');
            }
          }
          done();
        };
        // Мат — рушію нема що аналізувати в позиції без ходів (той самий
        // випадок, що й у пакетному аналізаторі партії).
        if(new Chess(entry.fenAfter).in_checkmate()){
          finalize(moverColor === 'w' ? 100000 : -100000, 0, null, '');
          return;
        }
        analyzePosition(judgeEngine, entry.fenAfter, HELPER_ANALYSIS_DEPTH, (after)=>{
          const afterLine = after.lines[0];
          const afterWhiteCp = cpFromFen(entry.fenAfter, afterLine);
          const afterSideToMove = entry.fenAfter.split(' ')[1];
          const mateAfter = (afterLine && afterLine.mate != null) ? (afterSideToMove==='w'?afterLine.mate:-afterLine.mate) : null;
          const nextBestSanPv = afterLine ? pvToSanText(afterLine.pvUci, entry.fenAfter, 6) : '';
          finalize(afterWhiteCp, mateAfter, after.bestUci, nextBestSanPv);
        });
      });
    });
  });
}

function analyzerExitBranch(){
  analyzerBranch = null;
  analyzerBranchIdx = 0;
  hintArrow1El.style.display = 'none';
  hintArrow2El.style.display = 'none';
  renderAnalyzerView();
}

function parsePgnForAnalyzer(pgnText){
  const temp = new Chess();
  let loaded = false;
  try{ loaded = temp.load_pgn(pgnText, {sloppy:true}); }catch(e){ loaded = false; }
  if(!loaded) return {ok:false, error:'Не вдалося розпізнати PGN. Перевір формат партії.'};
  const sanList = temp.history();
  if(!sanList.length) return {ok:false, error:'У партії немає жодного ходу.'};
  let startFen = null, white = null, black = null;
  try{
    const headers = temp.header();
    if(headers && headers.FEN) startFen = headers.FEN;
    if(headers && headers.White) white = headers.White;
    if(headers && headers.Black) black = headers.Black;
  }catch(e){}
  return {ok:true, sanList, startFen, white, black};
}

/* ---- Збережені партії аналізатора (localStorage) ----
   Результат пакетного аналізу (усі позиції, лінії, класифікації) вже
   готовий і коштував реального часу Stockfish — тримаємо його цілком,
   щоб не рахувати партію заново після перезавантаження сторінки. */
const ANALYZER_GAMES_KEY = 'chess_trainer_analyzer_games_v1';
const ANALYZER_GAMES_MAX = 30;

function loadSavedAnalyzerGames(){
  try{ return JSON.parse(localStorage.getItem(ANALYZER_GAMES_KEY)) || []; }catch(e){ return []; }
}
function saveSavedAnalyzerGamesList(list){
  try{ localStorage.setItem(ANALYZER_GAMES_KEY, JSON.stringify(list)); return true; }catch(e){ return false; }
}
function saveCurrentAnalyzerGame(){
  if(!analyzerGame) return;
  const input = document.getElementById('saveGameLabel');
  let label = input ? input.value.trim() : '';
  if(!label){
    const w = analyzerGame.white, b = analyzerGame.black;
    label = (w && b) ? (w + ' — ' + b) : ('Партія від ' + new Date().toLocaleDateString('uk-UA'));
  }
  const list = loadSavedAnalyzerGames();
  list.unshift({
    id: Date.now() + '_' + Math.random().toString(36).slice(2,8),
    label, savedAt: Date.now(),
    pgnText: analyzerGame.pgnText || '',
    game: {startFen: analyzerGame.startFen, plies: analyzerGame.plies, white: analyzerGame.white, black: analyzerGame.black}
  });
  while(list.length > ANALYZER_GAMES_MAX) list.pop();
  if(!saveSavedAnalyzerGamesList(list)){
    analyzerSetProgress('Не вдалося зберегти: сховище браузера переповнене. Видали кілька старих партій і спробуй ще раз.', true);
    return;
  }
  if(input) input.value = '';
  renderSavedGamesList();
  analyzerSetProgress('Партію збережено — «' + label + '».', false);
}
function loadAnalyzerGame(id){
  const entry = loadSavedAnalyzerGames().find(g=>g.id===id);
  if(!entry) return;
  analyzerGen++;
  analyzerBranch = null; analyzerBranchIdx = 0;
  analyzerGame = entry.game;
  analyzerPly = entry.game.plies.length;
  analyzerNavRowEl.style.display = 'flex';
  const pgnInput = document.getElementById('pgnInput');
  if(pgnInput) pgnInput.value = entry.pgnText || '';
  analyzerSetProgress('Завантажено збережену партію — «' + entry.label + '».', false);
  const saveSection = document.getElementById('saveGameSection');
  if(saveSection) saveSection.style.display = 'block';
  renderAnalyzerView();
}
function deleteAnalyzerGame(id){
  const list = loadSavedAnalyzerGames().filter(g=>g.id!==id);
  saveSavedAnalyzerGamesList(list);
  renderSavedGamesList();
}
// Назва партії береться з PGN-заголовків (White/Black) або з поля вводу, тобто це недовірений
// текст — без екранування він вставлявся в сторінку як HTML і зберігався в localStorage.
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function formatSavedAt(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('uk-UA') + ' ' + d.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
}
function renderSavedGamesList(){
  const section = document.getElementById('savedGamesSection');
  const listEl = document.getElementById('savedGamesList');
  if(!section || !listEl) return;
  const list = loadSavedAnalyzerGames();
  if(!list.length){ section.style.display = 'none'; return; }
  section.style.display = 'block';
  listEl.innerHTML = list.map(g => `
    <div class="saved-game-row" data-id="${escapeHtml(g.id)}">
      <div class="saved-game-info">
        <div class="saved-game-label">${escapeHtml(g.label)}</div>
        <div class="saved-game-meta">${formatSavedAt(g.savedAt)} · ${g.game.plies.length} ходів</div>
      </div>
      <button type="button" class="btn" data-action="load" title="Завантажити">▶</button>
      <button type="button" class="btn" data-action="delete" title="Видалити">✕</button>
    </div>`).join('');
  listEl.querySelectorAll('.saved-game-row').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('[data-action="load"]').addEventListener('click', ()=>loadAnalyzerGame(id));
    row.querySelector('[data-action="delete"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('Видалити збережену партію «' + list.find(g=>g.id===id).label + '»?')) deleteAnalyzerGame(id);
    });
  });
}

function analyzerSetProgress(msg, isErr){
  const el = document.getElementById('analyzerProgress');
  if(!el) return;
  el.textContent = msg;
  el.className = 'analyzer-progress' + (isErr ? ' err' : '');
}

function ensureAnalyzerEngine(multipv, onReady){
  if(analyzerEngine && analyzerEngineMultiPV === multipv && !analyzerEngine.failed){
    if(analyzerEngine.ready) onReady(); else analyzerEngine.onReady = onReady;
    return;
  }
  if(analyzerEngine && analyzerEngine.worker){
    try{ analyzerEngine.worker.terminate(); }catch(e){}
  }
  analyzerEngineMultiPV = multipv;
  analyzerEngine = createEngineController({limitStrength:false, multipv});
  analyzerEngine.onReady = onReady;
  analyzerEngine.onError = ()=>{
    analyzerSetProgress('Не вдалося завантажити Stockfish. Перевір з\'єднання з інтернетом.', true);
    analyzerRunning = false;
    const btn = document.getElementById('analyzerRunBtn');
    if(btn) btn.disabled = false;
  };
}

function runAnalyzer(){
  if(analyzerRunning) return;
  const pgnInputEl = document.getElementById('pgnInput');
  const text = pgnInputEl ? pgnInputEl.value.trim() : '';
  if(!text){ analyzerSetProgress('Встав PGN або завантаж файл.', true); return; }
  const parsed = parsePgnForAnalyzer(text);
  if(!parsed.ok){ analyzerSetProgress(parsed.error, true); return; }

  const myGen = ++analyzerGen;
  const multipv = +document.getElementById('analyzerMultiPV').value;
  const depth = +document.getElementById('analyzerDepth').value;
  const runBtn = document.getElementById('analyzerRunBtn');
  if(runBtn) runBtn.disabled = true;
  analyzerRunning = true;
  analyzerSetProgress('Завантаження рушія…', false);

  ensureAnalyzerEngine(multipv, ()=>{
    if(myGen !== analyzerGen) return;
    const replay = new Chess(parsed.startFen || undefined);
    const startFen = replay.fen();
    const plies = [];
    const total = parsed.sanList.length;
    let idx = 0;

    function finish(ok){
      analyzerRunning = false;
      if(runBtn) runBtn.disabled = false;
      if(myGen !== analyzerGen) return;
      if(ok){
        analyzerGame = {startFen, plies, white: parsed.white, black: parsed.black, pgnText: text};
        analyzerPly = plies.length;
        analyzerNavRowEl.style.display = 'flex';
        analyzerSetProgress('Готово — проаналізовано ходів: ' + plies.length + '.', false);
        const saveSection = document.getElementById('saveGameSection');
        if(saveSection) saveSection.style.display = 'block';
        renderAnalyzerView();
      }
    }

    function step(prevResult){
      if(myGen !== analyzerGen){ finish(false); return; }
      if(idx >= total){ finish(true); return; }
      const san = parsed.sanList[idx];
      const fenBefore = replay.fen();
      const mv = replay.move(san, {sloppy:true});
      if(!mv){ idx++; step(prevResult); return; }
      const fenAfter = replay.fen();
      const moveNo = Math.ceil((idx+1)/2);
      const color = mv.color;
      analyzerSetProgress('Аналіз ходу ' + (idx+1) + ' / ' + total + '…', false);

      const beforeWhiteCp = cpFromFen(fenBefore, prevResult.lines[0]);
      const bestUci = prevResult.bestUci;
      const bestSanPv = prevResult.lines[0] ? pvToSanText(prevResult.lines[0].pvUci, fenBefore, 6) : '';
      const altLines = prevResult.lines.slice();

      if(replay.in_checkmate()){
        // Мат — об'єктивно найкращий можливий підсумок ходу; позиція без
        // легальних ходів, рушію нема що рахувати (і нема від чого рахувати
        // "втрату"), тож не питаємо його і одразу записуємо як найкращий хід.
        plies.push({
          ply: idx+1, moveNo, color, san, from: mv.from, to: mv.to,
          fenBefore, fenAfter, bestUci, bestSanPv, altLines,
          lossCp: 0, cls: 'best', whiteCpAfter: color === 'w' ? 100000 : -100000, mateAfter: 0
        });
        idx++;
        step({bestUci:null, lines:[]});
        return;
      }

      analyzePosition(analyzerEngine, fenAfter, depth, (after)=>{
        if(myGen !== analyzerGen){ finish(false); return; }
        const afterLine = after.lines[0];
        const afterWhiteCp = cpFromFen(fenAfter, afterLine);
        const afterSideToMove = fenAfter.split(' ')[1];
        const mateAfter = (afterLine && afterLine.mate != null)
          ? (afterSideToMove === 'w' ? afterLine.mate : -afterLine.mate)
          : null;
        const sign = color === 'w' ? 1 : -1;
        const lossCp = Math.max(0, Math.round(sign * (beforeWhiteCp - afterWhiteCp)));
        plies.push({
          ply: idx+1, moveNo, color, san, from: mv.from, to: mv.to,
          fenBefore, fenAfter, bestUci, bestSanPv, altLines,
          lossCp, cls: classifyMoveLoss(lossCp), whiteCpAfter: afterWhiteCp, mateAfter
        });
        idx++;
        step(after);
      });
    }

    analyzePosition(analyzerEngine, startFen, depth, (startResult)=>{
      if(myGen !== analyzerGen) return;
      step(startResult);
    });
  });
}

function renderAnalyzerControls(){
  itemListEl.innerHTML = `
    <div class="analyzer-field" id="savedGamesSection" style="display:none;">
      <label>Мої партії</label>
      <div id="savedGamesList"></div>
    </div>
