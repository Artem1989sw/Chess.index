// Сигмоїдне стиснення оцінки (той самий трюк, що й у lichess) замість
// жорсткого лінійного обрізання: звичайна перевага в 0.5-2 пішаки вже дає
// помітний рух лінії, а не тільки величезна перевага чи мат — і крива
// плавно виходить на межу графіка замість різкого "плато".
function evalToGraphY(cpWhite, mid, amp){
  const winProb = 1 / (1 + Math.exp(-0.004 * cpWhite));
  return mid - (winProb - 0.5) * 2 * amp;
}

// Оцінка реально гойдається на кожному півході навіть у рівній, добре
// зіграній партії — пряма лінія через КОЖНУ точку через це виглядає як
// кардіограма. Згладжуємо ковзним середнім по сусідніх ходах (сам сигнал
// не чіпаємо — маркери грубих помилок нижче малюються по сирих значеннях).
function smoothCpSeries(values, window){
  const half = Math.floor(window/2);
  return values.map((_, i)=>{
    let sum = 0, count = 0;
    for(let k=-half;k<=half;k++){
      const idx = i+k;
      if(idx >= 0 && idx < values.length){ sum += values[idx]; count++; }
    }
    return sum / count;
  });
}

// Плавна крива через точки (квадратичні Безьє до середини кожного відрізка)
// замість гострих зламів прямими лініями — той самий трюк, що дає лінії
// на кшталт lichess/chess.com їхній "перетікаючий", а не пилкоподібний вигляд.
function smoothSvgPath(pts){
  if(pts.length < 3) return pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
  for(let i=1;i<pts.length-1;i++){
    const mx = (pts[i].x + pts[i+1].x) / 2, my = (pts[i].y + pts[i+1].y) / 2;
    d += ' Q' + pts[i].x.toFixed(1) + ',' + pts[i].y.toFixed(1) + ' ' + mx.toFixed(1) + ',' + my.toFixed(1);
  }
  const last = pts[pts.length-1];
  d += ' L' + last.x.toFixed(1) + ',' + last.y.toFixed(1);
  return d;
}

const GRAPH_WINDOW = 20; // скільки півходів видно одночасно у "вікні" графіка
let graphWinStart = 0, graphWinSpan = 1; // яке «вікно» графіка зараз намальоване — потрібно для кліку по ньому

function renderAnalyzerGraph(){
  const plies = analyzerGame ? analyzerGame.plies : [];
  const n = plies.length;
  if(!n){ analyzerGraphEl.innerHTML = ''; return; }
  const W = 600, H = 130, MID = 65, AMP = 58;
  const centerPly = analyzerBranch ? analyzerBranch.fromPly : analyzerPly;

  // "Вікно" навколо поточного ходу замість стискання всієї партії в
  // фіксовану ширину — інакше на довгій партії кожен хід займає долю
  // пікселя, і графік і виглядає перевантажено, і губить деталі.
  let winStart, winEnd;
  if(n <= GRAPH_WINDOW){
    winStart = 0; winEnd = n;
  } else {
    const half = Math.floor(GRAPH_WINDOW/2);
    winStart = centerPly - half;
    winEnd = winStart + GRAPH_WINDOW;
    if(winStart < 0){ winStart = 0; winEnd = GRAPH_WINDOW; }
    if(winEnd > n){ winEnd = n; winStart = n - GRAPH_WINDOW; }
  }
  const span = winEnd - winStart || 1;
  graphWinStart = winStart; graphWinSpan = span;

  // Згладжуємо по всій партії (щоб точки на межі вікна теж мали контекст
  // сусідів ззовні), а для малювання беремо лише зріз у межах вікна.
  const smoothedCp = smoothCpSeries(plies.map(p=>p.whiteCpAfter), 5);
  const pts = [];
  for(let k=winStart;k<=winEnd;k++){
    pts.push({x: ((k - winStart) / span) * W, y: k === 0 ? MID : evalToGraphY(smoothedCp[k-1], MID, AMP)});
  }
  const linePath = smoothSvgPath(pts);
  const areaPath = linePath + ` L${W},${MID} L0,${MID} Z`;
  const markers = [];
  for(let k=Math.max(1,winStart);k<=winEnd;k++){
    const p = plies[k-1];
    if(p.cls === 'best' || p.cls === 'good') continue;
    const x = ((k - winStart) / span) * W;
    const y = evalToGraphY(p.whiteCpAfter, MID, AMP);
    markers.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${MOVE_QUALITY_META[p.cls].color}" stroke="var(--panel-2)" stroke-width="1.5"></circle>`);
  }
  const curX = ((centerPly - winStart) / span) * W;
  const clipId = 'graphClipTop', clipId2 = 'graphClipBot';
  const moveNoAt = k => k === 0 ? '0' : String(Math.ceil(k/2));
  const rangeLabels = (winStart > 0 || winEnd < n)
    ? `<text x="6" y="14" font-size="11" fill="var(--text-muted)">${moveNoAt(winStart)}.</text>` +
      `<text x="${W-6}" y="14" font-size="11" fill="var(--text-muted)" text-anchor="end">${moveNoAt(winEnd)}.</text>`
    : '';
  analyzerGraphEl.innerHTML = `<defs>
      <clipPath id="${clipId}"><rect x="0" y="0" width="${W}" height="${MID}"></rect></clipPath>
      <clipPath id="${clipId2}"><rect x="0" y="${MID}" width="${W}" height="${H-MID}"></rect></clipPath>
    </defs>` +
    `<path d="${areaPath}" fill="var(--ivory)" opacity="0.4" stroke="none" clip-path="url(#${clipId})"></path>` +
    `<path d="${areaPath}" fill="var(--walnut-dark)" opacity="0.4" stroke="none" clip-path="url(#${clipId2})"></path>` +
    `<line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="var(--line)" stroke-width="1"></line>` +
    `<path d="${linePath}" fill="none" stroke="var(--gold-soft)" stroke-width="2.25" stroke-linejoin="round"></path>` +
    markers.join('') +
    `<line x1="${curX.toFixed(1)}" y1="0" x2="${curX.toFixed(1)}" y2="${H}" stroke="var(--gold)" stroke-width="1.5" opacity="0.85"></line>` +
    rangeLabels;
}

function moveNoFromFen(fen){ return +fen.split(' ')[5]; }

function renderAnalyzerDetail(){
  if(!analyzerGame && !analyzerBranch){
    analyzerDetailEl.innerHTML = '<p class="idea">Зіграй свій хід на дошці — рушій одразу оцінить, або встав PGN зліва, щоб розібрати цілу партію.</p>';
    return;
  }

  let branchNotice = '';
  if(analyzerBranch){
    const hasMainRecord = analyzerGame && analyzerBranch.fromPly > 0;
    const originSan = !analyzerGame ? 'початкової позиції' : (hasMainRecord ? analyzerGame.plies[analyzerBranch.fromPly-1].san + ' (' + analyzerBranch.fromPly + '. хід)' : 'початкової позиції');
    branchNotice = `<div class="branch-notice">🔀 Твій варіант від ${originSan} <button type="button" class="btn" id="analyzerExitBranchBtn">✕ ${analyzerGame ? 'Повернутись до партії' : 'Скинути'}</button></div>`;
  }

  const p = analyzerCurrentEntry();
  if(!p){
    analyzerDetailEl.innerHTML = branchNotice + '<p class="idea">Початкова позиція. Обери хід зі стрічки вище, клікни на графік оцінки нижче — або просто зіграй свій хід на дошці.</p>';
    wireBranchExitBtn();
    return;
  }
  if(p.pending){
    analyzerDetailEl.innerHTML = branchNotice + `<div class="played-line"><strong>${moveNoFromFen(p.fenBefore)}${p.color==='w'?'.':'...'} ${p.san}</strong> — рушій оцінює хід…</div>`;
    wireBranchExitBtn();
    return;
  }
  const meta = MOVE_QUALITY_META[p.cls];
  const evalNote = p.mateAfter != null ? (p.mateAfter === 0 ? 'мат' : 'мат у ' + Math.abs(p.mateAfter)) : formatWhiteCp(p.whiteCpAfter);
  const moveNo = p.moveNo != null ? p.moveNo : moveNoFromFen(p.fenBefore);
  const pill = `<span class="quality-pill" style="background:${meta.color}">${meta.icon} ${meta.label}</span>`;
  let html = branchNotice + `<div class="played-line"><strong>${moveNo}${p.color==='w'?'.':'...'} ${p.san}</strong> ${pill} <span class="text-muted">оцінка: ${evalNote}</span></div>`;
  if(p.lossCp > 0 && p.bestSanPv){
    html += `<div class="engine-line"><span class="engine-line-eval">${p.altLines[0] ? formatLineEval(p.altLines[0], p.fenBefore) : ''}</span><span class="engine-line-pv">${p.bestSanPv}</span></div>`;
    html += `<button type="button" class="btn" id="analyzerShowBestBtn" style="margin:6px 0 10px;">➤ Показати кращий хід на дошці</button>`;
  }
  if(p.altLines && p.altLines.length > 1){
    html += p.altLines.slice(1).map(l=>{
      if(!l) return '';
      return `<div class="engine-line"><span class="engine-line-eval">${formatLineEval(l, p.fenBefore)}</span><span class="engine-line-pv">${pvToSanText(l.pvUci, p.fenBefore, 6)}</span></div>`;
    }).join('');
  }
  // У власному варіанті стрілка наступного ходу з'являється сама — без
  // потреби тицяти кнопку щоразу, поки досліджуєш позицію далі.
  if(analyzerBranch && p.nextBestUci){
    html += `<div class="engine-line"><span class="engine-line-eval">➤</span><span class="engine-line-pv">Далі раджу: ${p.nextBestSanPv}</span></div>`;
  }
  analyzerDetailEl.innerHTML = html;
  wireBranchExitBtn();
  const showBestBtn = document.getElementById('analyzerShowBestBtn');
  if(showBestBtn){
    showBestBtn.addEventListener('click', ()=>{
      setArrow(hintArrow1El, p.bestUci, HINT_ARROW_HEAD_LEN.primary);
      hintArrow2El.style.display = 'none';
    });
  }
  if(analyzerBranch && p.nextBestUci){
    setArrow(hintArrow1El, p.nextBestUci, HINT_ARROW_HEAD_LEN.primary);
    hintArrow2El.style.display = 'none';
  }
}

function renderAnalyzerSummary(){

  analyzerSummaryEl.innerHTML = `<div><strong>Білі:</strong> ${fmt(byColor.w)}</div><div><strong>Чорні:</strong> ${fmt(byColor.b)}</div>`;

function updateAnalyzerBoardBadge(){
  const p = analyzerCurrentEntry();
  if(!p || p.pending || p.cls === 'best' || p.cls === 'good' || !p.to){ boardBadgeEl.style.display = 'none'; return; }
  const meta = MOVE_QUALITY_META[p.cls];
  const pos = squareCenterPercent(p.to);
  boardBadgeEl.style.left = pos.xPct + '%';
  boardBadgeEl.style.top = pos.yPct + '%';
  boardBadgeEl.style.background = meta.color;
  boardBadgeEl.textContent = meta.icon;
  boardBadgeEl.style.display = 'flex';
}

function analyzerGoTo(ply){
  if(!analyzerGame) return;
  analyzerBranch = null;
  analyzerBranchIdx = 0;
  analyzerPly = Math.max(0, Math.min(analyzerGame.plies.length, ply));
  hintArrow1El.style.display = 'none';
  hintArrow2El.style.display = 'none';
  renderAnalyzerView();
}

function analyzerStepPrev(){
  if(analyzerBranch){
    if(analyzerBranchIdx > 0){
      analyzerBranchIdx--;
      hintArrow1El.style.display = 'none'; hintArrow2El.style.display = 'none';
      renderAnalyzerView();
    } else {
      analyzerExitBranch();
    }
    return;
  }
  analyzerGoTo(analyzerPly - 1);
}
function analyzerStepNext(){
  if(analyzerBranch){
    if(analyzerBranchIdx < analyzerBranch.moves.length){
      analyzerBranchIdx++;
      hintArrow1El.style.display = 'none'; hintArrow2El.style.display = 'none';
      renderAnalyzerView();
    }
    return; // на кінчику власної гілки — далі можна лише зіграти новий хід
  }
  analyzerGoTo(analyzerPly + 1);
}
function analyzerStepFirst(){
  analyzerBranch = null; analyzerBranchIdx = 0;
  analyzerGoTo(0);
}
function analyzerStepLast(){
  if(analyzerBranch){
    analyzerBranchIdx = analyzerBranch.moves.length;
    hintArrow1El.style.display = 'none'; hintArrow2El.style.display = 'none';
    renderAnalyzerView();
    return;
  }
  analyzerGoTo(analyzerGame ? analyzerGame.plies.length : 0);
}

  if(!analyzerGame){ moveListEl.textContent = 'Ходів ще не було.'; return; }

  }
  moveListEl.textContent = out.trim();
}

/* ===================== КЛАВІАТУРНІ АКСЕЛЕРАТОРИ ДЛЯ КНОПОК =====================
   Досвідчений гравець (Alex) очікує гарячі клавіші замість постійних кліків мишею.
   Просто "натискаємо" ту саму кнопку, що й миша, — уся логіка валідності (чи є що
   скасовувати, чи це взагалі поточна вкладка) лишається в одному місці, її обробнику. */
const BUTTON_SHORTCUTS = {n:'nextBtn', h:'hintBtn', f:'flipBtn', u:'undoBtn', r:'resetBtn'};
document.addEventListener('keydown', (e)=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if(tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
  const btnId = BUTTON_SHORTCUTS[e.key.toLowerCase()];
  if(!btnId) return;
  const btn = document.getElementById(btnId);
  if(!btn || btn.offsetParent === null) return; // кнопка прихована в поточній вкладці — нічого не робимо
  e.preventDefault();
  btn.click();
});

/* ===================== РЕЗЕРВНА КОПІЯ ПРОГРЕСУ =====================
   Увесь прогрес живе лише в localStorage цього браузера — очищення даних сайту чи
   інший пристрій означає почати спочатку. Експорт/імпорт зберігає рівно ті ключі,
   які створює сам застосунок (усі мають префікс "chess_trainer_"), в один JSON-файл. */
const BACKUP_KEY_PREFIX = 'chess_trainer_';

function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const key = localStorage.key(i);
    if(key && key.indexOf(BACKUP_KEY_PREFIX) === 0) data[key] = localStorage.getItem(key);
  }
  const payload = {app:'chess-trainer', exportedAt: new Date().toISOString(), data};
  const blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'chess-trainer-progress-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importProgress(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(String(reader.result || '')); }
    catch(e){ alert('Не вдалося прочитати файл: це не коректний JSON.'); return; }
    const data = parsed && parsed.data;
    if(!data || typeof data !== 'object'){ alert('Файл не схожий на резервну копію прогресу цього тренажера.'); return; }
    const keys = Object.keys(data).filter(k => k.indexOf(BACKUP_KEY_PREFIX) === 0);
    if(!keys.length){ alert('У файлі не знайдено даних прогресу.'); return; }
    if(!confirm('Замінити поточний прогрес у цьому браузері вмістом файлу (' + keys.length + ' записів)? Це не можна скасувати.')) return;
    keys.forEach(k => { try{ localStorage.setItem(k, data[k]); }catch(e){} });
    alert('Прогрес відновлено. Сторінка зараз перезавантажиться.');
    location.reload();
  };
  reader.onerror = ()=> alert('Не вдалося прочитати файл.');
  reader.readAsText(file);
}

document.getElementById('exportProgressBtn').addEventListener('click', exportProgress);
document.getElementById('importProgressBtn').addEventListener('click', ()=>{
  document.getElementById('importProgressFile').click();
});
document.getElementById('importProgressFile').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(file) importProgress(file);
  e.target.value = ''; // дозволяє повторно обрати той самий файл ще раз
});

/* ===================== СТАРТ ===================== */

function init(){
  renderItemList();
  selectOpening(OPENINGS[0].id);
}

if(typeof Chess === 'undefined'){
  itemHeaderEl.innerHTML = '<p>Не вдалося завантажити бібліотеку chess.js. Перевір з\'єднання з інтернетом і онови сторінку.</p>';
} else {
  init();
}
</script>
