<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаховий тренажер — дебюти, тактика, ендшпілі, аналіз партій</title>
<meta name="description" content="Безкоштовний шаховий тренажер українською: дебютні лінії, тактика, ендшпілі, гра проти Stockfish та аналіз власних партій. Без реєстрації, прогрес зберігається у браузері.">
<meta name="theme-color" content="#211C17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  :root{
    --bg:#211C17;
    --panel:#2C251E;
    --panel-2:#342C23;
    --line:#4A3F32;
    --ivory:#E8DCC4;
    --walnut:#7C5A3A;
    --walnut-dark:#5E4128;
    --gold:#C08A3E;
    --gold-soft:#E0B36A;
    --olive:#7C9A66;
    --clay:#B0553D;
    --text:#EDE6D8;
    --text-muted:#A79885;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    /* розмір дошки враховує поля сторінки й панелі, щоб на телефоні вона не вилазила за край */
    --board-size:min(420px, calc(100vw - 72px));
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--gold-soft);}

  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}

  header.top{margin-bottom:22px;}
  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .theme-toggle{
    appearance:none;
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:1.05rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover{border-color:var(--gold);}
  .theme-toggle:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  body.light-theme{
    --bg:#F4EEE0;
    --panel:#FFFFFF;
    --panel-2:#F0E9D8;
    --line:#D9CBAE;
    --ivory:#F0E4C8;
    --walnut:#8B6B43;
    --walnut-dark:#6B4E2E;
    --gold:#B8863E;
    --gold-soft:#8A6428;
    --olive:#5C7A46;
    --clay:#A34A34;
    --text:#2A2118;
    --text-muted:#6B5C45;
  }
  body.light-theme .piece-w{color:#FFFFFF;text-shadow:0 0 1px #2A1C12,0 0 2px #2A1C12,0 1px 0 #2A1C12;}
  body.light-theme .piece-b{color:#241811;text-shadow:0 0 1px #FFFFFF,0 0 2px #FFFFFF;}
  .stats-line .streak{color:var(--clay);}
  header.top h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:2rem;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header.top p{
    margin:0;
    color:var(--text-muted);
    font-size:0.98rem;
    max-width:56ch;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin:22px 0 18px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    appearance:none;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.95rem;
    padding:10px 4px;
    margin-right:22px;
    white-space:nowrap;
    flex:0 0 auto;
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{color:var(--gold-soft);border-bottom-color:var(--gold);}
  .tab-btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:-2px;}
  .item-list-label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-muted);margin:0.9rem 0 0.3rem 0.2rem;}
  .item-list-label:first-child{margin-top:0.2rem;}

  .stats-line{
    color:var(--text-muted);
    font-size:0.85rem;
    margin-bottom:8px;
  }
  .backup-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
  .stats-line strong{color:var(--gold-soft);font-weight:600;}

  .layout{
    display:grid;
    grid-template-columns:250px minmax(0,1fr);
    gap:22px;
    align-items:start;
  }
  .item-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:minmax(0,1fr);}
    .item-list{
      flex-direction:row;
      align-items:center;
      overflow-x:auto;
      gap:8px;
      padding-bottom:6px;
    }
    .item-list .item-btn{white-space:nowrap;flex:0 0 auto;}
    .item-list .item-btn .item-label span.txt{display:block;white-space:nowrap;text-overflow:ellipsis;}
    .item-list .item-row{flex:0 0 auto;}
    .item-list .diff-filter{flex:0 0 auto;flex-wrap:nowrap;margin-bottom:0;}
    .item-list .item-list-label{flex:0 0 auto;white-space:nowrap;margin:0;}
  }
  @media (max-width:560px){
    .main-panel{padding:14px;}
  }

  .item-btn{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    padding:10px 12px;
    font-family:var(--font-body);
    font-size:0.88rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .item-btn:hover{border-color:var(--gold);}
  .item-btn.active{border-color:var(--gold);background:var(--panel-2);}
  .item-btn .badge{
    flex:0 0 auto;
    width:16px;height:16px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;color:transparent;
  }
  .item-btn.done .badge{
    background:var(--olive);
    border-color:var(--olive);
  }
  .item-btn.due .badge{
    background:var(--gold);
    border-color:var(--gold);
    color:#241811;
  }
  .item-btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  .item-row{display:flex;align-items:stretch;gap:4px;}
  .item-row .item-btn{flex:1 1 auto;min-width:0;}
  .rep-star{
    appearance:none;
    flex:0 0 auto;
    width:30px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text-muted);
    font-size:0.95rem;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .rep-star:hover{border-color:var(--gold);color:var(--gold-soft);}
  .rep-star.active{color:var(--gold);border-color:var(--gold);}
  .rep-star:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}

  .main-panel{
    min-width:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
  }
  .item-header{margin-bottom:14px;}
  .item-header .eco{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--gold-soft);
    letter-spacing:0.02em;
  }
  .item-header h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.4rem;
    margin:2px 0 8px;
  }
  .item-header p{margin:0;color:var(--text-muted);font-size:0.92rem;max-width:60ch;}

  .board-area{
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    margin-top:16px;
  }

  .board-col{flex:0 0 auto;}

  .board-wrap{position:relative;width:var(--board-size);height:var(--board-size);}
  .hint-arrows{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:5;
  }
  .hint-arrow{
    stroke-linecap:round;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.35));
  }
  .hint-arrow.arrow-green{stroke:var(--olive);stroke-width:9;opacity:0.9;}
  .hint-arrow.arrow-red{stroke:var(--clay);stroke-width:7.5;opacity:0.75;}

  .board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    width:var(--board-size);
    height:var(--board-size);
    border:3px solid var(--walnut-dark);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .sq{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .sq.light{background:var(--ivory);}
  .sq.dark{background:var(--walnut);}
  .sq.selected::after{
    content:"";
    position:absolute;inset:0;
    background:rgba(192,138,62,.45);
  }
  .sq.legal::after{
    content:"";
    position:absolute;
    width:26%;height:26%;
    border-radius:50%;
    background:rgba(44,37,30,.35);
  }
  .sq.legal.has-piece::after{
    width:100%;height:100%;
    border-radius:0;
    background:transparent;
    border:4px solid rgba(44,37,30,.4);
    box-sizing:border-box;
  }
  .sq.last-from, .sq.last-to{box-shadow:inset 0 0 0 3px rgba(192,138,62,.55);}
  .sq:focus-visible{outline:2px solid var(--gold-soft);outline-offset:-3px;}
  .sq.drag-hover::after{
    content:"";
    position:absolute;inset:0;
    background:rgba(184,134,62,.28);
  }
  .sq-coord{
    position:absolute;
    font-family:var(--font-mono);
    font-size:0.62rem;
    font-weight:600;
    line-height:1;
    pointer-events:none;
    opacity:0.8;
    z-index:1;
  }
  .sq-coord.rank{top:2px;left:3px;}
  .sq-coord.file{bottom:2px;right:3px;}
  .sq.light .sq-coord{color:var(--walnut);}
  .sq.dark .sq-coord{color:var(--ivory);}
  .piece{
    font-size:calc(var(--board-size) * 0.1);
    line-height:1;
    z-index:2;
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .piece.dragging-source{opacity:.3;}
  .drag-ghost{
    position:fixed;
    top:0; left:0;
    pointer-events:none;
    z-index:1000;
    line-height:1;
    transform:translate(-50%,-50%);
    will-change:transform;
  }
  .piece-w{color:#F7F1E3;text-shadow:0 0 1px #2A1C12,0 0 2px #2A1C12,0 1px 0 #2A1C12;}
  .piece-b{color:#241811;text-shadow:0 0 1px #F7F1E3,0 0 2px #F7F1E3;}

  .info-col{flex:1 1 220px;min-width:220px;}

  .status-msg{
    font-size:0.92rem;
    padding:10px 12px;
    border-radius:6px;
    background:var(--panel-2);
    border:1px solid var(--line);
    margin-bottom:12px;
    min-height:20px;
  }
  .status-msg.ok{border-color:var(--olive);color:var(--olive);}
  .status-msg.err{border-color:var(--clay);color:#D98A75;}
  .status-msg.win{border-color:var(--gold);color:var(--gold-soft);}
  .status-msg.warn{border-color:var(--gold);color:var(--text);}

  .move-list{
    font-family:var(--font-mono);
    font-size:0.82rem;
    color:var(--text-muted);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    min-height:46px;
    margin-bottom:12px;
    word-break:break-word;
  }

  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.85rem;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold-soft);}
  .btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#241811;}
  .btn.primary:hover{background:var(--gold-soft);color:#241811;}

  .hint-text{
    font-size:0.85rem;
    color:var(--text-muted);
    margin-top:8px;
    font-style:italic;
  }

  .explain{
    font-size:0.9rem;
    color:var(--text);
    background:var(--panel-2);
    border-left:3px solid var(--gold);
    padding:10px 12px;
    border-radius:0 6px 6px 0;
    margin-top:12px;
  }

  .move-comment{
    font-size:0.85rem;
    color:var(--text);
    background:var(--panel-2);
    border-left:3px solid var(--olive);
    padding:8px 12px;
    border-radius:0 6px 6px 0;
    margin-top:10px;
  }

  .theory{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .theory h3{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.02rem;
    margin:0 0 6px;
    color:var(--gold-soft);
  }
  .theory .idea{font-size:0.9rem;color:var(--text);margin:0 0 12px;max-width:70ch;}
  .eval-strip-line{
    font-family:var(--font-mono);
    font-size:1.15rem;
    letter-spacing:1px;
    color:var(--gold-soft);
    word-break:break-all;
  }
  .plans-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:14px;
  }
  @media (max-width:560px){.plans-grid{grid-template-columns:1fr;}}
  .plans-col h4{
    font-size:0.78rem;
    text-transform:none;
    color:var(--text-muted);
    margin:0 0 6px;
    font-weight:600;
  }
  .plans-col ul{margin:0;padding-left:18px;font-size:0.86rem;color:var(--text);}
  .plans-col li{margin-bottom:4px;}
  .trap-box{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
  }
  .trap-box .trap-name{
    font-weight:600;
    font-size:0.9rem;
    color:var(--clay);
    margin-bottom:4px;
  }
  .trap-box p{font-size:0.85rem;color:var(--text-muted);margin:0 0 10px;}

  .variations-box{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-top:12px;
  }
  .variations-box h4{margin:0 0 8px;font-size:0.9rem;color:var(--olive);}
  .variation-item{margin-bottom:12px;}
  .variation-item:last-child{margin-bottom:0;}
  .variation-item .variation-name{
    font-weight:600;
    font-size:0.87rem;
    color:var(--gold-soft);
    margin-bottom:2px;
  }
  .variation-item p{font-size:0.85rem;color:var(--text-muted);margin:0 0 8px;}
  .reference-article{margin-top:4px;}
  .reference-article .ref-eco{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--gold-soft);
    letter-spacing:0.02em;
  }
  .reference-article h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.5rem;
    margin:2px 0 6px;
  }
  .item-header .reference-article .ref-tagline,
  .reference-article .ref-tagline{
    font-size:0.95rem;
    color:var(--text-muted);
    font-style:italic;
    margin:0 0 18px;
    max-width:74ch;
  }
  .reference-article h3{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.08rem;
    color:var(--gold-soft);
    margin:24px 0 10px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .reference-article h3:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .item-header .reference-article p,
  .reference-article p{
    margin:0 0 11px;
    color:var(--text);
    font-size:0.94rem;
    max-width:74ch;
  }
  .reference-article ul{margin:0 0 12px;padding-left:20px;max-width:74ch;}
  .reference-article li{margin-bottom:6px;font-size:0.94rem;color:var(--text);}
  .reference-article strong{color:var(--gold-soft);}
  .ref-quicknav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:0 0 20px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .ref-quicknav a{
    display:inline-flex;
    align-items:center;
    padding:5px 12px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-size:0.78rem;
    text-decoration:none;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .ref-quicknav a:hover, .ref-quicknav a:focus-visible{border-color:var(--gold-soft);color:var(--gold-soft);}
  .gterm{
    border-bottom:1px dotted var(--gold-soft);
    cursor:help;
    position:relative;
  }
  .gterm:hover, .gterm:focus{color:var(--gold-soft);outline:none;}
  .ref-crosslink{color:var(--gold-soft);text-decoration:underline;text-decoration-color:var(--line);cursor:pointer;}
  .ref-crosslink:hover, .ref-crosslink:focus-visible{text-decoration-color:var(--gold-soft);outline:none;}
  .gterm:hover::after, .gterm:focus::after{
    content:attr(data-def);
    position:absolute;
    left:50%;
    top:calc(100% + 7px);
    transform:translateX(-50%);
    width:max-content;
    max-width:min(260px, calc(100vw - 32px));
    background:var(--panel-2);
    border:1px solid var(--gold-soft);
    color:var(--text);
    font-style:normal;
    font-weight:400;
    font-size:0.8rem;
    line-height:1.4;
    padding:8px 10px;
    border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    z-index:50;
    white-space:normal;
  }
  .ref-diagram{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
    margin:0 0 18px;
    padding:14px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
  }
  .mini-board{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr);
    width:min(220px,60vw);
    height:min(220px,60vw);
    border:2px solid var(--walnut-dark);
    border-radius:4px;
    overflow:hidden;
    flex:0 0 auto;
  }
  .mini-board .sq{cursor:default;}
  .mini-board .piece{font-size:min(5.5vw,24px);cursor:default;}
  .ref-diagram-caption{font-size:0.85rem;color:var(--text-muted);max-width:60ch;margin:0;}
  .ref-quiz{margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line);}
  .ref-quiz h3{margin-top:0;padding-top:0;border-top:none;}
  .ref-quiz-q{margin:0 0 20px;}
  .ref-quiz-q:last-child{margin-bottom:0;}
  .ref-quiz-question{font-size:0.95rem;color:var(--text);margin:0 0 10px;font-weight:600;}
  .ref-quiz-options{display:flex;flex-direction:column;gap:7px;max-width:60ch;}
  .ref-quiz-opt{
    display:block;
    width:100%;
    text-align:left;
    padding:9px 12px;
    border-radius:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-body);
    font-size:0.88rem;
    cursor:pointer;
    transition:border-color .15s;
  }
  .ref-quiz-opt:hover:not(:disabled){border-color:var(--gold-soft);}
  .ref-quiz-opt:disabled{cursor:default;}
  .ref-quiz-opt.correct{border-color:var(--olive);background:rgba(124,154,102,0.15);color:var(--olive);}

  .board-badge{

    width:16px;height:16px;

    align-items:center;

  /* Сенсорні екрани: цілі натискання не менші за ~40px */
  @media (pointer:coarse){
    .diff-btn{padding:9px 13px;}

  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Шаховий тренажер</h1>
        <p>Відпрацьовуй дебютні лінії та тактичні удари прямо в браузері — без реєстрації, прогрес зберігається локально.</p>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Перемкнути тему" title="Перемкнути тему">🌙</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="openings" aria-current="page">Дебюти</button>
    <button class="tab-btn" data-tab="tactics">Тактика</button>
    <button class="tab-btn" data-tab="cct">Зівки (CCT)</button>
    <button class="tab-btn" data-tab="endgames">Ендшпілі</button>
    <button class="tab-btn" data-tab="bot">Проти бота</button>
    <button class="tab-btn" data-tab="analyzer">Аналізатор партії</button>
    <button class="tab-btn" data-tab="reference">Довідник</button>
  </nav>

  <div class="stats-line" id="statsLine"></div>
  <div class="backup-row">
    <button type="button" class="diff-btn" id="exportProgressBtn" title="Зберегти весь прогрес (дебюти, тактика, ендшпілі, репертуар, налаштування, збережені партії аналізатора) в один файл">⇩ Зберегти прогрес</button>
    <button type="button" class="diff-btn" id="importProgressBtn" title="Відновити прогрес із раніше збереженого файлу">⇧ Завантажити прогрес</button>
    <input type="file" id="importProgressFile" accept="application/json,.json" style="display:none;">
  </div>

  <main class="layout">
    <div class="item-list" id="itemList"></div>

    <div class="main-panel">
      <div class="item-header" id="itemHeader"></div>

      <div class="reference-article" id="referenceArticle" style="display:none;"></div>

      <div class="board-area" id="boardArea">
        <div class="eval-col" id="evalCol" style="display:none;">
          <div class="eval-bar" id="evalBar"><div class="eval-bar-fill" id="evalBarFill" style="height:50%;"></div></div>
          <div class="eval-bar-label" id="evalBarLabel">0.0</div>
        </div>
        <div class="board-col">
          <div class="board-wrap" id="boardWrap">
            <div class="board" id="board" role="group" aria-label="Шахова дошка. Стрілки — рух фокусом, Enter або Пробіл — вибрати поле чи зробити хід, Escape — скасувати вибір."></div>
            <svg class="hint-arrows" id="hintArrows" viewBox="0 0 420 420" preserveAspectRatio="xMidYMid meet">
              <defs>
                <marker id="arrowHeadGreen" viewBox="0 0 10 10" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
                  <polygon points="0,0 10,5 0,10" fill="var(--olive)"></polygon>
                </marker>
                <marker id="arrowHeadRed" viewBox="0 0 10 10" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" refX="0" refY="5" orient="auto">
                  <polygon points="0,0 10,5 0,10" fill="var(--clay)"></polygon>
                </marker>
              </defs>
              <line id="hintArrow1" class="hint-arrow arrow-green" marker-end="url(#arrowHeadGreen)" style="display:none;"></line>
              <line id="hintArrow2" class="hint-arrow arrow-red" marker-end="url(#arrowHeadRed)" style="display:none;"></line>
            </svg>
            <div id="boardBadge" class="board-badge" style="display:none;"></div>
          </div>
        </div>
        <div class="info-col">
          <div class="status-msg" id="statusMsg" role="status" aria-live="polite">Обери пункт зі списку зліва.</div>
          <div class="move-list" id="moveList"></div>
          <div id="moveCommentBox" class="move-comment" style="display:none;"></div>
          <div id="principleMoveStrip" class="move-strip" style="display:none;"></div>
          <div id="freePlayBox" style="display:none;">
            <button class="btn primary" id="playVsEngineBtn">Грати без перевірки принципів</button>
          </div>
          <div id="analysisBtnBox" style="display:none;margin:4px 0 12px;">
            <button class="btn" id="analysisBtn" style="width:100%;">📊 Показати аналіз ходів</button>
          </div>
          <div id="botBox" style="display:none;">
            <div class="engine-status" id="engineStatusLine"></div>
            <label class="hint-toggle"><input type="checkbox" id="botHintsToggle"> Підказки рушія (2 лінії)</label>
            <div class="engine-lines" id="engineLinesBox"></div>
          </div>
          <div id="analyzerBox" style="display:none;">
            <div class="move-strip-row">
              <button type="button" class="strip-arrow-btn" id="analyzerStripPrevBtn" title="Попередній хід">‹</button>
              <div id="analyzerMoveStrip" class="move-strip"></div>
              <button type="button" class="strip-arrow-btn" id="analyzerStripNextBtn" title="Наступний хід">›</button>
            </div>
            <svg id="analyzerGraph" class="eval-graph" viewBox="0 0 600 130" preserveAspectRatio="none"></svg>
            <div id="analyzerDetail" class="analyzer-detail"></div>
            <div id="analyzerSummary" class="analyzer-summary"></div>
            <div class="btn-row" id="analyzerNavRow" style="display:none;">
              <button class="btn" id="analyzerFirstBtn" title="До початку партії">« Початок</button>
              <button class="btn" id="analyzerPrevBtn" title="Попередній хід">‹ Назад</button>
              <button class="btn" id="analyzerNextBtn" title="Наступний хід">Вперед ›</button>
              <button class="btn" id="analyzerLastBtn" title="До кінця партії">Кінець »</button>
              <button class="btn" id="analyzerFlipBtn" title="Подивитись на дошку з іншого боку">⇅ Розвернути</button>
            </div>
          </div>
          <div class="btn-row" id="mainBtnRow">
            <button class="btn" id="resetBtn">Почати заново</button>
            <button class="btn" id="undoBtn">Скасувати хід</button>
            <button class="btn" id="flipBtn" title="Подивитись на дошку з іншого боку">⇅ Розвернути</button>
            <button class="btn" id="hintBtn">Підказка</button>
            <button class="btn primary" id="nextBtn">Далі →</button>
          </div>
          <div id="hintBox" class="hint-text" style="display:none;"></div>
          <div id="explainBox" class="explain" style="display:none;"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
/* ===================== НАЛАШТУВАННЯ ПЕРЕВІРКИ ПРИНЦИПІВ =====================
   Усі порогові числа для вільної частини дебюту (розділ "ПРИНЦИПИ ДЕБЮТУ" —
   evaluatePrincipleMove, classifyMoveLoss, getPositionAdvisories) зібрані тут
   одним місцем, щоб підкручувати після тестування, не шукаючи по всьому файлу. */
const PRINCIPLE_TUNING = {
  // Від якої вартості фігури (у "пішакових" одиницях, пішак = 100) хід, що
  // залишає її під боєм без компенсації, вважається явним ляпом.
  hangThreshold: { strict: 300, soft: 500 },
  // Скільки легких фігур (з b/c/f/g1 чи 8) має бути розвинено, перш ніж
  // дозволити вивід ферзя.
  minDevelopedForQueen: { strict: 2, soft: 1 },
  // Те саме — перш ніж дозволити хід крайнім пішаком (a/h) на два поля.
  // Діє лише в строгому режимі (у м'якому цю перевірку вимкнено повністю).
  minDevelopedForRookPawn: 3,
  // Класифікація ходу за втратою оцінки рушія (у тих самих "пішакових"
  // одиницях): <= good — хороший хід, <= inaccuracy — неточність, більше —
  // помилка.
  moveQuality: { good: 50, inaccuracy: 150, blunder: 300 },
  // Через скільки напівходів після початку вільної частини з'являються
  // ненав'язливі підказки про рокіровку й боротьбу за центр.
  advisoryPlies: { castle: 16, centerPawn: 10 }
};

/* ===================== ДАНІ ===================== */

const OPENINGS = [
  {id:"italian", name:"Італійська партія", eco:"C50", side:"white", coreMoves:6,
   moves:["e4","e5","Nf3","Nc6","Bc4","Bc5","c3","Nf6","d3","d6","O-O","O-O"], moveComments:["Захоплюємо центр і відкриваємо дорогу слону та ферзю.","Чорні відповідають симетрично, борючись за центр.","Розвиваємо коня з нападом на пішака e5.","Чорні захищають пішака e5, розвиваючи фігуру.","Слон одразу цілиться в найслабший пункт чорних — f7.","Джуоко Піано: чорні відповідають дзеркально, розвиваючи слона назустріч.","Готуємо d4, забезпечуючи слону в разі потреби відступ на b3 чи c2.","Чорні розвивають коня, борючись за центр і атакуючи e4.","Джуоко Піанісимо: білі не поспішають з d4, спершу завершуючи розвиток.","Чорні дзеркалять і собі готують рокіровку.","Ховаємо короля в безпеку, готуючись до маневрів у центрі.","Чорні також рокіруються — типова спокійна італійська з обопільними шансами."],
   description:"Класичний розвиваючий дебют — слон одразу цілиться у слабкий пункт f7.",
   theory:{
     idea:"Швидкий розвиток фігур із негайним тиском на слабкий пункт f7, який до рокіровки захищає лише король.",
     plansWhite:["Рокіруватися і зіграти c3 та d4, захопивши центр","Тримати слона на c4, спрямованого на f7","У гострих лініях шукати випад конем на g5, атакуючи f7"],
     plansBlack:["Вивести коня на f6, атакуючи пішака e4","Розвинути слона на c5 або e7 і рокіруватися","Підготувати d5, борючись за центр"],
     trap:{name:"Мат Легаля",
       moves:["e4","e5","Nf3","Nc6","Bc4","d6","Nc3","Bg4","Nxe5","Bxd1","Bxf7+","Ke7","Nd5#"],

     variations:[

  {id:"opensicilian", name:"Сицилійський захист, Найдорф", eco:"B90", side:"white", coreMoves:10,
   moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","a6","Bg5","e6","f4","Be7","Qf3","Qc7","O-O-O","Nbd7","g4","b5"], moveComments:["Захоплюємо центр і відкриваємо гру.","Чорні уникають симетрії, борючись за центр із флангу.","Готуємо d4, розвиваючи фігуру заздалегідь.","Чорні готують ...Nf6, не боячись e5 з темпом.","Розкриваємо центр — типовий сицилійський прорив.","Чорні змушені взяти, інакше залишаться зі стисненою грою.","Кінь централізується, контролюючи ключові поля.","Чорні розвивають коня, нападаючи на пішака e4.","Захищаємо e4 і завершуємо розвиток легких фігур.","Варіант Найдорфа: чорні готують b5, не пускаючи білі фігури на b5 і c4.","Головний хід теорії: слон зв'язує коня f6, посилюючи тиск на центр.","Чорні готують розвиток слона f8, зберігаючи гнучкість щодо структури.","Білі захоплюють ще більше простору і готують штурм e5 або f5 — головна ідея класичної лінії з 6.Bg5.","Чорні завершують розвиток слона, готуючись вивести ферзя і зберегти гнучкість щодо рокіровки.","Ферзь переходить на активну позицію, посилюючи тиск на зв'язку по діагоналі g5–e7 і готуючи довгу рокіровку.","Чорні виводять ферзя на зручне поле, уникаючи розмінів і готуючи майбутній хід b5.","Білі ховають короля на ферзевому фланзі — тепер обидві сторони готові до гострих перегонів пішакових штурмів на протилежні фланги.","Чорні розвивають останнього коня, готуючи b5 і зайвий раз підтримуючи можливе e5.","Класичний штурм: білі одразу женуть пішака вперед, готуючи g5, щоб відкинути коня f6 і розкрити лінії проти чорного короля.","Чорні відповідають дзеркальним штурмом на іншому фланзі — типова гонка: хто швидше розкриє лінії проти короля суперника."],

  {id:"sicilianDragon", name:"Сицилійський захист, Дракон", eco:"B70", side:"white", coreMoves:10,

   moveComments:["Захоплюємо центр і відкриваємо гру.","Сицилійський захист — чорні борються за центр із флангу, уникаючи симетрії.","Розвиваємо коня, готуючи d4.","Чорні готують ...Nf6, не боячись e5 із темпом.","Розкриваємо центр, пропонуючи розмін.","Чорні беруть, відкриваючи лінію «c» для майбутньої тури.","Відновлюємо матеріальну рівність, централізуючи коня.","Розвиваємо коня з нападом на пішака e4.","Захищаємо e4, розвиваючи фігуру.","Дракон: чорні готують фланкетто слона на g7, який тиснутиме на центр по довгій діагоналі.","Готуємо Qd2 і рокіровку в довгу сторону — Югославська атака.","Слон стає на найсильнішу діагональ a1–h8, тиснучи на центр і майбутній ферзевий фланг білих.","Зміцнюємо пішака e4 і забираємо в чорного коня поле g4, готуючи майбутній штурм g2-g4.","Чорні ховають короля, поки лінія «h» ще закрита — пізніше, після зустрічних штурмів, рокіровка стане куди небезпечнішою.","Ферзь готується піти на h6 для розміну чорнопільних слонів або просто підтримати довгу рокіровку — ключовий хід плану Югославської атаки.","Чорні розвивають останнього коня, посилюючи тиск на центральні поля d4 і e5.","Слон переходить на найактивнішу діагональ, націлюючись на пункт f7 — класична розстановка проти Дракона.","Чорні готують ферзевого слона, звільняючи поле c8 для тури і зберігаючи гнучкість.","Білі також ховають короля на ферзевому фланзі — починається класична гонка пішакових штурмів на протилежні фланги, що визначає весь стиль Дракона.","Тура одразу стає на напіввідкриту лінію «c», готуючи розмін чи жертву на c3 у слушний момент — головна контргра чорних у Югославській атаці."],
   description:"Чорні фланкетують слона на g7, створюючи гострий дисбаланс — білі зазвичай рокіруються в довгу сторону й ідуть в атаку пішаками, чорні контратакують по лінії «c» і довгій діагоналі.",

       {name:"Прискорений дракон (2...Nc6)",moves:["e4","c5","Nf3","Nc6","d4","cxd4","Nxd4","g6","Nc3","Bg7","Be3","Nf6","Bc4","O-O","Bb3","d6"],note:"Чорні відкладають ...d6 і одразу фланкетують слона, залишаючи собі можливість зіграти d5 в один хід і уникнути найгостріших ліній Югославської атаки."},

  {id:"sicilianScheveningen", name:"Сицилійський захист, Шевенінген", eco:"B80", side:"white", coreMoves:10,

   moveComments:["Захоплюємо центр і відкриваємо гру.","Сицилійський захист — чорні борються за центр із флангу, уникаючи симетрії.","Розвиваємо коня, готуючи d4.","Чорні готують ...Nf6, не боячись e5 із темпом.","Розкриваємо центр, пропонуючи розмін.","Чорні беруть, відкриваючи лінію «c» для майбутньої тури.","Відновлюємо матеріальну рівність, централізуючи коня.","Розвиваємо коня з нападом на пішака e4.","Захищаємо e4, розвиваючи фігуру.","Шевенінген: чорні будують компактний пішаковий трикутник d6-e6, гнучко відкладаючи розвиток фігур.","Розвиваємо слона скромно, готуючись рокіруватися.","Чорні також готують рокіровку, зберігаючи гнучку структуру.","Ховаємо короля — на відміну від гострих ліній дракона тут немає поспіху з атакою, білі спершу закінчують розвиток.","Чорні також рокіруються, завершуючи мінімальний розвиток перед вибором плану — b5 чи d5.","Профілактичний хід: король сходить із діагоналі a7-g1, прибираючи тактики на кшталт ...Nxd4 чи ...e5 із темпом.","Чорні розвивають останнього коня, посилюючи тиск на пункт d4.","Білі захоплюють простір у центрі й на королівському фланзі, готуючи за потреби Qe1-g3 чи h4.","Чорні готують b5, повертаючись до типового сицилійського плану контргри на ферзевому фланзі.","Профілактика: білі назавжди забирають у чорних хід b5, стримуючи контргру на фланзі — типовий прийом проти гнучких сицилійських структур.","Чорні виводять ферзя на активне поле, готуючи Rd8 чи Rb8 і остаточно завершуючи перегрупування фігур."],
   description:"Чорні будують компактний пішаковий трикутник d6-e6, гнучко відкладаючи розвиток слона f8 і коня b8, готові реагувати на план білих.",
   theory:{
     idea:"«Маленький центр» — чорні не займають багато простору, зате мають гнучку, важку для точної атаки структуру; головна небезпека для чорних — агресивний план Кереса (g4) ще до рокіровки.",
     plansWhite:["Розвинутися класично (Be2, O-O, f4) і тиснути в центрі та на королівському фланзі","Зіграти g4-g5 (атака Кереса) ще до рокіровки, відкидаючи коня f6 і послаблюючи чорного короля","Використати простір для фігурної атаки, поки чорні закінчують розвиток"],
     plansBlack:["Розвинути слона на e7 і коня на c6 чи d7, готуючи рокіровку","Зіграти a6 і b5, контратакуючи на ферзевому фланзі (по суті переходячи до Найдорфа)","Стежити за загрозою g4-g5 і за потреби зіграти h6, стримуючи атаку Кереса"],
     variations:[
       {name:"Атака Кереса",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","e6","g4","Be7","g5","Nfd7","Be3","O-O"],note:"Білі одразу йдуть пішаком на g4, не чекаючи завершення розвитку — агресивний план, що відкидає коня f6 і готує подальший штурм g5."},
       {name:"Англійська атака",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","e6","Be3","Nc6","f3","Be7","Qd2","O-O"],note:"Білі готують f3, Qd2 і рокіровку в довгу сторону — сучасний агресивний план, популярний проти багатьох сицилійських структур."},
       {name:"Класичний варіант (6.f4)",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","e6","f4","Be7","Be2","O-O","O-O","Nc6"],note:"Білі одразу захоплюють простір ходом f4 замість тихого Be2, готуючи e5 або підтримку майбутнього штурму на королівському фланзі."},
       {name:"Фланкеттовий підхід (6.g3)",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","e6","g3","Be7","Bg2","O-O","O-O","Nc6"],note:"Білі ховають слона на g2 замість класичного розвитку на e2 — спокійніший, позиційний план, що уникає прямої пішакової гонки."},
       {name:"Гнучкий порядок ходів (5...a6)",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","a6","Bg5","e6","f4","Be7","Qf3","Qc7"],note:"Чорні спершу грають a6 (за Найдорфом), залишаючи вибір між e6 (Шевенінген) і e5 відкритим ще на один хід і чекаючи, як розвинеться білий слон."},
       {name:"Атака Велімировича (6.Bc4)",moves:["e4","c5","Nf3","d6","d4","cxd4","Nxd4","Nf6","Nc3","e6","Bc4","Be7","Bb3","O-O","f3","b5"],note:"Слон одразу цілиться в пункт e6, а білі готують швидкий наступ ферзем і конем на короля ще до завершення розвитку — один із найгостріших ударів по Шевенінгену."}
     ]
   }},
  {id:"french", name:"Французький захист", eco:"C00", side:"black", coreMoves:6,
   moves:["e4","e6","d4","d5","e5","c5","c3","Nc6","Nf3","Qb6","Be2","Nh6"], moveComments:["Захоплюємо центр.","Чорні готують d5, залишаючи слону c8 менше простору.","Розширюємо центр, поки є нагода.","Чорні одразу б'ють по центру білих.","Варіант просування: білі захоплюють простір, зберігаючи пішаковий ланцюг.","Чорні одразу атакують основу пішакового ланцюга d4-e5.","Зміцнюємо пункт d4 додатковим захисником.","Чорні розвивають коня, посилюючи тиск на d4.","Розвиваємо коня, захищаючи d4 ще раз.","Чорні тиснуть на d4 і b2, використовуючи незручне розташування фігур білих.","Обережний хід: саме тут природне Bd3 програє фігуру (див. пастку), а Be2 надійно захищає позицію.","Чорні готують Nf5, тиснучи на пункт d4 ще одною фігурою."],
   description:"Чорні одразу б'ють по центру ходом d5, будуючи міцну, хоч і дещо затиснуту структуру.",
   theory:{

     plansWhite:["Захопити простір ходом e5 (варіант Advance) і грати проти слона c8","Розвинути фігури (Nd2 або Nc3) і рокіруватися на королівський фланг","Використати просторову перевагу для атаки на короля","У варіанті обміну (3.exd5 exd5) шукати мінімальний плюс у симетричній структурі"],
     plansBlack:["Зіграти c5, атакуючи основу пішакового ланцюга d4-e5","Розв'язати проблему білопільного слона c8 — вивести його до ходу e6 або розміняти через Fort Knox (Bd7-c6)","Підготувати f6, підриваючи центр білих","У Вінавері (3.Nc3 Bb4) зв'язати коня c3 і забрати слона на c3, псуючи пішакову структуру білих"],
     trap:{name:"Пастка у варіанті Просування (Bd3??)",
       moves:["e4","e6","d4","d5","e5","c5","c3","Nc6","Nf3","Qb6","Bd3","cxd4","cxd4","Nxd4","Nxd4","Qxd4"],
       note:"Після 5...Qb6 пішак d4 захищають лише пішак c3 і кінь f3. Природний з вигляду хід 6.Bd3?? залишає d4 недостатньо захищеним: 6...cxd4 7.cxd4 Nxd4! 8.Nxd4 Qxd4, і чорний ферзь одночасно нападає на слона d3 і пішака b2 — чорні виграють щонайменше фігуру. Правильно тут 6.Be2 або 6.a3, зберігаючи пункт d4."},
     variations:[
       {name:"Розмінний варіант",moves:["e4","e6","d4","d5","exd5","exd5","Nf3","Nf6","Bd3","Bd6","O-O","O-O","Re1","Re8","h3","h6"],note:"Білі спрощують структуру, прагнучи мінімальної, але стабільної переваги в симетричній позиції."},
       {name:"Варіант просування",moves:["e4","e6","d4","d5","e5","c5","c3","Nc6","Nf3","Qb6","Be2","Be7","O-O","Nh6","a3","Bd7"],note:"Білі захоплюють простір і одразу дають чорним мішень для гри проти слона c8."},
       {name:"Варіант Тарраша (3.Nd2)",moves:["e4","e6","d4","d5","Nd2","Nf6","e5","Nfd7","Bd3","c5","c3","Nc6","Ngf3","Be7","O-O","O-O"],note:"Білі розвивають коня на d2, уникаючи зв'язки Bb4 після Nc3 і зберігаючи гнучку структуру — головна зброя проти французького захисту з 1970-х."},
       {name:"Класична система (3.Nc3 Nf6)",moves:["e4","e6","d4","d5","Nc3","Nf6","Bg5","Be7","e5","Nfd7","Bxe7","Qxe7","f4","a6","Nf3","Nc6"],note:"Білі розвивають коня на c3, дозволяючи чорним зв'язати його ходом Bb4 (Вінавер) або продовжити класично через Nf6."}

  {id:"carokann", name:"Захист Каро-Канн", eco:"B10", side:"black", coreMoves:6,

   description:"Надійний захист: чорні готують d5, не замикаючи власного чорнопольного слона.",
   theory:{
     idea:"Як і у французькому, чорні б'ють по центру ходом d5, але заздалегідь звільняють шлях слону c8 на f5 чи g4, уникаючи головної проблеми французького захисту. Класичний варіант (3...dxe4 4.Nxe4 Bf5) — вибір Капабланки й Карпова, варіант просування (3.e5) веде до закритих, маневрених позицій.",
     plansWhite:["Захопити простір ходом e5 або спростити гру розміном exd5","Розвинути фігури і шукати шанси на королівському фланзі","У розмінному варіанті грати на невеликий, але стійкий позиційний плюс","У варіанті просування атакувати слона на f5 ходом Nf3-h4 чи g4"],
     plansBlack:["Вивести слона на f5 чи g4 до ходу e6","Зіграти c5, борючись за центр","Розвинути коней на d7 і f6, готуючи рокіровку","У варіанті просування тиснути на пункт d4 фігурами і не поспішати з f6"],
     trap:{name:"Задушений мат (варіант Карпова)",
       moves:["e4","c6","d4","d5","Nc3","dxe4","Nxe4","Nd7","Qe2","Ngf6","Nd6#"],
       note:"Після 4...Nd7 (варіант Карпова) хід 5.Qe2! приховує загрозу Nd6# — задушеного мата: король застряг у кутку між власними фігурами, і конем нема куди тікати. Якщо чорні автоматично розвивають другого коня ходом 5...Ngf6??, мат неминучий. Правильно тут зіграти щось інше, наприклад 5...e6 чи 5...Qc7, прибираючи поле d6 з-під удару, перш ніж виводити коня на f6."},
     variations:[
       {name:"Варіант просування",moves:["e4","c6","d4","d5","e5","Bf5","Nc3","e6","g4","Bg6","Nge2","c5","Be3","Nc6","Qd2","Qb6"],note:"Веде до закритої, маневреної гри, де білі грають на просторову перевагу на королівському фланзі."},
       {name:"Розмінний варіант",moves:["e4","c6","d4","d5","exd5","cxd5","Bd3","Nc6","c3","Nf6","Nf3","Bg4","O-O","e6","Re1","Bd6"],note:"Спрощує позицію: обидві сторони розвиваються симетрично, і партія часто зводиться до тонкої боротьби за невеликий плюс."},
       {name:"Атака Панова-Ботвинника (4.c4)",moves:["e4","c6","d4","d5","exd5","cxd5","c4","Nf6","Nc3","e6","Nf3","Be7","Be2","O-O","O-O","Nc6"],note:"Після розміну білі одразу б'ють пішаком c4, прагнучи ізольованого пішака і активної фігурної гри — найгостріша спроба проти Каро-Канна."},
       {name:"Варіант Карпова (4...Nd7)",moves:["e4","c6","d4","d5","Nc3","dxe4","Nxe4","Nd7","Nf3","Ngf6","Nxf6+","Nxf6","Bc4","Bg4","h3","Bh5"],note:"Чорні спершу розвивають коня на d7, готуючи Ngf6 без розміну коней і зберігаючи гнучкість — тонкий позиційний вибір, який прославив Анатолія Карпова."}
     ]

  {id:"qgd", name:"Ферзевий гамбіт", eco:"D06", side:"white", coreMoves:9,
   moves:["d4","d5","c4","e6","Nc3","Nf6","Bg5","Be7","e3","O-O","Nf3","Nbd7","Rc1","c6","Bd3","dxc4","Bxc4","Nd5"], moveComments:["Захоплюємо центр ферзевим пішаком.","Чорні відповідають симетрично.","Пропонуємо пішак, щоб відволікти d5 і отримати широкий центр.","Відхилений ферзевий гамбіт: чорні зміцнюють центр, тимчасово замикаючи слона c8.","Розвиваємо коня, посилюючи тиск на d5.","Чорні розвивають коня, готуючись до рокіровки.","Класичний хід: зв'язуємо коня f6, тиснучи на центр.","Чорні розвивають слона, готуючись розв'язати коня.","Готуємо розвиток слона f1, зберігаючи міцну структуру в центрі.","Чорні ховають короля, завершуючи підготовку до боротьби за центр.","Завершуємо розвиток легких фігур перед боротьбою за центр.","Чорні готують c5 або e5, борючись за центр після завершення розвитку.","Тура стає на напіввідкриту лінію «c», готуючись до типової атаки меншості b4-b5 на ферзевому фланзі.","Чорні зміцнюють центр і готують dxc4 із темпом на слона, щойно він вийде на d3.","Слон розвивається на активну діагональ, готуючись до тиску в центрі.","Чорні розкривають центр саме зараз, виграючи темп нападом на слона d3.","Білі відновлюють матеріальну рівність, зберігаючи активного слона на найкращій діагоналі.","Класичний визволяючий маневр Капабланки: кінь напряму атакує слона g5, змушуючи білих визначитися й послаблюючи тиск по діагоналі h4-d8."],
   description:"Білі жертвують пішака c4, щоб отримати міцний контроль над центром.",

  {id:"london", name:"Лондонська система", eco:"D02", side:"white", coreMoves:9,
   moves:["d4","d5","Bf4","Nf6","Nf3","c5","e3","Nc6","Nbd2","e6","c3","Bd6","Bg3","O-O","Bd3","Qc7","Ne5","Bxe5"], moveComments:["Захоплюємо центр.","Чорні відповідають симетрично.","Виводимо слона до ходу e3, щоб не замкнути його.","Чорні розвивають коня класично.","Розвиваємо другого коня, готуючи рокіровку.","Чорні борються за центр із флангу.","Завершуємо пішакову структуру, відкриваючи слона f1.","Чорні розвивають коня, продовжуючи класичний розвиток.","Розвиваємо другого коня, готуючи можливий прорив e4.","Чорні відкривають слона f8, готуючись розвинути його.","Зміцнюємо центр, підтримуючи пішака d4 ще одним разом.","Чорні пропонують розмін слонів, оскаржуючи важливу діагональ.","Слон відступає, уникаючи розміну і зберігаючи контроль над діагоналлю b8-h2, що часто веде до тактичних шансів пізніше.","Чорні ховають короля, завершуючи мінімальний розвиток.","Білі перекладають слона на іншу діагональ, готуючи Ne5 і посилюючи тиск на королівському фланзі.","Чорні тиснуть на слона g3 і готують подвоєння тур чи взяття на d4.","Кінь централізується, підтримуючи слона і створюючи передумови для атаки на короля — типовий план \"Лондонської системи\" проти рокіровки в коротку сторону.","Чорні розмінюють небезпечного централізованого коня, знімаючи основну загрозу."],

  {id:"kingsgambit", name:"Гамбіт короля", eco:"C30", side:"white", coreMoves:9,

  {id:"italian", name:"Італійська партія", eco:"C50", article:`
    <p class="ref-tagline">Один із найстаріших дебютів у шаховій історії — прямий, логічний розвиток фігур із негайним прицілом на найслабший пункт чорних, f7.</p>
    <h3>Ідея та стиль</h3>
    <p>Італійська партія відома ще з XVI століття (її аналізували Полеріо й Греко) і була головною зброєю епохи романтичних шахів — Андерсена, Морфі, молодого Стейніца. Пізніше, коли теорія Іспанської партії пішла далеко вперед, Італійська на кілька десятиліть вважалася на елітному рівні дещо «безпечною» — чорні легко зрівнювали шанси. Усе змінилося у 2010-х: Каспаров, а особливо Магнус Карлсен, показали, що «тиха» система з c3 і d3 (Джуоко Піанісимо) дає білим довгу, безпечну гру без ризику наштовхнутися на глибоку домашню підготовку суперника — і дебют пережив потужне відродження на найвищому рівні.</p>
    <p>Підходить і тактикам, і позиційним гравцям. Гострі лінії (Гамбіт Еванса, Захист двох коней) винагороджують точний розрахунок і знання пасток; тиха система винагороджує терпіння, розуміння малих переваг і вміння грати довгі партії без прямого ризику.</p>
    <h3>Кому підходить і як вивчати</h3>
    <ul>
      <li>Почни з тихої системи (c3 + d3): зрозумій, чому білі не поспішають з d4, а спершу завершують розвиток і рокіровку.</li>
      <li>Розбери пастку Легаля — вона вчить базовому принципу: не тримати фігуру зв'язаною, якщо після розміну ферзів матеріальні втрати неминучі.</li>
      <li>Окремо вивчи Захист двох коней (3...Nf6) — це фактично інший, набагато гостріший дебют зі своєю глибокою теорією.</li>
      <li>Зіграй кілька тренувальних партій Гамбітом Еванса, щоб відчути, як тимчасова жертва пішака перетворюється на довгостроковий тиск і перевагу в розвитку.</li>

/* ===================== ІНТЕРВАЛЬНЕ ПОВТОРЕННЯ (SRS) ===================== */
// Записи прогресу зберігаються як {done, reps, lastAt, dueAt}. Стара версія
// зберігала просто true/false — така позначка трактується як «час повторити».
const DAY_MS = 24 * 60 * 60 * 1000;
const SRS_MAX_INTERVAL_DAYS = 30;

function isDone(entry){
  return !!entry;
}
function isDue(entry){
  if(!entry) return false;
  if(entry === true) return true; // старий формат — одразу пропонуємо повторити
  return !!(entry.dueAt && entry.dueAt <= Date.now());
}
// Людський формат дати наступного повторення — щоб SRS було видно в
// інтерфейсі, а не лише "прошито" в localStorage.
function formatDueIn(dueAt){
  const days = Math.round((dueAt - Date.now()) / DAY_MS);
  if(days <= 0) return 'сьогодні';
  if(days === 1) return 'завтра';
  if(days < 7) return `за ${days} дн.`;
  try{
    return new Date(dueAt).toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit'});
  }catch(e){
    return `за ${days} дн.`;
  }
}
function markCompleted(key, id){
  const prog = loadProgress(key);
  const prev = prog[id];
  // Тренування ДО настання строку повторення не подовжує інтервал: інакше 5 проходжень
  // поспіль за один вечір «вчать» пункт одразу на 16 днів уперед і SRS втрачає сенс.
  if(prev && typeof prev === 'object' && prev.dueAt && prev.dueAt > Date.now()){
    prog[id] = Object.assign({}, prev, {done:true, lastAt: Date.now()});
    saveProgress(key, prog);
    return;
  }
  const prevReps = (prev && typeof prev === 'object' && prev.reps) ? prev.reps : 0;
  const reps = prevReps + 1;
  const intervalDays = Math.min(SRS_MAX_INTERVAL_DAYS, Math.pow(2, reps - 1));
  prog[id] = { done:true, reps, lastAt: Date.now(), dueAt: Date.now() + intervalDays * DAY_MS };
  saveProgress(key, prog);
}
function countDue(key, items){
  const prog = loadProgress(key);
  return items.filter(it => isDue(prog[it.id])).length;
}

    document.querySelectorAll('.tab-btn').forEach(b=>{ b.classList.remove('active'); b.removeAttribute('aria-current'); });
    btn.classList.add('active');
    btn.setAttribute('aria-current', 'page');
    btn.scrollIntoView({block:'nearest', inline:'nearest'}); // на вузьких екранах вкладки прокручуються
    currentTab = btn.dataset.tab;
    // У «Проти бота» є власний перемикач підказок рушія — загальна кнопка там зайва
    document.getElementById('hintBtn').style.display = currentTab === 'bot' ? 'none' : '';
    if(currentTab !== 'bot'){
      evalColEl.style.display = 'none';
      botBoxEl.style.display = 'none';
      hintArrow1El.style.display = 'none';
      hintArrow2El.style.display = 'none';
      if(botEngine && botEngine.worker) botEngine.worker.postMessage('stop');
      if(helperEngine && helperEngine.worker) helperEngine.worker.postMessage('stop');
    }
    if(currentTab !== 'analyzer'){
      analyzerGen++; // зупиняє будь-який фоновий пакетний аналіз, якщо гравець пішов із вкладки
      analyzerBoxEl.style.display = 'none';
      mainBtnRowEl.style.display = 'flex';
      boardBadgeEl.style.display = 'none';
    }
    // Довідник — суто текстова вкладка без дошки: ховаємо ігрову область і
    // заголовок пункту (там раніше могла лишитись розмітка іншого дебюту),
    // показуючи натомість статтю; для решти вкладок повертаємо як було.
    if(currentTab === 'reference'){
      boardAreaEl.style.display = 'none';
      itemHeaderEl.style.display = 'none';
      mainBtnRowEl.style.display = 'none';
      referenceArticleEl.style.display = 'block';
    } else {
      boardAreaEl.style.display = 'flex';
      itemHeaderEl.style.display = '';
      referenceArticleEl.style.display = 'none';
    }
    renderItemList();
    if(currentTab === 'openings'){ selectOpening(OPENINGS[0].id); }
    else if(currentTab === 'endgames'){ selectEndgame(ENDGAMES[0].id); }
    else if(currentTab === 'cct'){ selectCCT(CCT_PUZZLES[0].id); }
    else if(currentTab === 'bot'){ selectBot(botColor); }
    else if(currentTab === 'analyzer'){ selectAnalyzer(); }
    else if(currentTab === 'reference'){ selectReference(REFERENCE[0].id); }
    else { selectPuzzle(PUZZLES[0].id); }
  });
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(currentTab === 'openings'){
    if(activeVariation) trainVariation(activeVariationParent, activeVariation);
    else selectOpening(currentOpening.id);
  }
  else if(currentTab === 'endgames') selectEndgame(currentEndgameItem.id);
  else if(currentTab === 'cct') selectCCT(currentCCT.id);
  else if(currentTab === 'bot') selectBot(botColor);
  else selectPuzzle(currentPuzzle.id);
});
document.getElementById('undoBtn').addEventListener('click', ()=>{
  if(isReplaying) return;
  if(dragActive){ cleanupDrag(); }
  const undone = chess.undo();
  if(!undone) return;
  if(currentTab === 'openings'){
    if(!principleMode && !freePlay){
      moveIndex = Math.max(0, moveIndex - 1);
      if(chess.turn() !== userColor){
        const undone2 = chess.undo();
        if(undone2){ moveIndex = Math.max(0, moveIndex - 1); }
      }
    } else if(chess.turn() !== userColor){
      chess.undo();
      if(principleMode){
        principleGen++; // будь-яка ще не завершена async-оцінка скасованого ходу відкидається
        if(principleMoveLog.length){
          // Інакше скасований хід лишився б у логу й спотворював підсумковий аналіз.
          principleMoveLog.pop();
          analysisBtnBox.style.display = principleMoveLog.length ? 'block' : 'none';
          renderPrincipleMoveStrip();
        }
      }
    }
    setStatus('Хід скасовано. Твій хід.', '');
    moveCommentBox.style.display = 'none';
  } else if(currentTab === 'endgames' && currentEndgameItem.kind === 'technique'){
    if(chess.turn() !== userColor){
      const undone2 = chess.undo();
    }
    setStatus('Хід скасовано. Твій хід.', '');
  } else if(currentTab === 'endgames'){
    endgamePuzzleSolved = false;
    explainBox.style.display = 'none';
    setStatus('Хід скасовано. Спробуй ще раз.', '');
  } else if(currentTab === 'cct'){
    cctSolved = false;
    explainBox.style.display = 'none';
    setStatus('Хід скасовано. Спробуй ще раз.', '');
  } else if(currentTab === 'bot'){
    engineThinking = false;
    botPositionToken++; // застаріла відповідь рушія, що йшла в дорозі, більше не застосовується
    if(chess.turn() !== userColor){
      chess.undo();
    }
    setStatus('Хід скасовано. Твій хід.', '');
  } else {
    puzzleSolved = false;
    explainBox.style.display = 'none';
    setStatus('Хід скасовано. Спробуй ще раз.', '');
  }
  selected = null; legalTargets = []; lastMove = null;
  renderBoard();
  renderMoveList();
  if(currentTab === 'bot') syncBotPosition();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentTab === 'openings'){
    const rep = loadRepertoire();
    let pool = OPENINGS;
    if(openingsFilter === 'white') pool = OPENINGS.filter(o=>o.side==='white');
    else if(openingsFilter === 'black') pool = OPENINGS.filter(o=>o.side==='black');
    else if(openingsFilter === 'mine') pool = OPENINGS.filter(o=>rep[o.id]);
    const list = pool.length ? pool : OPENINGS;
    const idx = list.findIndex(o=>o.id===currentOpening.id);
    const next = list[(idx+1) % list.length] || list[0];
    selectOpening(next.id);
  } else if(currentTab === 'endgames'){
    const idx = ENDGAMES.findIndex(e=>e.id===currentEndgameItem.id);
    const next = ENDGAMES[(idx+1) % ENDGAMES.length];
    selectEndgame(next.id);
  } else if(currentTab === 'cct'){
    const idx = CCT_PUZZLES.findIndex(c=>c.id===currentCCT.id);
    const next = CCT_PUZZLES[(idx+1) % CCT_PUZZLES.length];
    selectCCT(next.id);
  } else if(currentTab === 'bot'){
    selectBot(botColor);
  } else {
    const pool = tacticsFilter === 'all' ? PUZZLES : PUZZLES.filter(p=>p.difficulty===tacticsFilter);
    const list = pool.length ? pool : PUZZLES;
    const idx = list.findIndex(p=>p.id===currentPuzzle.id);
    const next = list[(idx+1) % list.length] || list[0];
    selectPuzzle(next.id);
  }
});
document.getElementById('hintBtn').addEventListener('click', ()=>{
  // Дебюти: підказка стосується САМЕ наступного ходу лінії (раніше тут показувався
  // порожній блок або текст останньої розв'язаної задачі). Спершу — лише поле, з якого
  // ходити; другим натисканням — сам хід зі стрілкою.
  if(currentTab === 'openings'){
    const expected = (currentOpening && !freePlay && !principleMode && !isReplaying && chess.turn() === userColor)
      ? currentOpening.moves[moveIndex] : null;
    const probe = expected ? new Chess(chess.fen()) : null;
    const mv = probe ? probe.move(expected) : null;
    if(!mv){
      hintBox.textContent = 'Підказки працюють в обов\'язковій частині лінії, коли твоя черга ходити.';
      hintBox.style.display = 'block';
      return;
    }
    hintStep = Math.min(2, hintStep + 1);
    if(hintStep === 1){
      hintBox.textContent = 'Підказка: ходи фігурою з поля ' + mv.from + '. Натисни «Підказка» ще раз, щоб побачити сам хід.';
    } else {
      hintBox.textContent = 'Правильний хід: ' + expected + '.';
      setArrow(hintArrow1El, mv.from + mv.to + (mv.promotion || ''), HINT_ARROW_HEAD_LEN.primary);
      hintArrow2El.style.display = 'none';
    }
    hintBox.style.display = 'block';
    return;
  }
  hintBox.style.display = hintBox.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('flipBtn').addEventListener('click', ()=>{
  // Суто візуальне перемикання — не чіпає стан гри, тож працює будь-де: у
  // теорії, під час перегляду пасток/варіантів чи в будь-якій вкладці.

  renderHintArrows();
});

/* ===================== СПИСОК ПУНКТІВ ===================== */

function renderItemList(){
  itemListEl.innerHTML = '';
  const progKey = currentTab === 'openings' ? PROG_KEY_OPENINGS : currentTab === 'endgames' ? PROG_KEY_ENDGAMES : currentTab === 'cct' ? PROG_KEY_CCT : PROG_KEY_TACTICS;
  const progress = currentTab === 'reference' ? {} : loadProgress(progKey);
  const items = currentTab === 'openings' ? OPENINGS : currentTab === 'endgames' ? ENDGAMES : currentTab === 'cct' ? CCT_PUZZLES : currentTab === 'reference' ? REFERENCE : PUZZLES;

  const addItemBtn = (it)=>{
    const entry = progress[it.id];
    const due = isDue(entry);
    const done = isDone(entry);
    const b = document.createElement('button');
    b.className = 'item-btn' + (done ? ' done' : '') + (due ? ' due' : '');
    const dueNoteText = (entry && typeof entry === 'object' && entry.dueAt && !due) ? `Повторення: ${formatDueIn(entry.dueAt)}` : '';
    const fullName = it.name || it.theme;
    b.title = fullName + (due ? ' — час повторити ще раз' : dueNoteText ? ' — ' + dueNoteText : (done ? ' — вже пройдено' : ''));
    const dot = it.difficulty ? `<span class="diff-dot ${it.difficulty}" title="${DIFFICULTY_LABELS[it.difficulty]}"></span>` : '';
    const dueNoteHtml = dueNoteText ? `<span class="item-due-note">${dueNoteText}</span>` : '';
    b.innerHTML = `<span class="item-label">${dot}<span class="item-label-text"><span class="txt">${it.name || it.theme}</span>${dueNoteHtml}</span></span><span class="badge">${due ? '↻' : ''}</span>`;
    b.addEventListener('click', ()=>{
      if(currentTab === 'openings') selectOpening(it.id);
      else if(currentTab === 'endgames') selectEndgame(it.id);
      else if(currentTab === 'cct') selectCCT(it.id);
      else if(currentTab === 'reference') selectReference(it.id);
      else selectPuzzle(it.id);
    });
    b.dataset.id = it.id;
    if(currentTab === 'openings'){
      // Зірочка — окрема кнопка поряд, а не всередині item-btn (вкладати
      // <button> в <button> не можна — браузер поламає розмітку).
      const row = document.createElement('div');
      row.className = 'item-row';
      const star = document.createElement('button');
      star.type = 'button';
      const mine = isInRepertoire(it.id);
      star.className = 'rep-star' + (mine ? ' active' : '');
      star.title = mine ? 'Прибрати з мого репертуару' : 'Додати до мого репертуару';
      star.textContent = mine ? '★' : '☆';
      star.addEventListener('click', (e)=>{
        e.stopPropagation();
        toggleRepertoire(it.id);
        renderItemList();
      });
      row.appendChild(b);
      row.appendChild(star);
      itemListEl.appendChild(row);
    } else {
      itemListEl.appendChild(b);
    }
  };

  if(currentTab === 'endgames'){
    const label1 = document.createElement('div');
    label1.className = 'item-list-label';
    label1.textContent = 'Техніка мату';
    itemListEl.appendChild(label1);
    ENDGAME_TECHNIQUES.forEach(addItemBtn);
    const label2 = document.createElement('div');
    label2.className = 'item-list-label';
    label2.textContent = 'Пішакові ендшпілі й опозиція';
    itemListEl.appendChild(label2);
    ENDGAME_PUZZLES.forEach(addItemBtn);
  } else if(currentTab === 'tactics'){
    renderDifficultyFilter();
    const filtered = tacticsFilter === 'all' ? PUZZLES : PUZZLES.filter(p=>p.difficulty===tacticsFilter);
    if(filtered.length){
      filtered.forEach(addItemBtn);
    } else {
      const empty = document.createElement('div');
      empty.className = 'item-list-label';
      empty.textContent = 'Немає задач цього рівня.';
      itemListEl.appendChild(empty);
    }
  } else if(currentTab === 'openings'){
    renderStrictnessToggle();
    renderOpeningsFilter();
    const rep = loadRepertoire();
    let filtered = OPENINGS;
    if(openingsFilter === 'white') filtered = OPENINGS.filter(o=>o.side==='white');
    else if(openingsFilter === 'black') filtered = OPENINGS.filter(o=>o.side==='black');
    else if(openingsFilter === 'mine') filtered = OPENINGS.filter(o=>rep[o.id]);
    if(filtered.length){
      filtered.forEach(addItemBtn);
    } else {
      const empty = document.createElement('div');
      empty.className = 'item-list-label';
      empty.textContent = 'У репертуарі поки порожньо — познач ★ біля потрібних дебютів.';
      itemListEl.appendChild(empty);
    }
  } else if(currentTab === 'bot'){
    renderBotColorPicker();
    renderBotLevelPicker();
  } else {
    items.forEach(addItemBtn);
  }
  updateActiveItem();
  updateStatsLine();
}

function renderDifficultyFilter(){
  const filterEl = document.createElement('div');
  filterEl.className = 'diff-filter';
  const options = [
    {key:'all', label:'Всі'},
    {key:'easy', label:'Легкі'},
    {key:'medium', label:'Середні'},
    {key:'hard', label:'Складні'}
  ];
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'diff-btn' + (tacticsFilter === opt.key ? ' active' : '');
    const count = opt.key === 'all' ? PUZZLES.length : PUZZLES.filter(p=>p.difficulty===opt.key).length;
    btn.textContent = `${opt.label} (${count})`;
    btn.addEventListener('click', ()=>{
      tacticsFilter = opt.key;
      renderItemList();
      const filtered = tacticsFilter === 'all' ? PUZZLES : PUZZLES.filter(p=>p.difficulty===tacticsFilter);
      if(filtered.length && (!currentPuzzle || !filtered.some(p=>p.id===currentPuzzle.id))){
        selectPuzzle(filtered[0].id);
      }
    });
    filterEl.appendChild(btn);
  });
  itemListEl.appendChild(filterEl);
}

function renderOpeningsFilter(){

function updateActiveItem(){
  const activeId = currentTab === 'openings' ? (currentOpening && currentOpening.id) : currentTab === 'endgames' ? (currentEndgameItem && currentEndgameItem.id) : currentTab === 'cct' ? (currentCCT && currentCCT.id) : currentTab === 'reference' ? (currentReference && currentReference.id) : (currentPuzzle && currentPuzzle.id);

    b.classList.toggle('active', b.dataset.id === activeId);

function updateStatsLine(){
  const opProg = loadProgress(PROG_KEY_OPENINGS);
  const tacProg = loadProgress(PROG_KEY_TACTICS);
  const egProg = loadProgress(PROG_KEY_ENDGAMES);
  const cctProg = loadProgress(PROG_KEY_CCT);
  const opDone = Object.values(opProg).filter(isDone).length;
  const tacDone = Object.values(tacProg).filter(isDone).length;
  const egDone = Object.values(egProg).filter(isDone).length;
  const cctDone = Object.values(cctProg).filter(isDone).length;
  const dueTotal = countDue(PROG_KEY_OPENINGS, OPENINGS) + countDue(PROG_KEY_TACTICS, PUZZLES) + countDue(PROG_KEY_ENDGAMES, ENDGAMES) + countDue(PROG_KEY_CCT, CCT_PUZZLES);
  const streakHtml = streak > 0 ? ` · Серія: <strong class="streak">${streak} 🔥</strong>` : '';
  const dueHtml = dueTotal > 0 ? ` · На повторення: <strong class="streak">${dueTotal} ↻</strong>` : '';
  statsLine.innerHTML = `Дебюти вивчено: <strong>${opDone}/${OPENINGS.length}</strong> · Задачі розв'язано: <strong>${tacDone}/${PUZZLES.length}</strong> · CCT: <strong>${cctDone}/${CCT_PUZZLES.length}</strong> · Ендшпілі: <strong>${egDone}/${ENDGAMES.length}</strong>${dueHtml}${streakHtml}`;
}

// Перехресні посилання між статтями Довідника: перша згадка назви ІНШОГО
// дебюту в тексті стає клікабельним посиланням на його власну статтю.
// currentId одразу потрапляє в used, щоб стаття ніколи не посилалася сама на
// себе. Той самий трюк з (?<![\p{L}]), що й у GLOSSARY, — заміна \b для
// кирилиці. Деякі патерни навмисно двослівні (напр. "ферзевий гамбіт",
// "англійський дебют"), щоб не плутати з іншими іменними гамбітами чи
// "Англійською атакою" — планом усередині сицилійських статей.
const CROSS_LINKS = [
  {id:'italian', re:/(?<![\p{L}])італійськ\p{L}*/iu},
  {id:'ruylopez', re:/(?<![\p{L}])іспанськ\p{L}*/iu},
  {id:'opensicilian', re:/(?<![\p{L}])найдорф\p{L}*/iu},
  {id:'sicilianDragon', re:/(?<![\p{L}])дракон\p{L}*/iu},
  {id:'sicilianScheveningen', re:/(?<![\p{L}])шевенінген\p{L}*/iu},
  {id:'french', re:/(?<![\p{L}])французьк\p{L}*/iu},
  {id:'carokann', re:/(?<![\p{L}])каро-канн\p{L}*/iu},
  {id:'qgd', re:/(?<![\p{L}])ферзев\p{L}*\s+гамбіт\p{L}*/iu},
  {id:'slav', re:/(?<![\p{L}])слов'янськ\p{L}*/iu},
  {id:'english', re:/(?<![\p{L}])англійськ\p{L}*\s+дебют\p{L}*/iu},
  {id:'kid', re:/(?<![\p{L}])староіндійськ\p{L}*/iu},
  {id:'nimzo', re:/(?<![\p{L}])німцович\p{L}*/iu},
  {id:'scandinavian', re:/(?<![\p{L}])скандинавськ\p{L}*/iu},
  {id:'budapest', re:/(?<![\p{L}])будапештськ\p{L}*/iu},
  {id:'pirc', re:/(?<![\p{L}])пірц\p{L}*/iu},
  {id:'alekhine', re:/(?<![\p{L}])(?:алехін|альохін)\p{L}*/iu},
  {id:'london', re:/(?<![\p{L}])лондонськ\p{L}*\s+систем\p{L}*/iu},
  {id:'scotch', re:/(?<![\p{L}])шотландськ\p{L}*/iu},
  {id:'kingsgambit', re:/(?<![\p{L}])гамбіт\p{L}*\s+корол\p{L}*/iu},
  {id:'grunfeld', re:/(?<![\p{L}])грюнфельд\p{L}*/iu},
  {id:'petrov', re:/(?<![\p{L}])петров\p{L}*/iu},
  {id:'dutch', re:/(?<![\p{L}])голландськ\p{L}*/iu},
  {id:'benoni', re:/(?<![\p{L}])беноні\p{L}*/iu},
];

// Обгортає перше входження кожного ЧУЖОГО дебюту в клікабельне <a>, що
// перемикає статтю. Пропускає h2/h3/nav/button і вже оброблені вузли — той
// самий TreeWalker-патерн, що й applyGlossaryTooltips.
function applyCrossLinks(container, currentId){
  const used = new Set([currentId]);
  const skipTags = new Set(['H2','H3','A','NAV','BUTTON']);
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      let el = node.parentElement;
      while(el && el !== container){
        if(skipTags.has(el.tagName) || el.classList.contains('gterm') || el.classList.contains('ref-crosslink')) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const textNodes = [];
  let n;
  while((n = walker.nextNode())) textNodes.push(n);

  for(const node of textNodes){
    if(used.size === CROSS_LINKS.length + 1) break;
    const text = node.nodeValue;
    let earliest = null;
    for(const link of CROSS_LINKS){
      if(used.has(link.id)) continue;
      const m = link.re.exec(text);
      if(m && (!earliest || m.index < earliest.index)) earliest = {index:m.index, length:m[0].length, id:link.id};
    }
    if(!earliest) continue;
    used.add(earliest.id);
    const before = text.slice(0, earliest.index);
    const matched = text.slice(earliest.index, earliest.index + earliest.length);
    const after = text.slice(earliest.index + earliest.length);
    const a = document.createElement('a');
    a.className = 'ref-crosslink';
    a.href = '#';
    a.textContent = matched;
    const targetId = earliest.id;
    a.addEventListener('click', (e)=>{
      e.preventDefault();
      selectReference(targetId);
      referenceArticleEl.scrollIntoView({behavior:'smooth', block:'start'});
    });
    const parent = node.parentNode;
    parent.insertBefore(document.createTextNode(before), node);
    parent.insertBefore(a, node);
    parent.insertBefore(document.createTextNode(after), node);
    parent.removeChild(node);
  }
}

// Короткий словник дебютного жаргону для підказок у "Довіднику" — кожен термін
// підсвічується лише при першому вживанні в статті (regex ловить типові
// українські закінчення через \p{L}*, щоб не плодити список форм вручну).
// (?<![\p{L}]) на початку кожного патерну — це заміна \b для кирилиці (яку
// JS-двигун regex у \b не розпізнає як "словесні" символи): без неї "табі",
// наприклад, підхоплював би середину слова "стабільний".
const GLOSSARY = [
  {id:'gambit', re:/(?<![\p{L}])гамбіт\p{L}*/iu, def:"Дебют чи хід, у якому свідомо віддають пішака (рідше фігуру) заради темпу, розвитку чи атаки."},
  {id:'fianchetto', re:/(?<![\p{L}])фланкет\p{L}*/iu, def:"Розвиток слона на довгу діагональ ходом пішака на b3/g3 (у білих) чи b6/g6 (у чорних), а не на класичне поле."},
  {id:'iqp', re:/(?<![\p{L}])ізольован\p{L}*/iu, def:"Пішак без сусідів на суміжних вертикалях — його неможливо захистити іншим пішаком; слабкість в ендшпілі, часто джерело фігурної активності в мідлгеймі."},
  {id:'doubled', re:/(?<![\p{L}])здвоєн\p{L}*/iu, def:"Два пішаки однієї сторони на одній вертикалі, що виникають після взяття фігурою, — зазвичай структурна слабкість."},
  {id:'minority', re:/(?<![\p{L}])атак\p{L}*\s+меншост\p{L}*/iu, def:"План просунути меншу пішакову масу на фланзі (напр. a+b проти a+b+c), щоб створити слабкість у суперника, а не здобути матеріал."},
  {id:'zwischenzug', re:/(?<![\p{L}])цвішенцуг\p{L}*/iu, def:"Несподіваний «проміжний» хід замість очікуваного продовження (напр. розміну), що виграє темп чи матеріал."},
  {id:'prophylaxis', re:/(?<![\p{L}])профілактич\p{L}*|(?<![\p{L}])профілактик\p{L}*/iu, def:"Хід, який не атакує напряму, а заздалегідь усуває загрозу чи план суперника."},
  {id:'pin', re:/(?<![\p{L}])зв'язк\p{L}*/iu, def:"Фігура не може (чи не хоче) відійти з лінії атаки, бо за нею стоїть цінніша фігура — часто король."},
  {id:'fork', re:/(?<![\p{L}])вилк\p{L}*/iu, def:"Один хід атакує одразу дві чи більше фігур суперника, і захистити всі неможливо."},
  {id:'tabiya', re:/(?<![\p{L}])табі\p{L}*/iu, def:"Стандартна, добре відома позиція, до якої партія доходить теоретичними ходами, перш ніж почнеться самостійна гра."},
  {id:'chain', re:/(?<![\p{L}])пішаков\p{L}*\s+ланцюг\p{L}*/iu, def:"Кілька пішаків по діагоналі, що захищають один одного, — атакувати такий ланцюг найефективніше біля його основи."},
  {id:'opposition', re:/(?<![\p{L}])опозиці\p{L}*/iu, def:"У пішакових ендшпілях — королі стоять один навпроти одного через непарну кількість полів, що змушує суперника відступити першим."},
];

// Обгортає перше входження кожного терміна зі словника в <span class="gterm">
// з підказкою в data-def; заголовки й уже оброблені вузли пропускає, щоб не
// підсвічувати те саме двічі і не чіпати h2/h3.
function applyGlossaryTooltips(container){
  const used = new Set();
  const skipTags = new Set(['H2','H3','A','NAV','BUTTON']);
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
    acceptNode(node){
      let el = node.parentElement;
      while(el && el !== container){
        if(skipTags.has(el.tagName) || el.classList.contains('gterm')) return NodeFilter.FILTER_REJECT;
        el = el.parentElement;
      }
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const textNodes = [];
  let n;
  while((n = walker.nextNode())) textNodes.push(n);

  for(const node of textNodes){
    if(used.size === GLOSSARY.length) break;
    const text = node.nodeValue;
    let earliest = null;
    for(const g of GLOSSARY){
      if(used.has(g.id)) continue;
      const m = g.re.exec(text);
      if(m && (!earliest || m.index < earliest.index)) earliest = {index:m.index, length:m[0].length, term:g};
    }
    if(!earliest) continue;
    used.add(earliest.term.id);
    const before = text.slice(0, earliest.index);
    const matched = text.slice(earliest.index, earliest.index + earliest.length);
    const after = text.slice(earliest.index + earliest.length);
    const span = document.createElement('span');
    span.className = 'gterm';
    span.tabIndex = 0;
    span.dataset.def = earliest.term.def;
    span.textContent = matched;
    const parent = node.parentNode;
    parent.insertBefore(document.createTextNode(before), node);
    parent.insertBefore(span, node);
    parent.insertBefore(document.createTextNode(after), node);
    parent.removeChild(node);
  }
}

// Будує панель швидких переходів по розділах статті (кожному <h3> — свій якір)
// і вставляє її одразу перед першим розділом, під теглайном.
function buildRefQuickNav(container){
  const heads = container.querySelectorAll('h3');
  if(!heads.length) return;
  const nav = document.createElement('nav');
  nav.className = 'ref-quicknav';
  heads.forEach((h, i)=>{
    h.id = 'refsec-' + i;
    const a = document.createElement('a');
    a.href = '#refsec-' + i;
    a.textContent = h.textContent;
    a.addEventListener('click', (e)=>{
      e.preventDefault();
      h.scrollIntoView({behavior:'smooth', block:'start'});
    });
    nav.appendChild(a);
  });
  container.insertBefore(nav, heads[0]);
}

// Малює статичний, нередагований знімок позиції (без drag&drop і кліків) —
// той самий формат board(), що й у renderBoard(), і той самий pieceGlyph(),
// але в окремому контейнері .mini-board, щоб не чіпати живу дошку.
function renderMiniBoard(fen){
  const tempChess = new Chess(fen);
  const board = tempChess.board();
  const wrap = document.createElement('div');
  wrap.className = 'mini-board';
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const sqEl = document.createElement('div');
      const isLight = (r + f) % 2 === 0;
      sqEl.className = 'sq ' + (isLight ? 'light' : 'dark');
      const piece = board[r][f];
      if(piece){
        const span = document.createElement('span');
        span.className = 'piece ' + (piece.color === 'w' ? 'piece-w' : 'piece-b');
        span.textContent = pieceGlyph(piece);
        sqEl.appendChild(span);
      }
      wrap.appendChild(sqEl);
    }
  }
  return wrap;
}

// Вставляє міні-діаграму в кінець розділу afterSection (перед наступним h3).
function insertRefDiagram(container, id){
  const spec = REF_DIAGRAMS[id];
  if(!spec) return;
  const heads = Array.from(container.querySelectorAll('h3'));
  const targetHead = heads.find(h => h.textContent.trim() === spec.afterSection);
  if(!targetHead) return;
  let insertBeforeNode = targetHead.nextElementSibling;
  while(insertBeforeNode && insertBeforeNode.tagName !== 'H3'){
    insertBeforeNode = insertBeforeNode.nextElementSibling;
  }
  let fen;
  try{
    const tempChess = new Chess();
    spec.moves.forEach(san => tempChess.move(san));
    fen = tempChess.fen();
  }catch(e){ console.error('Ref diagram move error for', id, e); return; }
  const box = document.createElement('div');
  box.className = 'ref-diagram';
  box.appendChild(renderMiniBoard(fen));
  const cap = document.createElement('p');
  cap.className = 'ref-diagram-caption';
  cap.textContent = spec.caption;
  box.appendChild(cap);
  targetHead.parentNode.insertBefore(box, insertBeforeNode);
}
