<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le mot juste — французька в контексті</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ebf8; --paper:#fbfbff; --line:#c9cff0; --fine:#e8ebfa; --margin:#f1a3ae;
  --ink:#1e2a9c; --ink-soft:#4a55b8; --text:#1c2145; --muted:#5a6086;
  --surface:#ffffff; --ok:#1b7a4b; --ok-bg:#e3f4ea; --bad:#c81f38; --bad-bg:#fde7ea;
  --ruled:72px; --m:48px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1226; --paper:#151a33; --line:#2b3367; --fine:#1e2447; --margin:#7a2f43;
    --ink:#aab4ff; --ink-soft:#8791e0; --text:#e4e7ff; --muted:#9aa1cc;
    --surface:#1b2142; --ok:#5fd09a; --ok-bg:#16332a; --bad:#ff7a8e; --bad-bg:#3a1b27;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1226; --paper:#151a33; --line:#2b3367; --fine:#1e2447; --margin:#7a2f43;
  --ink:#aab4ff; --ink-soft:#8791e0; --text:#e4e7ff; --muted:#9aa1cc;
  --surface:#1b2142; --ok:#5fd09a; --ok-bg:#16332a; --bad:#ff7a8e; --bad-bg:#3a1b27;
}
@media (max-width:560px){ :root{ --ruled:54px; --m:34px; } }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-size:17px; line-height:1.5;
  min-height:100vh;
}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin-bottom:8px}
.top .r{display:flex;gap:12px;align-items:center}
.bar{height:6px;background:var(--fine);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}

.sheet{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 0 calc(var(--m) - 2px),var(--margin) calc(var(--m) - 2px) var(--m),transparent var(--m)),
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(var(--fine) 1px,transparent 1px),
    linear-gradient(90deg,var(--fine) 1px,transparent 1px);
  background-size:100% 100%,100% var(--ruled),100% calc(var(--ruled) / 4),var(--ruled) 100%;
  border:1px solid var(--line);
  border-radius:4px;
  padding:0 20px 0 calc(var(--m) + 16px);
  box-shadow:0 1px 0 var(--line);
}
.sentence{
  margin:0;padding:calc(var(--ruled) * .35) 0 calc(var(--ruled) * .1);
  font-family:Caveat,"Segoe Script",cursive;font-weight:500;
  font-size:clamp(28px,6.2vw,40px);line-height:var(--ruled);color:var(--ink);
}
.sent-tr{margin:0;padding:0 0 calc(var(--ruled) * .35);font-style:italic;font-size:1.05rem;line-height:calc(var(--ruled) / 2);color:var(--muted)}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px dashed var(--ink-soft);height:.9em;vertical-align:baseline;margin:0 .1em}
.fill{font-weight:700;border-radius:3px;padding:0 .1em}
.fill.ok{color:var(--ok);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.fill.bad{color:var(--bad);text-decoration:line-through;text-decoration-thickness:3px}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;
  font:inherit;font-size:1.12rem;color:var(--ink);
  background:var(--surface);border:2px solid var(--ink);border-radius:5px;
  padding:13px 14px;cursor:pointer;min-height:52px;
}
.why{margin:0 0 8px;font-size:.95rem;color:var(--muted)}
.why b{color:var(--ink)}
.opt .ow{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.opt .otr{font-size:.78rem;font-style:italic;color:var(--muted);margin-top:1px}
.opts.notr:not(.done) .otr{display:none}
.opt kbd{font:inherit;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 6px;min-width:22px;text-align:center}
.opt:hover:not(:disabled){background:var(--fine)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--text)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--text)}
.opt.dim{opacity:.5}
:focus-visible{outline:3px solid var(--ink-soft);outline-offset:2px}

/* typing mode */
.typebox{margin:16px 0 0}
.typerow{display:flex;gap:10px;flex-wrap:wrap}
.typerow input{
  flex:1 1 200px;min-width:0;font:inherit;font-size:1.35rem;color:var(--ink);
  background:var(--surface);border:2px solid var(--ink);border-radius:5px;padding:10px 14px;min-height:52px;
}
.typerow input:disabled{opacity:.7}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acc{font:inherit;font-size:1.05rem;min-width:40px;min-height:40px;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px}
.acc:hover{background:var(--fine)}
.hintp{margin:10px 0 0;color:var(--muted);font-style:italic}

.fb{margin-top:16px}
.fb .card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:4px;padding:14px 16px}
.fb .card.ok{border-left-color:var(--ok)}
.fb .card.bad{border-left-color:var(--bad)}
.verdict{font-weight:600;margin:0 0 4px}
.word{margin:0 0 6px}
.word b{color:var(--ink)}
.poslab{color:var(--muted);font-size:.88rem;font-style:italic;margin-left:6px}
.btn:disabled{opacity:.5;cursor:default}
.tr{font-style:italic;color:var(--muted);margin:0 0 8px}
.ex{margin:0}

.btn{
  font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer;
  background:var(--ink);color:var(--paper);border:2px solid var(--ink);border-radius:5px;
  padding:12px 22px;min-height:48px;
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{font-size:.95rem;padding:7px 14px;min-height:38px;margin-top:10px}
.btn:hover{filter:brightness(1.12)}
.tog{font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:34px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* start screen */
.title{font-family:Caveat,cursive;font-weight:700;font-size:clamp(46px,11vw,72px);line-height:var(--ruled);margin:0;padding-top:calc(var(--ruled) * .2);color:var(--ink)}
.lead{margin:0;padding-bottom:calc(var(--ruled) * .2);line-height:calc(var(--ruled) / 2);color:var(--text);max-width:34em}
.grp{margin:18px 0 0}
.grp h2{font-size:1rem;font-weight:600;margin:0 0 8px;color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;cursor:pointer;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 16px;min-height:42px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.modehelp{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.best{color:var(--muted);font-size:.95rem;margin:14px 0 0}
.sheet .row{padding-bottom:calc(var(--ruled) * .35)}

/* results */
.score{font-family:Caveat,cursive;font-weight:700;font-size:clamp(56px,14vw,96px);line-height:var(--ruled);margin:0;padding-top:calc(var(--ruled) * .2);color:var(--ink)}
.score small{font-size:.45em;color:var(--muted);font-weight:500}
.rmsg{margin:0;padding-bottom:calc(var(--ruled) * .2);line-height:calc(var(--ruled) / 2)}
.review{margin-top:22px}
.review h2{font-size:1.1rem;margin:0 0 10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.item .s{font-family:Caveat,cursive;font-size:1.7rem;line-height:1.3;color:var(--ink);margin:0}
.item .tr{margin:2px 0 6px}
.item .ex{font-size:.97rem}
.sheet .grp:last-child{padding-bottom:calc(var(--ruled) * .35)}
.search{width:100%;font:inherit;font-size:1.05rem;padding:10px 14px;border:2px solid var(--ink);border-radius:5px;background:var(--surface);color:var(--text);min-height:48px}
.count{color:var(--muted);font-size:.95rem;margin:14px 0 10px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.rc .s{font-family:Caveat,"Segoe Script",cursive;font-weight:500;font-size:1.75rem;line-height:1.3;color:var(--ink);margin:0 0 2px}
.rc .tr{margin:0 0 6px}
.rc .ex{font-size:.97rem;margin:0 0 4px}
.rc .sb{display:none}
.rc.hid{cursor:pointer}
.rc.hid:not(.rev) .sa,.rc.hid:not(.rev) .rv{display:none}
.rc.hid:not(.rev) .sb{display:inline}
.rc.hid:not(.rev)::after{content:"Торкнись, щоб показати слово";display:block;color:var(--muted);font-size:.88rem}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .in{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.burger{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;cursor:pointer;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:6px}
.burger:hover{background:var(--fine)}
#crumb{font-family:Caveat,"Segoe Script",cursive;font-weight:700;font-size:1.8rem;line-height:1;color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:30}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(88vw,380px);z-index:40;background:var(--paper);border-right:2px solid var(--ink);overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));
  transform:translateX(-100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.dtitle{font-family:Caveat,cursive;font-size:2rem;color:var(--ink)}
.dsec{margin:18px 0 0}
.dsec h3{font-size:1rem;font-weight:600;margin:0 0 8px}
.dnav{display:flex;flex-direction:column;gap:8px}
.dnavb{font:inherit;font-weight:600;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:48px}
.dnavb[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.drawer .chip{padding:6px 14px;min-height:40px}
.sel{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:2px solid var(--ink);border-radius:5px;background:var(--surface);color:var(--text);min-height:46px}
.dnote{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.summary{color:var(--muted);margin:0 0 12px}
@media (prefers-reduced-motion:reduce){.drawer,.drawer.open{transition:none}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <button class="burger" id="burger" aria-label="Відкрити меню" aria-expanded="false" aria-controls="drawer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <span id="crumb">Тест</span>
</div></header>
<main><div id="app"></div></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Меню" aria-hidden="true">
  <div class="dhead"><strong class="dtitle">Меню</strong>
    <button class="burger" id="dclose" aria-label="Закрити меню">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button></div>
  <div id="dbody"></div>
</aside>
<script>
/* [рівень, речення, [правильне, хибні…], переклад речення, пояснення, значення слова, [інші допустимі відповіді]] */
const RAW = [
/* ---------- A1 ---------- */
['A1','Je vais ___ le boulanger pour acheter du pain.',['chez','à','dans','en'],'Я йду до пекаря купити хліба.','Перед назвою людини чи професії («до когось») вживаємо chez: chez le boulanger, chez moi, chez le médecin.','chez — у, до (когось); у когось вдома','P'],
['A1','Tu as ___ frère ou une sœur ?',['un','une','le','des'],'У тебе є брат чи сестра?','Frère — чоловічого роду, тому un frère. Une — для жіночого роду (une sœur).','un — один; невизначений артикль чоловічого роду','X'],
['A1','Elle boit ___ eau.',['de l’','du','de la','des'],'Вона п’є воду.','Частковий артикль перед голосною скорочується: de l’eau (хоча eau — жіночого роду).','de l’ — частковий артикль («трохи») перед голосною','X'],
['A1','J’___ faim.',['ai','suis','fais','veux'],'Я голодний.','Голод, спрагу, страх виражають через avoir: avoir faim, avoir soif, avoir peur.','ai — маю (avoir); j’ai faim — я голодний','V'],
['A1','Dimanche, nous ___ une promenade au parc.',['faisons','allons','prenons','jouons'],'У неділю ми гуляємо в парку.','Стале словосполучення: faire une promenade. Прогулянку «роблять», а не «беруть».','faisons — робимо (faire); faire une promenade — гуляти','V'],
['A1','Il est huit heures : je prends mon ___.',['petit-déjeuner','déjeuner','dîner','goûter'],'Восьма година: я снідаю.','Petit-déjeuner — сніданок; déjeuner — обід; dîner — вечеря; goûter — полуденок.','petit-déjeuner — сніданок','N'],
['A1','Il pleut : n’oublie pas ton ___ !',['parapluie','maillot de bain','short','ventilateur'],'Іде дощ: не забудь парасольку!','Il pleut — іде дощ, тож потрібен parapluie.','parapluie — парасолька',['imperméable'],'N'],
['A1','Mon père ___ dans une banque.',['travaille','joue','fait','regarde'],'Мій тато працює в банку.','travailler dans / à + місце роботи.','travaille — працює (travailler)','V'],
['A1','Le magasin ouvre à neuf heures et ___ à dix-neuf heures.',['ferme','ouvre','entre','passe'],'Магазин відчиняється о дев’ятій і зачиняється о дев’ятнадцятій.','Пара антонімів: ouvrir — fermer.','ferme — зачиняється (fermer)',['finit','termine'],'V'],
['A1','Excusez-moi, vous ___ l’heure ?',['avez','êtes','faites','allez'],'Вибачте, котра година? (букв. «ви маєте годину?»)','Avoir l’heure — знати, котра година.','avez — маєте (avoir); avoir l’heure — знати час','V'],
['A1','Comment tu ___ ? — Je m’appelle Marie.',['t’appelles','es','as','fais'],'Як тебе звати? — Мене звати Марі.','S’appeler — називатися: je m’appelle…, tu t’appelles… (буквально «ти називаєш себе»).','t’appelles — тебе звати (s’appeler)','V'],
['A1','J’___ le français depuis un an.',['apprends','enseigne','gagne','perds'],'Я вивчаю французьку вже рік.','apprendre — вчити(ся); enseigner — викладати.','apprends — вчу, вивчаю (apprendre)','V'],
['A1','Je range mes vêtements dans l’___.',['armoire','assiette','écran','évier'],'Я складаю одяг у шафу.','Armoire — шафа для одягу; assiette — тарілка; évier — раковина на кухні.','armoire — шафа','N'],
['A1','À midi, les enfants mangent à la ___ de l’école.',['cantine','chambre','salle de bains','gare'],'Опівдні діти обідають у шкільній їдальні.','Cantine — їдальня (шкільна чи заводська).','cantine — їдальня','N'],
['A1','Il fait froid : mets ton ___ et tes gants.',['manteau','short','maillot','éventail'],'Холодно: одягни пальто й рукавички.','Mettre un vêtement — одягати. Для холоду: manteau, écharpe, gants.','manteau — пальто',['bonnet','écharpe'],'N'],
['A1','Tu veux du lait dans ton ___ ?',['café','pain','poisson','riz'],'Хочеш молока в каву?','Du lait dans ton café — додати молоко в напій; du — частковий артикль.','café — кава; кафе',['thé','chocolat'],'N'],
['A1','Mon frère est très ___ : il mesure un mètre quatre-vingt-dix.',['grand','petit','gros','vieux'],'Мій брат дуже високий: його зріст метр дев’яносто.','grand — високий (про зріст) і великий; petit — низький, маленький.','grand — високий; великий','A'],
['A1','Le cours ___ à huit heures et finit à dix heures.',['commence','tombe','coûte','pèse'],'Заняття починається о восьмій і закінчується о десятій.','commencer — починатися; finir — закінчуватися.','commence — починається (commencer)',['débute'],'V'],
['A1','Combien ça ___ ? — Dix euros.',['coûte','pèse','dure','mesure'],'Скільки це коштує? — Десять євро.','coûter — коштувати; peser — важити; durer — тривати; mesurer — мати розмір.','coûte — коштує (coûter)',['fait'],'V'],
['A1','Où ___-vous ? — J’habite à Odessa.',['habitez','allez','mangez','jouez'],'Де ви живете? — Я живу в Одесі.','habiter — жити, мешкати (в місті, у квартирі).','habitez — (ви) живете (habiter)','V'],
/* ---------- A2 ---------- */
['A2','Je ne ___ pas ce quartier, je suis nouveau ici.',['connais','sais','peux','pense'],'Я не знаю цього району, я тут новенький.','connaître — бути знайомим із місцем чи людиною; savoir — знати факт або вміти.','connais — знаю (особу, місце)','V'],
['A2','Tu ___ nager ?',['sais','connais','as','fais'],'Ти вмієш плавати?','savoir + інфінітив = уміти: je sais nager, il sait conduire.','sais — вмію; знаю (savoir)','V'],
['A2','Hier, nous ___ au restaurant.',['sommes allés','avons allé','allons','irons'],'Вчора ми ходили в ресторан.','Aller утворює passé composé з être: nous sommes allés (з узгодженням).','sommes allés — ходили (passé composé від aller)',['sommes allées'],'V'],
['A2','Je suis ___ car j’ai mal dormi.',['fatigué','fatigant','ennuyeux','content'],'Я втомлений, бо погано спав.','fatigué — втомлений (стан людини); fatigant — виснажливий (те, що втомлює).','fatigué — втомлений',['épuisé','crevé','fatiguée'],'A'],
['A2','Cette randonnée est vraiment ___ !',['fatigante','fatiguée','fatigué','fatigant'],'Цей похід справді виснажливий!','Про річ, що втомлює, — fatigant(e); randonnée жіночого роду, отже fatigante. Fatiguée описує людину.','fatigante — виснажлива',['épuisante','crevante'],'A'],
['A2','On se donne rendez-vous : je ___ mon ami à la gare à 18 h.',['retrouve','trouve','cherche','perds'],'Ми домовилися: я зустрічаюся з другом на вокзалі о 18:00.','retrouver qn — зустрітися з кимось за домовленістю; trouver — знайти.','retrouve — зустрічаю(ся) за домовленістю',['rejoins','vois'],'V'],

const BADPH=/^(de l’|sommes allés|te lèves|il y a une|moins le quart|et quart|midi et demi)$/;
const okTxt=q=>{const l=lemma(q),g=gloss(q);return /^[a-zàâäçéèêëîïôöûùüÿœæ’\- …]+$/i.test(l)&&!/[A-Za-z]/.test(g)&&g.length>1&&g.length<=40&&!/[+/]/.test(l);};
const REVQ=Q.filter(q=>okTxt(q)&&!/\s/.test(lemma(q))&&'NVAD'.includes(q.pos));

const PHSET=new Set(PHQ.map(q=>q.s));
const gk=g=>g.toLowerCase().split(/[\s,;]+/)[0].slice(0,5);
function mkRev(q){
  const ph=PHSET.has(q.s), L=lemma(q), G=gloss(q);
  let cand=(ph?PHQ:REVQ.filter(x=>x.pos===q.pos)).filter(x=>lemma(x)!==L&&gk(gloss(x))!==gk(G));
  const seen=new Set([L]), ds=[];
  for(const x of shuffle(cand.slice())){const l=lemma(x);if(seen.has(l))continue;seen.add(l);ds.push({w:l,g:gloss(x)});if(ds.length===3)break;}
  return {rev:true,base:q,s:q.s,l:q.l,pos:q.pos,ph,lem:L,g:G,ro:[{w:L,g:G},...ds]};
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cnt(l,p){return Q.filter(q=>(l==='all'||q.l===l)&&(p==='all'||q.pos===p)).length;}
function norm(s){return s.trim().toLowerCase().replace(/['`´]/g,'’').replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'');}
function strip(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae');}
function bestKey(){return S.mode+':'+S.level+':'+S.pos+':'+S.len;}
function loadBest(){try{return JSON.parse(localStorage.getItem('lemotjuste.best')||'{}');}catch(e){return {};}}
function saveBest(key,pct){try{const b=loadBest();if(!(b[key]>=pct)){b[key]=pct;localStorage.setItem('lemotjuste.best',JSON.stringify(b));}}catch(e){}}

function sentence(q,mode,word){
  const [b,a0]=q.s.split('___'); const right=q.o[0];
  const join=(w,rest)=>/['’]$/.test(w)?rest.replace(/^\s/,''):rest;
  if(mode==='blank') return esc(b)+'<span class="blank" role="img" aria-label="пропуск"></span>'+esc(a0);
  if(mode==='ok'){const w=word||right;return esc(b)+`<span class="fill ok">${esc(w)}</span>`+esc(join(w,a0));}
  return esc(b)+`<span class="fill bad">${esc(word)}</span> <span class="fill ok">${esc(right)}</span>`+esc(join(right,a0));
}

const MODES=[['choice','Обрати з варіантів'],['type','Вписати слово'],['rev','Слово за перекладом'],['phr','Вирази']];
const lvlName=k=>(LEVELS.find(x=>x[0]===k)||[])[1]||k;
const posName=k=>(POSES.find(x=>x[0]===k)||[])[1]||k;

function renderStart(){
  S.screen='start';
  const best=loadBest()[bestKey()];
  const total=poolFor().length, ec=errCount();
  app.innerHTML=`
  <div class="sheet">
    <h1 class="title">Le mot juste</h1>
    <p class="lead">Прочитай речення й підбери слово, яке пасує за змістом і граматикою. Пропуск може бути будь-якою частиною мови.</p>
    <div class="grp">
      <p class="summary">${MODES.find(m=>m[0]===S.mode)[1]} · ${lvlName(S.level)} · ${posName(S.pos)} · ${S.len} питань<br>${total===0?'Для цього поєднання речень поки немає: змінь налаштування.':(best!=null?`Найкращий результат: ${best}%`:'Ще немає результатів для цього набору.')}</p>
      <div class="row" style="margin-top:0">
        <button class="btn" data-act="start" ${total===0?'disabled':''}>Почати${total?` · ${Math.min(S.len,total)}`:''}</button>
        ${ec?`<button class="btn ghost" data-act="errs">Мої помилки · ${ec}</button>`:''}
        <button class="btn ghost" data-act="menu">Налаштування</button>
      </div>
    </div>
  </div>`;
}

function begin(pool){
  S.pool=pool; S.i=0; S.score=0; S.wrong=[]; S.locked=false; S.hints=0;
  renderQ();
}
function start(){
  S.src='';
  const rv=S.mode==='rev'||S.mode==='phr';
  begin(shuffle(poolFor().slice()).slice(0,S.len).map(q=>rv?mkRev(q):q));
}
function startErrs(){
  const E=loadErrs();
  const keys=shuffle(Object.keys(E)).sort((a,b)=>E[b].n-E[a].n).slice(0,S.len);
  const items=keys.map(k=>{const r=k.startsWith('r:'),q=QS.get(r?k.slice(2):k);return q?(r?mkRev(q):q):null;}).filter(Boolean);
  if(!items.length) return;
  S.src='errs'; begin(shuffle(items));
}
function retryWrong(){ begin(shuffle(S.wrong.map(w=>w.q))); }

function renderQ(){
  const q=S.pool[S.i], n=S.pool.length;
  S.locked=false; S.screen='q';
  if(q.rev){renderRev(q);return;}
  let input;
  if(S.mode==='choice'){
    S.opts=shuffle(q.o.map((w,k)=>({w,ok:k===0})));
    input=`<div class="opts${S.showTr?'':' notr'}" role="group" aria-label="Варіанти відповіді">
      ${S.opts.map((o,k)=>`<button class="opt" data-act="pick" data-k="${k}"><kbd>${k+1}</kbd><span class="ow">${esc(o.w)}<span class="otr">${esc(trw(o.w))}</span></span></button>`).join('')}
    </div>`;
  } else {
    input=`<div class="typebox">
      <div class="typerow">
        <input id="ans" type="text" lang="fr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Пропущене слово" placeholder="Впиши слово…">
        <button class="btn" id="check" data-act="check">Перевірити</button>
      </div>
      <div class="accents" id="accents" role="group" aria-label="Французькі літери">
        ${ACCENTS.map(c=>`<button class="acc" type="button" data-act="acc" data-c="${c}" aria-label="Вставити ${c}">${c}</button>`).join('')}
      </div>
      <p class="hintp" id="hint" hidden></p>
      <button class="tog" id="hintbtn" data-act="hint" style="margin-top:10px">Підказка</button>
    </div>`;
  }
  app.innerHTML=`
  <div class="top"><span>Питання ${S.i+1} з ${n} · ${q.l}</span><span class="r"><span>Правильно: <span id="sc">${S.score}</span></span><button class="tog" data-act="tr" aria-pressed="${S.showTr}">Переклад: ${S.showTr?'так':'ні'}</button></span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><i style="width:${S.i/n*100}%"></i></div>
  <div class="sheet"><p class="sentence" id="sent">${sentence(q,'blank')}</p>${S.showTr?`<p class="sent-tr" id="srtr">${esc(q.t)}</p>`:''}</div>
  ${input}
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="row" id="nextrow" hidden><button class="btn" id="next" data-act="next">${S.i+1<n?'Далі':'Результат'}</button></div>`;
  if(S.mode==='type'){const a=document.getElementById('ans'); if(a) a.focus({preventScroll:true});}
}

function renderRev(q){
  const n=S.pool.length;
  S.opts=shuffle(q.ro.map((x,k)=>({w:x.w,g:x.g,ok:k===0})));
  app.innerHTML=`
  <div class="top"><span>Питання ${S.i+1} з ${n} · ${q.l} · ${q.ph?'вираз':'слово'}</span><span class="r"><span>Правильно: <span id="sc">${S.score}</span></span></span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><i style="width:${S.i/n*100}%"></i></div>
  <div class="sheet"><p class="sent-tr" style="padding-bottom:4px">Як це сказати по-французьки?</p><p class="sentence" id="sent">«${esc(q.g)}»</p><p class="sent-tr">${POSNAME[q.pos]||''}</p></div>
  <div class="opts notr" role="group" aria-label="Варіанти відповіді">
    ${S.opts.map((o,k)=>`<button class="opt" data-act="pick" data-k="${k}"><kbd>${k+1}</kbd><span class="ow">${esc(o.w)}<span class="otr">${esc(o.g)}</span></span></button>`).join('')}
  </div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="row" id="nextrow" hidden><button class="btn" id="next" data-act="next">${S.i+1<n?'Далі':'Результат'}</button></div>`;
}
function pickRev(k){
  const q=S.pool[S.i], o=S.opts[k];
  document.querySelector('.opts').classList.add('done');
  document.querySelectorAll('.opt').forEach((b,idx)=>{b.disabled=true;if(S.opts[idx].ok)b.classList.add('correct');else if(idx===k)b.classList.add('wrong');else b.classList.add('dim');});
  S.locked=true;
  if(o.ok) S.score++; else S.wrong.push({q,chosen:o.w,cg:o.g});
  record('r:'+q.s,o.ok);
  document.getElementById('sc').textContent=S.score;
  const b=q.base;
  document.getElementById('fb').innerHTML=`<div class="card ${o.ok?'ok':'bad'}">
    <p class="verdict">${o.ok?'Правильно.':'Не зовсім. Правильно: '+esc(q.lem)+'.'}</p>
    ${o.ok?'':`<p class="why">Ти обрав: <b>${esc(o.w)}</b> — ${esc(o.g)}.</p>`}
    <p class="word"><b>${esc(q.lem)} — ${esc(q.g)}</b> <span class="poslab">${POSNAME[q.pos]||''}</span></p>
    <p class="ex">Приклад: ${sentence(b,'ok')}</p><p class="tr">${esc(b.t)}</p></div>`;
  document.getElementById('nextrow').hidden=false; document.getElementById('next').focus();
}

function feedback(q,kind,note,shown){
  const right=q.o[0];
  const verdict = kind==='ok' ? (note||'Правильно.') : 'Не зовсім. Правильна відповідь: '+right;
  const tw=trw(shown||''), tr0=trw(right)||gloss(q);
  const why = (kind==='bad'&&shown&&tw) ? `<p class="why">Ти обрав: <b>${esc(shown)}</b> — ${esc(tw)}. Тут потрібне: <b>${esc(right)}</b> — ${esc(tr0)}.</p>` : '';
  const extra = (kind==='bad' && S.mode==='type') ? `<button class="btn ghost small" data-act="accept">Моя відповідь теж підходить — зарахувати</button>` : '';
  document.getElementById('fb').innerHTML=`<div class="card ${kind}">
    <p class="verdict">${esc(verdict)}</p>
    ${why}<p class="word"><b>${esc(mx(q).w)}</b> <span class="poslab">${POSNAME[q.pos]||''}</span></p>
    ${S.showTr?'':`<p class="tr">${esc(q.t)}</p>`}<p class="ex"${mx(q).e?'':' hidden'}>${esc(mx(q).e)}</p>${extra}</div>`;
  document.getElementById('nextrow').hidden=false;
  document.getElementById('next').focus();
}

function finish(q,ok,shown,note){
  S.locked=true;
  if(ok) S.score++; else S.wrong.push({q,chosen:shown});
  document.getElementById('sc').textContent=S.score;
  document.getElementById('sent').innerHTML= ok ? sentence(q,'ok',shown) : sentence(q,'bad',shown);
  record(q.s,ok);
  feedback(q,ok?'ok':'bad',note,shown);
}

function pick(k){
  const q0=S.pool[S.i];
  if(S.locked||!q0||!(S.mode==='choice'||q0.rev)) return;
  if(q0.rev){pickRev(k);return;}
  const q=q0, o=S.opts[k];
  document.querySelector('.opts')?.classList.add('done');
  document.querySelectorAll('.opt').forEach((b,idx)=>{
    b.disabled=true;
    if(S.opts[idx].ok) b.classList.add('correct');
    else if(idx===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  finish(q,o.ok,o.w);
}

function check(){
  if(S.locked||S.mode!=='type') return;
  const inp=document.getElementById('ans'); const v=inp.value;
  if(!norm(v)){inp.focus();return;}
  const q=S.pool[S.i], t=norm(v), answers=[q.o[0],...q.alt];
  let hit=answers.find(a=>norm(a)===t), loose=false;
  if(!hit){hit=answers.find(a=>strip(norm(a))===strip(t)); loose=!!hit;}
  inp.disabled=true; document.getElementById('check').disabled=true;
  document.querySelectorAll('.acc,#hintbtn').forEach(b=>b.disabled=true);
  if(hit){
    let note=null;
    if(loose) note='Майже ідеально: пиши з діакритикою — '+hit+'.';
    else if(hit!==q.o[0]) note='Теж підходить. У тексті було слово: '+q.o[0]+'.';
    finish(q,true,hit,note);
  } else {
    finish(q,false,v.trim());
  }
}

function accept(){
  const q=S.pool[S.i]; const last=S.wrong[S.wrong.length-1];
  if(!last||last.q!==q) return;
  const mine=last.chosen;
  S.wrong.pop(); S.score++;
  {const E=loadErrs();if(E[q.s]){E[q.s].n--;if(E[q.s].n<=0)delete E[q.s];saveErrs(E);}}
  document.getElementById('sc').textContent=S.score;
  document.getElementById('sent').innerHTML=sentence(q,'ok',mine);
  const card=document.querySelector('#fb .card');
  card.className='card ok';
  card.querySelector('.verdict').textContent='Зараховано. У тексті було слово: '+q.o[0]+'.';
  card.querySelector('[data-act="accept"]')?.remove();
}

function hint(){
  if(S.locked) return;
  const q=S.pool[S.i], w=q.o[0], el=document.getElementById('hint');
  S.hints++;
  const letters=w.replace(/[^A-Za-zÀ-ÿœŒ]/g,'').length;
  el.hidden=false;
  el.textContent='Починається на «'+w.charAt(0)+'», літер: '+letters+'. Значення: '+q.m.split('—')[1].trim()+'.';
}

function next(){
  if(!S.locked) return;
  S.i++;
  if(S.i<S.pool.length) renderQ(); else renderResults();
  window.scrollTo({top:0});
}

function renderResults(){
  S.screen='res';
  const n=S.pool.length, pct=Math.round(S.score/n*100);
  if(S.src!=='errs') saveBest(bestKey(),pct);
  const msg = pct>=90?'Voilà — майже без помилок. Можна переходити на складніший рівень чи режим.'
    : pct>=70?'Добре. Помилки нижче — саме те, що варто повторити.'
    : pct>=40?'Непогано для початку. Перечитай пояснення до помилок і спробуй ще раз.'
    : 'Це нормально: такі слова легко плутати. Переглянь пояснення й пройди раунд повторно.';
  const hintsLine = (S.mode==='type'&&S.hints)?` Підказок використано: ${S.hints}.`:'';
  app.innerHTML=`
  <div class="sheet">
    <p class="score">${S.score} <small>з ${n}</small></p>
    <p class="rmsg">${msg}${hintsLine}</p>
    <div class="row">
      <button class="btn" data-act="start">Новий раунд</button>
      ${S.wrong.length?`<button class="btn ghost" data-act="retry">Повторити помилки (${S.wrong.length})</button>`:''}
      <button class="btn ghost" data-act="menu">Налаштування</button>
    </div>
  </div>
  ${S.wrong.length?`<div class="review"><h2>Над чим попрацювати (${S.wrong.length})</h2>
    ${S.wrong.map(w=>w.q.rev?`<div class="item"><p class="s">«${esc(w.q.g)}»</p><p class="word"><b>${esc(w.q.lem)}</b> <span class="poslab">${POSNAME[w.q.pos]||''}</span></p><p class="ex">Ти обрав: ${esc(w.chosen)} — ${esc(w.cg||'')}</p><p class="tr">${sentence(w.q.base,'ok')}</p></div>`:`<div class="item"><p class="s">${sentence(w.q,'bad',w.chosen)}</p><p class="tr">${esc(w.q.t)}</p><p class="word"><b>${esc(mx(w.q).w)}</b> <span class="poslab">${POSNAME[w.q.pos]||''}</span></p>${mx(w.q).e?`<p class="ex">${esc(mx(w.q).e)}</p>`:''}</div>`).join('')}
  </div>`:''}`;
}


/* ---------- Довідник ---------- */
function renderRef(){
  app.innerHTML=`
  <div class="sheet">
    <h1 class="title">Довідник</h1>
    <p class="lead">Усі речення з правильним словом на місці пропуску. Шукай за словом чи реченням — французькою або українською.</p>
    <div class="grp"><input class="search" id="rq" type="search" placeholder="Знайти слово або речення…" value="${esc(R.q)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Пошук">
      <p class="summary" style="margin-top:12px">${lvlName(R.level)} · ${posName(R.pos)}${R.hide?' · слова приховано':''}${R.sort==='abc'?' · за алфавітом':''}</p>
      <button class="btn ghost small" data-act="menu" style="margin-top:0">Фільтри</button>
    </div>
  </div>
  <p class="count" id="rcount" aria-live="polite"></p>
  <div id="rlist"></div>
  <div class="row" id="rmore"></div>`;
  fillRefList();
}

function fillRefList(){
  const qn=strip(R.q.trim().toLowerCase().replace(/['`´]/g,'’'));
  let list=Q.filter(q=>(R.level==='all'||q.l===R.level)&&(R.pos==='all'||q.pos===R.pos));
  if(qn){
    list=list.filter(q=>strip((q.s+' '+q.o[0]+' '+q.alt.join(' ')+' '+q.t+' '+q.m+' '+q.e).toLowerCase()).includes(qn));
  }
  if(R.sort==='abc') list=list.slice().sort((a,b)=>strip(a.o[0].toLowerCase()).localeCompare(strip(b.o[0].toLowerCase()),'fr'));
  document.getElementById('rcount').textContent='Знайдено: '+list.length+(list.length?'':'. Спробуй інше слово чи зніми фільтри.');
  const shown=list.slice(0,R.n);
  document.getElementById('rlist').innerHTML=shown.map(q=>`
    <article class="rc${R.hide?' hid':''}" data-act="rev">
      <p class="s"><span class="sa">${sentence(q,'ok')}</span><span class="sb">${sentence(q,'blank')}</span></p>
      <p class="tr">${esc(q.t)}</p>
      <p class="word rv"><b>${esc(q.m)}</b> <span class="poslab">${POSNAME[q.pos]||''} · ${q.l}</span></p>
      ${q.alt.length?`<p class="ex rv">Також підходить: ${esc(q.alt.join(', '))}</p>`:''}
      <p class="ex rv">${esc(q.e)}</p>
    </article>`).join('');
  document.getElementById('rmore').innerHTML = list.length>R.n ? `<button class="btn ghost" data-act="rmore">Показати ще (${list.length-R.n})</button>` : '';
}

function setView(v){
  if(v===S.view) return;
  if(S.view==='quiz') S.snap=app.innerHTML;
  S.view=v;
  document.getElementById('crumb').textContent=v==='ref'?'Довідник':'Тест';
  if(v==='ref') renderRef();
  else if(S.snap){app.innerHTML=S.snap;const a=document.getElementById('ans');if(a&&!a.disabled)a.focus({preventScroll:true});}
  else renderStart();
  window.scrollTo({top:0});
}

/* ---------- Меню (гамбургер) ---------- */
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim'), burger=document.getElementById('burger'), dbody=document.getElementById('dbody');
function drawerOpen(){return drawer.classList.contains('open');}
function chipsHtml(items,cur,act){return items.map(([k,n])=>`<button class="chip" data-d="${act}" data-v="${k}" aria-pressed="${cur===k}">${n}</button>`).join('');}
function posSelect(cur,act,lvl){return `<select class="sel" data-d="${act}" aria-label="Частина мови">${POSES.map(([k,n])=>`<option value="${k}"${cur===k?' selected':''}>${n} · ${cnt(lvl,k)}</option>`).join('')}</select>`;}

function renderDrawer(){
  const v=S.view; let h=`<div class="dsec"><h3>Розділи</h3><div class="dnav">
    <button class="dnavb" data-d="view" data-v="quiz" aria-current="${v==='quiz'}">Тест</button>
    <button class="dnavb" data-d="view" data-v="ref" aria-current="${v==='ref'}">Довідник</button></div></div>`;
  if(v==='quiz'){
    const total=poolFor().length, ec=errCount();
    h+=`<div class="dsec"><h3>Режим</h3><div class="chips">${chipsHtml(MODES,S.mode,'mode')}</div></div>
    <div class="dsec"><h3>Рівень</h3><div class="chips">${LEVELS.map(([k,n])=>`<button class="chip" data-d="level" data-v="${k}" aria-pressed="${S.level===k}">${n} · ${cnt(k,S.pos)}</button>`).join('')}</div></div>
    <div class="dsec"><h3>Частина мови</h3>${posSelect(S.pos,'pos',S.level)}</div>
    <div class="dsec"><h3>Питань у раунді</h3><div class="chips">${[10,20,40,80].map(n=>`<button class="chip" data-d="len" data-v="${n}" aria-pressed="${S.len===n}">${n}</button>`).join('')}</div></div>
    <div class="dsec"><button class="btn" data-d="start" ${total===0?'disabled':''} style="width:100%">Почати новий раунд${total?` · ${Math.min(S.len,total)}`:''}</button>
    ${ec?`<button class="btn ghost" data-d="errs" style="width:100%;margin-top:8px">Мої помилки · ${ec}</button>`:''}
    <p class="dnote">${total===0?'Для цього поєднання речень поки немає.':(S.screen==='q'?'Новий раунд замінить поточний.':'Налаштування застосовуються до наступного раунду.')}</p></div>`;
  } else {
    h+=`<div class="dsec"><h3>Рівень</h3><div class="chips">${LEVELS.map(([k,n])=>`<button class="chip" data-d="rl" data-v="${k}" aria-pressed="${R.level===k}">${n} · ${cnt(k,R.pos)}</button>`).join('')}</div></div>
    <div class="dsec"><h3>Частина мови</h3>${posSelect(R.pos,'rp',R.level)}</div>
    <div class="dsec"><h3>Показ</h3><div class="chips">
      <button class="chip" data-d="rhide" aria-pressed="${R.hide}">Приховати слова</button>
      <button class="chip" data-d="rsort" aria-pressed="${R.sort==='abc'}">За алфавітом</button></div>
    <p class="dnote">«Приховати слова» — самоперевірка: торкнись речення, щоб побачити слово.</p></div>`;
  }
  dbody.innerHTML=h;
}
function openDrawer(){
  renderDrawer();
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false'); scrim.hidden=false;
  burger.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden';
  document.getElementById('dclose').focus();
}
function closeDrawer(){
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); scrim.hidden=true;
  burger.setAttribute('aria-expanded','false'); document.body.style.overflow='';
}
function quizSettingsChanged(){ if(S.view==='quiz'&&S.screen==='start') renderStart(); renderDrawer(); }
burger.addEventListener('click',()=>{drawerOpen()?closeDrawer():openDrawer();});
document.getElementById('dclose').addEventListener('click',()=>{closeDrawer();burger.focus();});
scrim.addEventListener('click',()=>{closeDrawer();});
dbody.addEventListener('click',e=>{
  const b=e.target.closest('[data-d]'); if(!b||b.tagName==='SELECT') return;
  const d=b.dataset.d, v=b.dataset.v;
  if(d==='view'){closeDrawer();setView(v);}
  else if(d==='mode'){S.mode=v;quizSettingsChanged();}
  else if(d==='level'){S.level=v;quizSettingsChanged();}
  else if(d==='len'){S.len=+v;quizSettingsChanged();}
  else if(d==='start'){closeDrawer();start();window.scrollTo({top:0});}
  else if(d==='errs'){closeDrawer();startErrs();window.scrollTo({top:0});}
  else if(d==='rl'){R.level=v;R.n=40;renderRef();renderDrawer();}
  else if(d==='rhide'){R.hide=!R.hide;renderRef();renderDrawer();}
  else if(d==='rsort'){R.sort=R.sort==='abc'?'level':'abc';R.n=40;renderRef();renderDrawer();}
});
dbody.addEventListener('change',e=>{
  const t=e.target; if(!t.matches('select[data-d]')) return;
  if(t.dataset.d==='pos'){S.pos=t.value;quizSettingsChanged();}
  else if(t.dataset.d==='rp'){R.pos=t.value;R.n=40;renderRef();renderDrawer();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerOpen()){closeDrawer();burger.focus();}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='rq'){R.q=e.target.value;R.n=40;fillRefList();}});

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='menu'){openDrawer();}
  else if(act==='rmore'){R.n+=40;fillRefList();}
  else if(act==='rev'){if(b.classList.contains('hid'))b.classList.toggle('rev');}
  else if(act==='start'){start();window.scrollTo({top:0});}
  else if(act==='retry'){retryWrong();window.scrollTo({top:0});}
  else if(act==='errs'){startErrs();window.scrollTo({top:0});}
  else if(act==='home'){renderStart();}
  else if(act==='pick'){pick(+b.dataset.k);}
  else if(act==='check'){check();}
  else if(act==='accept'){accept();}
  else if(act==='hint'){hint();}
  else if(act==='acc'){
    const inp=document.getElementById('ans'); if(!inp||inp.disabled) return;
    const c=b.dataset.c, s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;
    inp.value=inp.value.slice(0,s)+c+inp.value.slice(en);
    inp.focus(); inp.setSelectionRange(s+c.length,s+c.length);
  }
  else if(act==='next'){next();}
  else if(act==='tr'){
    S.showTr=!S.showTr; b.setAttribute('aria-pressed',S.showTr); b.textContent='Переклад: '+(S.showTr?'так':'ні');
    document.querySelector('.opts')?.classList.toggle('notr',!S.showTr);
    const q=S.pool[S.i], sh=document.querySelector('.sheet'), ex=document.getElementById('srtr');
    if(S.showTr&&!ex){const p=document.createElement('p');p.className='sent-tr';p.id='srtr';p.textContent=q.t;sh.appendChild(p);}
    if(!S.showTr&&ex){ex.remove();}
    if(S.locked){
      document.querySelector('#fb .tr')?.remove();
      if(!S.showTr){document.querySelector('#fb .ex').insertAdjacentHTML('beforebegin','<p class="tr">'+esc(q.t)+'</p>');}
    }
  }
});
document.addEventListener('keydown',e=>{
  if(drawerOpen()||S.view!=='quiz'||!document.getElementById('sent')) return;
  if((S.mode==='choice'||(S.pool[S.i]&&S.pool[S.i].rev)) && !S.locked && /^[1-4]$/.test(e.key)){const k=+e.key-1;if(S.opts[k])pick(k);}
  if(S.mode==='type' && e.key==='Enter' && e.target&&e.target.id==='ans'){e.preventDefault();check();}
});

renderStart();
</script>
</body>
</html>
